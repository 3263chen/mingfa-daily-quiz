<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法硕每日一题刷题 · 民法 / 法制史</title>
<style>
:root { --bg:#f5f6fa; --card:#fff; --line:#e3e6ef; --main:#3b6fe0; --ok:#18a058; --err:#d03050; --warn:#d99a2b; --text:#2b2f36; --muted:#8a90a0; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
.wrap { max-width:1000px; margin:0 auto; padding:16px; }
header { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:14px 0; border-bottom:2px solid var(--line); }
header h1 { font-size:20px; margin:0; }
header .sub { color:var(--muted); font-size:13px; }
#stats { margin:10px 0; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:10px; font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 16px; }
#stats b { color:var(--text); }
.toolbar { display:flex; gap:10px; margin:14px 0; flex-wrap:wrap; }
button { font-size:14px; padding:8px 16px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; cursor:pointer; }
button:hover { border-color:var(--main); color:var(--main); }
button.primary { background:var(--main); color:#fff; border-color:var(--main); }
button.primary:hover { opacity:.9; color:#fff; }
button:disabled { opacity:.5; cursor:not-allowed; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
.q-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.q-num { background:var(--main); color:#fff; border-radius:8px; padding:3px 10px; font-weight:bold; font-size:14px; }
.q-day { color:var(--muted); font-size:13px; }
.q-progress { color:var(--main); font-size:13px; font-weight:bold; }
.pbar { height:6px; background:#eef0f6; border-radius:4px; overflow:hidden; margin-bottom:10px; }
.pbar-fill { height:100%; background:var(--main); border-radius:4px; transition:width .2s; }
.no-opt-hint { margin:10px 0 4px; padding:10px 12px; background:#fff7e6; border:1px solid #f0dfbd; border-radius:10px; color:#8a5a00; font-size:13px; line-height:1.6; }
.gen-tag { display:inline-block; margin-left:8px; padding:1px 8px; border-radius:10px; background:#eef3fe; border:1px solid var(--main); color:var(--main); font-size:11px; vertical-align:2px; }
.q-link { margin-left:auto; color:var(--main); font-size:13px; text-decoration:none; }
.q-stem { font-size:16px; line-height:1.7; margin:10px 0 14px; white-space:pre-wrap; }
.opt { display:block; width:100%; text-align:left; margin:8px 0; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#fafbfe; font-size:15px; line-height:1.6; cursor:pointer; }
.opt:hover { border-color:var(--main); }
.opt.selected { border-color:var(--main); background:#eef3fe; }
.opt.correct { border-color:var(--ok); background:#e8f8ef; }
.opt.wrong { border-color:var(--err); background:#fdeef1; }
.opt .k { font-weight:bold; margin-right:8px; color:var(--main); }
.answer { margin-top:14px; padding:12px 14px; border-radius:10px; background:#fdf6ea; border:1px solid #f0dfbd; display:none; white-space:pre-wrap; line-height:1.7; font-size:14px; }
.answer.show { display:block; }
.answer .ref { color:var(--warn); font-weight:bold; }
.verdict { margin-top:10px; font-weight:bold; font-size:15px; }
.v-ok { color:var(--ok); } .v-no { color:var(--err); }
.assess { margin-top:12px; display:flex; gap:10px; flex-wrap:wrap; }
.mark { margin-top:10px; }
.mark.on { background:#fff7e6; border-color:var(--warn); color:var(--warn); }
.summary { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; text-align:center; }
.summary .big { font-size:22px; margin:8px 0; }
.hidden { display:none; }
.layout { display:flex; gap:16px; align-items:flex-start; }
main { flex:1; min-width:0; }
aside { width:280px; flex-shrink:0; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 10px; }
aside h3 { font-size:13px; margin:12px 0 8px; color:var(--muted); }
aside h3:first-child { margin-top:0; }
.side-list { max-height:300px; overflow-y:auto; font-size:12px; }
.side-empty { color:var(--muted); font-size:12px; padding:6px 4px; }
.side-item { display:block; width:100%; text-align:left; padding:6px 8px; margin:3px 0; border:1px solid var(--line); border-radius:6px; background:#fafbfe; cursor:pointer; font-size:12px; line-height:1.5; }
.side-item:hover { border-color:var(--main); color:var(--main); }
.side-item .t { color:var(--muted); font-size:11px; }
.side-book-btn { background:var(--main); color:#fff; border-color:var(--main); text-align:center; margin-bottom:12px; }
.side-book-btn:hover { background:var(--main); color:#fff; opacity:.9; }
@media (max-width:760px) { .layout { flex-direction:column; } aside { width:100%; } }
.foot { text-align:center; color:var(--muted); font-size:12px; margin:20px 0; }
.sync-line { font-size:12px; color:var(--muted); margin:-2px 0 10px; }
.sync-line .ok { color:var(--ok); } .sync-line .no { color:var(--warn); }
/* 作者头像动画 */
.author-avatar {
  width:44px; height:44px; border-radius:50%; object-fit:cover;
  border:2px solid #fff; box-shadow:0 0 0 2px var(--main), 0 4px 14px rgba(59,111,224,.35);
  display:block; flex:none; cursor:pointer;
  animation:avatarFloat 3.8s ease-in-out infinite;
}
.author-avatar:hover {
  animation-play-state:paused;
  filter:saturate(1.15) brightness(1.05);
  box-shadow:0 0 0 3px var(--main), 0 0 20px rgba(59,111,224,.55);
}
@keyframes avatarFloat {
  0%,100% { transform:translateY(0) rotate(0deg) scale(1); }
  25% { transform:translateY(-3px) rotate(-2deg) scale(1.04); }
  50% { transform:translateY(0) rotate(0deg) scale(1); }
  75% { transform:translateY(-3px) rotate(2deg) scale(1.04); }
}
@media (prefers-reduced-motion: reduce) { .author-avatar { animation:none; } }
/* 开场动画 */
.intro-mask {
  position:fixed; inset:0; z-index:9999; overflow:hidden;
  background:linear-gradient(160deg,#f5f6fa 0%,#eaf1fd 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:26px; padding:24px; text-align:center; cursor:pointer;
  opacity:1; transition:opacity .5s ease;
}
.intro-mask.hide { opacity:0; pointer-events:none; }
.intro-avatar {
  width:min(260px,60vw,42vh); height:min(260px,60vw,42vh); border-radius:50%; object-fit:cover;
  border:6px solid #fff; box-shadow:0 0 0 4px var(--main), 0 14px 50px rgba(59,111,224,.45);
  animation:introAvatarPop 1.15s cubic-bezier(.34,1.56,.64,1) both, introWiggle 2.2s ease-in-out 1.4s infinite;
}
@keyframes introAvatarPop {
  0% { transform:scale(0) rotate(-40deg); opacity:0; }
  55% { transform:scale(1.18) rotate(10deg); opacity:1; }
  75% { transform:scale(.92) rotate(-5deg); }
  100% { transform:scale(1) rotate(0deg); opacity:1; }
}
@keyframes introWiggle {
  0%,100% { transform:rotate(0deg) scale(1); }
  20% { transform:rotate(-6deg) scale(1.03); }
  40% { transform:rotate(6deg) scale(1.03); }
  60% { transform:rotate(-4deg) scale(1.01); }
  80% { transform:rotate(4deg) scale(1.01); }
}
.intro-gag {
  position:relative; max-width:min(620px,90vw); padding:18px 30px; border-radius:22px;
  background:#fff; border:3px solid #ffc53d;
  box-shadow:0 12px 34px rgba(0,0,0,.14);
  font-size:clamp(20px,5vw,32px); font-weight:900; color:#d03050; letter-spacing:2px; line-height:1.4;
  transform:rotate(-2deg);
  animation:introGagIn .7s cubic-bezier(.34,1.56,.64,1) .4s both, gagBounce 1.3s ease-in-out 1.8s infinite;
}
.intro-gag::before {
  content:''; position:absolute; top:-13px; left:50%; margin-left:-11px;
  border:11px solid transparent; border-top:0; border-bottom:13px solid #ffc53d;
}
.intro-gag::after {
  content:''; position:absolute; top:-8px; left:50%; margin-left:-8px;
  border:8px solid transparent; border-top:0; border-bottom:10px solid #fff;
}
@keyframes introGagIn {
  0% { opacity:0; transform:rotate(-2deg) scale(.4) translateY(20px); }
  60% { opacity:1; transform:rotate(3deg) scale(1.08) translateY(-4px); }
  100% { opacity:1; transform:rotate(-2deg) scale(1) translateY(0); }
}
@keyframes gagBounce {
  0%,100% { transform:rotate(-2deg) translateY(0); }
  50% { transform:rotate(-2deg) translateY(-7px); }
}
.intro-hint {
  margin-top:6px; font-size:14px; font-weight:bold; color:var(--main); opacity:0;
  animation:hintBlink 1.6s ease-in-out 1s infinite;
}
@keyframes hintBlink {
  0%,100% { opacity:.25; transform:scale(.98); }
  50% { opacity:1; transform:scale(1.05); }
}
@media (prefers-reduced-motion: reduce) {
  .intro-mask { display:none; }
}

/* 模块切换 */
.mod-tabs { display:flex; gap:10px; margin:14px 0 4px; flex-wrap:wrap; }
.mod-tab { font-size:14px; padding:8px 18px; border-radius:20px; border:1px solid var(--line); background:var(--card); color:var(--muted); cursor:pointer; font-weight:600; }
.mod-tab:hover { border-color:var(--main); color:var(--main); }
.mod-tab.active { background:var(--main); color:#fff; border-color:var(--main); }
.mod-tab .cnt { font-size:11px; opacity:.8; margin-left:4px; font-weight:400; }
</style>
</head>

<div class="intro-mask" id="introMask" role="button" aria-label="点击任意处开始做题">

<header>

      </header>

<div class="foot" style="margin-top:-14px;font-size:15px;font-weight:600;color:var(--text);opacity:1">deepseek携手马基雅无力制作</div>
    </main>
  </div>
</div>

.com/2685653721/R1WB93uad"},{"num":123,"day":"2026-06-01","stem":"车大海将豪车出租于马壮壮使用，马壮壮甚为喜爱，遂作价直接购买。二人签订买卖合同时，物权即发生变动，该交付方式是指示交付。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"答案：错误。承租人先占有租赁物后购买，属于简易交付（《民法典》第226条），不是指示交付。","auto":"B","link":"https://weibo.com/2685653721/R23Fw69Mq"},{"num":124,"day":"2026-06-01","stem":"车大海向岳小帅借款10万元，约定以车大海的劳力士手表设定质押。但由于车大海需用劳力士手表炫富，故双方约定：“车大海继续使用该手表2个月，但应当支付租金600元，以代替交付。”岳小帅对该手表可取得动产质权。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"答案：错误。占有改定不发生占有的现实转移，动产质权以交付（转移占有）为设立要件，以占有改定方式不能设立动产质权。","auto":"B","link":"https://weibo.com/2685653721/R261DAuuj"},{"num":125,"day":"2026-06-02","stem":"车某有A车，以市场价格出卖于岳某，车某受领价款并完成交付，但未办过户登记。此时，岳某不能取得所有权。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。对于特殊动产，交付时发生物权变动，登记只是对抗要件。","auto":"B","link":"https://weibo.com/2685653721/R2d60AXBY"},{"num":126,"day":"2026-06-02","stem":"甲乙签订了房屋买卖合同，甲如约交付房屋于乙，但在办理登记之前甲反悔，拒绝过户登记。此时，房屋所有权未发生变动，买卖合同也应当认定无效。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。因未完成登记程序，房屋所有权未发生变动，但甲乙签订的买卖合同仍应当认定有效。","auto":"B","link":"https://weibo.com/2685653721/R2fs8qqxp"},{"num":127,"day":"2026-06-03","stem":"因人民法院的判决导致物权设立、变更、转让或者消灭的，自法院作出判决时即可发生效力。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。因人民法院、仲裁机构的法律文书或者人民政府的征收决定等，导致物权设立、变更、转让或者消灭的，自法律文书或者人民政府的征收决定等生效时发生效力。","auto":"B","link":"https://weibo.com/2685653721/R2mwvt6nB"},{"num":128,"day":"2026-06-03","stem":"因建造房屋等事实行为设立或者消灭物权的，自事实行为成就时发生效力。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。只有合法建造才能取得物权。","auto":"B","link":"https://weibo.com/2685653721/R2oSDAaTH"},{"num":129,"day":"2026-06-04","stem":"依照继承取得动产物权的，处分该物权时，未经交付，不发生物权效力。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"正确。依照继承取得动产物权的，处分该物权时，未经交付，不发生物权效力。继承取得物权自继承开始时生效（民法典第230条），但处分时仍须交付（民法典第224条）；第232条的登记要求仅针对法律规定需要办理登记的财产（不动产等）。注：博主原答案误为“错误”，本题依据民法典第224、230、232条修正。","auto":"A","link":"https://weibo.com/2685653721/R2vX0lfSE"},{"num":130,"day":"2026 day":"2026-08-02","stem":"小花与大壮签订了服务合同。因小花提供的服务严重不符合合同目的，大壮以对方根本违约为由通知对方解除合同。小花认为其提供了优质服务，提起异议诉讼请求法院确认合同未解除。法院最终判决确认合同解除，请问合同何时被解除？","options":[{"k":"A","t":"人民法院或者仲裁机构作出确认合同解除判决之日"},{"k":"B","t":"起诉"}],"answerRef":"D。当事人一方依法主张解除合同的，应当通知对方。合同自通知到达对方时解除。","auto":"D","link":"https://weibo.com/2685653721/RbuaiA7F0"},{"num":248,"day":"2026-08-02","stem":"人民法院查明约定的违约金过分高于造成的损失的，可以依法予以适当减少。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。约定的违约金过分高于造成的损失的，人民法院或者仲裁机构可以根据当事人的请求予以适当减少。","auto":"B","link":"https://weibo.com/2685653721/RbwwqqH84"},{"num":249,"day":"2026-08-03","stem":"分期付款的买受人未支付到期价款的数额达到全部价款的五分之一，出卖人可以直接请求买受人支付全部价款或者解除合同。出卖人解除合同的，可以向买受人请求支付该标的物的使用费。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。买受人经催告后在合理期限内仍未支付到期价款的，出卖人可以请求买受人支付全部价款或者解除合同。","auto":"B","link":"https://weibo.com/2685653721/RbDANut3w"},{"num":250,"day":"2026-08-03","stem":"车某和马某许久不见，约定在北京饭店聚会，共花费1万元。车某付款后，表示“这顿饭就算我请你了。”马某称还是按照惯例AA制，三天内一定微信转账给车小花。第二天二人交恶，车某请求马某偿还5000元，马某则以是车某请客为由拒绝。哪方主张可以成立？","options":[{"k":"A","t":"车某"},{"k":"B","t":"马某"}],"answerRef":"车某。赠与合同是赠与人将自己的财产无偿给予受赠人，受赠人表示接受赠与的合同。马大花拒绝接受赠与的，赠与合同不成立。","auto":null,"link":"https://weibo.com/2685653721/RbFWVfxFO"},{"num":251,"day":"2026-08-04","stem":"赠与人的经济状况显著恶化，严重影响其生产经营或者家庭生活的，可以撤销赠与合同。该说法是否正确?","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。赠与人的经济状况显著恶化，严重影响其生产经营或者家庭生活的，可以不再履行赠与义务。","auto":"B","link":"https://weibo.com/2685653721/RbN1iidwD"},{"num":252,"day":"2026-08-04","stem":"借款合同对支付利息没有约定或约定不明确的，视为没有利息。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。自然人之间的借款合同对支付利息没有约定或约定不明确的，视为没有利息。其他借款合同对支付利息约定不明确，当事人不能达成补充协议的，按照当地或者当事人的交易方式、交易习惯、市场利率等因素确定利息。","auto":"B","link":"https://weibo.com/2685653721/RbPnq6Ark"},{"num":253,"day":"2026-08-05","stem":"保证合同是主债权债务合同的从合同。主债权债务合同无效的，保证合同无效，保证人有权主张免于承担责任。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。保证合同被确认无效后，债务人、保证人、债权人有过错的，应当根据其过错各自承担相应的民事责任。","auto":"B","link":"https://weibo.com/2685653721/RbWrN9g1A"},{"num":254,"day":"2026-08-05","stem":"一般保证合同约定“保证人承担保证责任直至主债务本息还清时为止”等类似内容的，视为约定不明，保证期间为主债务履行期届满之日起6个月。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"答案：正确。没有约定或者约定不明确的，保证期间为主债务履行期限届满之日起六个月。","auto":"A","link":"https://weibo.com/2685653721/RbYNUCunO"},{"num":255,"day":"2026-08-06","stem":"保证人在主债务履行期限届满后，向债权人提供债务人可供执行财产的真实情况，债权人放弃或者怠于行使权利致使该财产不能被执行的，保证人在其提供可供执行财产的价值范围内不再承担保证责任。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"答案：错误。只有一般保证人可以基于该规定免责。","auto":"B","link":"https://weibo.com/2685653721/Rc5Si0iGS"},{"num":256,"day":"2026-08-06","stem":"应收账款债权人就同一应收账款订立多个保理合同，致使多个保理人主张权利的，已经登记的先于未登记的取得应收账款；均已经登记的，按照登记时间的先后顺序取得应收账款；均未登记的，按照保理融资款或者服务报酬的比例取得应收账款。该说法是否正确?","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。保理均未登记的，由最先到达应收账款债务人的转让通知中载明的保理人取得应收账款；既未登记也未通知的，按照比例取得应收账款。","auto":"B","link":"https://weibo.com/2685653721/Rc8epwPzB"},{"num":257,"day":"2026-08-07","stem":"承揽人将其承揽工作交由第三人完成的，应当就该第三人完成的工作成果向定作人负责；未经定作人同意的，定作人也可以解除合同。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"答案：错误。承揽人将其承揽的主要工作交由第三人完成的，定作人才可以解除合同。","auto":"B","link":"https://weibo.com/2685653721/RcfiMABu7"},{"num":258,"day":"2026-08-07","stem":"承运人应当对运输过程中旅客的伤亡承担赔偿责任。即使因不可抗力造成的损害，承运人仍应当承担责任。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"正确。承运人应当对运输过程中旅客的伤亡承担赔偿责任；但是，伤亡是旅客自身健康原因造成的或者承运人证明伤亡是旅客故意、重大过失造成的除外。","auto":"A","link":"https://weibo.com/2685653721/RchEUnSis"},{"num":259,"day":"2026-08-08","stem":"结婚需要办理登记。未办理登记的事实婚姻，均不受我国法律保护，当事人之间不具有合法夫妻关系。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。1994 年2月1日前同居并符合结婚实质要件的，仍可认定为事实婚姻，当事人之间形成夫妻关系。","auto":"B","link":"https://weibo.com/2685653721/RcoJhom2W"},{"num":260,"day":"2026-08-08","stem":"小花和大壮一见钟情，未经父母同意即办理结婚登记。双方父母见面时才发现二人是失散多年的亲兄妹。二人同居期间所得的财产，由当事人协议处理;协议不成的，由人民法院根据照顾女方权益和无过错方的原则判决。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。无效的或者被撤销的婚姻自始没有法律约束力，当事人不具有夫妻的权利和义务。同居期间所得的财产，由当事人协议处理；协议不成的，由人民法院根据照顾无过错方的原则判决。","auto":"B","link":"https://weibo.com/2685653721/Rcr5ptdwK"},{"num":261,"day":"2026-08-09","stem":"小花和大壮结婚后夫妻恩爱。但小花在结婚登记五年后才发现，大壮隐瞒了自己患有艾滋病的事实。小花有权在一年内请求婚姻登记机构撤销该婚姻。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。一方患有重大疾病的，应当在结婚登记前如实告知另一方；不如实告知的，另一方可以向人民法院请求撤销婚姻。请求撤销婚姻的，应当自知道或者应当知道撤销事由之日起一年内提出。","auto":"B","link":"https://weibo.com/2685653721/Rcy9MiGXE"},{"num":262,"day":"2026-08-09","stem":"小花和大壮结婚后夫妻恩爱。后大壮婚内出轨，双方均同意离婚，可先办理离婚登记。二人对子女抚养和财产分割无法达成一致的，可提起诉讼请求人民法院判决。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。夫妻双方自愿离婚的，应当签订书面离婚协议，并亲自到婚姻登记机关申请离婚登记。离婚协议应当载明双方自愿离婚的意思表示和对子女抚养、财产以及债务处理等事项协商一致的意见。","auto":"B","link":"https://weibo.com/2685653721/RcAvUlmKi"},{"num":263,"day":"2026-08-10","stem":"甲与乙登记结婚，又与丙登记结婚，并生有一子。后甲与乙协议离婚。此时，甲和丙之间的婚姻转化为有效。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。尽管甲重婚的情形已经消灭，但因甲、丙涉嫌重婚犯罪，故甲与丙的婚姻仍应认定无效。","auto":"B","link":"https://weibo.com/2685653721/RcHAh6rkd"},{"num":264,"day":"2026-08-10","stem":"50岁的甲男与15岁的乙女“真心”相爱、登记结婚。甲和前妻所生之子丙（30周岁）觉得甲和乙的婚姻有伤风化，有权请求法院确认该婚姻无效。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。以未到法定婚龄为由请求确认婚姻无效的，利害关系人为未达法定婚龄者的近亲属，不包括已达法定婚龄一方的近亲属。","auto":"B","link":"https://weibo.com/2685653721/RcJWpeByG"},{"num":265,"day":"2026-08-11","stem":"50岁的甲男与15岁的乙女“真心”相爱、登记结婚。乙的父母提起诉讼请求确认婚姻无效。在法院审理期间，甲承诺赠送乙的父母别墅一套，乙的父母遂撤回起诉，人民法院不予准许。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"正确。人民法院受理请求确认婚姻无效案件后，原告申请撤诉的，不予准许。","auto":"A","link":"https://weibo.com/2685653721/RcR0M0Ncj"},{"num":266,"day":"2026-08-11","stem":"在和乙相亲时，甲声称取得了德国克莱登大学哲学博士，乙仰慕甲的学识，遂与甲登记结婚。半年后，乙发现甲的毕业证书系伪造。此时，因乙受欺诈，有权请求撤销婚姻。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。根据民法典规定，仅胁迫或隐瞒重大疾病缔结的婚姻，属于可撤销婚姻。甲虽虚构其学历背景，存在欺诈行为，但不影响婚姻的效力。","auto":"B","link":"https://weibo.com/2685653721/RcTmTu1Ro"},{"num":267,"day":"2026-08-12","stem":"甲婚后通过网聊结识乙，并与之发生婚外情，被甲妻发现。甲妻诉至法院，以甲违反忠实义务为由请求赔偿精神损害10万元，但未请求离婚。对于本案，人民法院不予受理。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"正确。根据《民法典》第1043条第2款规定，夫妻应当互相忠实，互相尊重，互相关爱。根据《婚姻家庭编解释(一)》第4条规定，当事人仅以民法典第1043条为依据提起诉讼的，人民法院不予受理;已经受理的，裁定驳回起诉。","auto":"A","link":"https://weibo.com/2685653721/Rd0rh7dQO"},{"num":268,"day":"2026-08-12","stem":"甲在婚内发表小说《今天》，离婚后实际获得稿费。该稿费属于夫妻共同财产。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"正确。婚内实际取得或者已经明确可以取得的知识产权上的财产性收益，属于夫妻共同财产。","auto":"A","link":"https://weibo.com/2685653721/Rd2NoiRZc"},{"num":269,"day":"2026-08-13","stem":"王某与赵某结婚。赵某在一次车祸中受重伤，依法获得了100万元的人身损害赔偿金。该赔偿金是赵某的个人财产。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"正确。一方因人身损害获得的赔偿及补偿，是赵某的个人财产。","auto":"A","link":"https://weibo.com/2685653721/Rd9RLlx5c"},{"num":270,"day":"2026-08-13","stem":"王某与赵某结婚。赵某在一次车祸中受重伤，在住院期间，许多亲朋好友来探望，共收礼1万多元。该礼金是为了看望王某而赠与，属于赵某的个人财产。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。赵某收到的探望礼金是婚后受赠所得的财产，属于夫妻共同财产。","auto":"B","link":"https://weibo.com/2685653721/RdcdTc7ug"},{"num":271,"day":"2026-08-14","stem":"甲、乙系夫妻。甲婚前继承了其父亲留下的房产，但在婚后才登记在甲名下。该房产为婚后实际取得，属于夫妻共同财产。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。因继承取得物权的，自继承开始时发生效力。甲在婚前于继承开始时即可取得房屋的所有权，即使婚后才登记于甲的名下，该房屋仍属于甲的婚前财产，为甲个人所有。","auto":"B","link":"https://weibo.com/2685653721/Rdjih97Q9"},{"num":272,"day":"2026-08-14","stem":"甲婚前有个人存款100万元。结婚后，以该婚前个人存款炒股，共获得收益20万元。该20万元收益属于婚前存款的孳息，属于甲的个人财产。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。炒股所得收益，是个人财产投资取得的收益，并非孳息，属于夫妻共同财产。","auto":"B","link":"https://weibo.com/2685653721/RdlEo39rJ"},{"num":273,"day":"2026-08-15","stem":"对亲子关系有异议且有正当理由的，成年子女可以向人民法院提起诉讼，请求否认亲子关系。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。父或者母可以向人民法院提起诉讼，请求否认亲子关系，成年子女无此权利。","auto":"B","link":"https://weibo.com/2685653721/RdsIL6USF"},{"num":274,"day":"2026-08-15","stem":"对亲子关系有异议且有正当理由的，成年子女可以向人民法院提起诉讼，请求确认亲子关系。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"正确。成年子女虽无权请求否认亲子关系，但有权请求确认亲子关系。","auto":"A","link":"https://weibo.com/2685653721/Rdv4SxXno"},{"num":275,"day":"2026-08-16","stem":"甲（18周岁）是某高中二年级学生，成绩优异。甲的父母以当今社会大学生难就业为由，希望甲辍学外出打工，早日挣钱补贴家用，拒绝向甲支付生活费。甲不同意，坚持要完成高中学业。因甲已经成年，故无权请求父母支付生活费等抚养费用。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。甲尚在校接受高中学历教育，属于不能独立生活的成年子女，依法有要求父母给付抚养费的权利。","auto":"B","link":"https://weibo.com/2685653721/RdC9gcg5K"},{"num":276,"day":"2026-08-16","stem":"甲是某大学法学专业学生，成绩优异，欲考研继续深造。甲的父母以学历贬值为由，反对甲考研，拒绝向甲支付生活费。虽甲已成年但尚未步入社会，有权请求父母支付生活费等抚养费用。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。父母的法定抚养义务的对象为“未成年子女或者不能独立生活的成年子女”。不能独立生活的成年子女，包括尚在校接受高中及其以下学历教育，或者丧失、部分丧失劳动能力等非因主观原因而无法维持正常生活的成年子女。甲显然不属于此范围，无权请求父母支付生活费等抚养费。","auto":"B","link":"https://weibo.com/2685653721/RdEvnrcJJ"},{"num":277,"day":"2026-08-17","stem":"甲与乙结婚后生育一女丙。但因甲婚内与他人同居，法院判决双方感情破裂而离婚，丙由乙实际抚养。离婚后，甲的父母非常想念孙女，认为其依法享有探望孙女的权利。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。离婚后，不直接抚养子女的父或母，有探望子女的权利。子女的祖父母即甲的父母并无法定的探望权。","auto":"B","link":"https://weibo.com/2685653721/RdLzKrGgR"},{"num":278,"day":"2026-08-17","stem":"甲、乙离婚并分割了共同财产。后甲发现乙在离婚时将属于夫妻共有的40万元存款转移到了乙兄的银行账户中，遂向人民法院起诉请求分割。因该40万元存款属于双方共有，故分割请求权不受诉讼时效限制。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。《民法典》第1092条规定:“夫妻一方隐藏、转移、变卖、毁损、挥霍夫妻共同财产，或者伪造夫妻共同债务企图侵占另一方财产的，在离婚分割夫妻共同财产时，对该方可以少分或者不分。离婚后，另一方发现有上述行为的，可以向人民法院提起诉讼，请求再次分割夫妻共同财产。”《婚姻家庭编解释(一)》第84条规定:“当事人依据民法典第一千零九十二条的规定向人民法院提起诉讼，请求再次分割夫妻共同财产的诉讼时效期间为三年，从当事人发现之日起计算。”","auto":"B","link":"https://weibo.com/2685653721/RdNVSzPOO"},{"num":279,"day":"2026-08-18","stem":"小王父亲老王常年酗酒且无正经工作。小王是靠母亲辛苦开店挣钱养大的。后老王入狱服刑13年，从此二人再未见过面。老王出狱后无收入来源，联系小王要求履行赡养义务。因老王并未抚养小王，故小王对老王并无法定赡养义务。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。抚养和赡养二者不存在因果关系，子女不能以父母未尽抚养教育义务为由而拒绝履行赡养父母的义务。","auto":"B","link":"https://weibo.com/2685653721/RdV0fiIyx"},{"num":280,"day":"2026-08-18","stem":"2018年甲、乙结婚。2019年甲以个人名义向弟弟丙借款100万元购买商品房，登记在乙名下。2021年甲、乙离婚。甲向丙所借的钱应当由甲和乙连带偿还。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"正确。甲在婚内虽以个人名义借款100万元，超出日常生活需要范围，但其用于购买夫妻共有房产，该债务应当认定为夫妻共同债务，应当由甲乙承担连带责任。","auto":"A","link":"https://weibo.com/2685653721/RdXmn5ZTP"},{"num":281,"day":"2026-08-19","stem":"甲与乙结婚后因无房居住。甲以个人名义向丙借20万元用于购房。后甲外出打工与人同居，法院判决甲与乙离婚，家庭财产全部归乙，夫妻债务均由甲承担。此时，丙无权请求乙承担还款义务？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"答案：错误。20万元债务虽为甲以个人名义所借，但用于购买夫妻共同生活的房屋，为共同债务。即使离婚时法院判决债务由甲承担，夫妻对外就该债务仍应当连带清偿。乙清偿债务的，有权向甲追偿。","auto":"B","link":"https://weibo.com/2685653721/Re4qKuErH"},{"num":282,"day":"2026-08-19","stem":"农妇李某和丈夫秦某一家生活幸福。为了丈夫能多分一套房子，两人商量着“假离婚”，分到房子后再复婚。双方“依计”办理离婚登记后，丈夫秦某直接和别的女人结婚。因二人并无真实的离婚意思，故该离婚无效。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"答案：错误。夫妻登记离婚后，一方以双方意思表示虚假为由请求确认离婚无效的，人民法院不予支持。","auto":"B","link":"https://weibo.com/2685653721/Re6MShVbX"},{"num":283,"day":"2026-08-20","stem":"一方实施家庭暴力是夫妻感情破裂的法定事由。所谓家庭暴力，指家庭成员之间实施殴打、捆绑、残害、限制人身自由以及经常性谩骂、恐吓等行为并造成严重损害后果的行为。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"答案：错误。家庭暴力，指家庭成员之间以殴打、捆绑、残害、限制人身自由以及经常性谩骂、恐吓等方式实施的身体、精神等侵害行为，不以损害后果为要件。","auto":"B","link":"https://weibo.com/2685653721/RedRf469h"},{"num":284,"day":"2026-08-20","stem":"小花与大壮为夫妻，双方未约定财产制。小花因抚育子女、照料老年人、协助另一方工作等负担较多义务的，离婚时有权请求大壮以个人财产予以补偿。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"正确。关于家庭付出的经济补偿，民法典不再要求分别财产制为前提。","auto":"A","link":"https://weibo.com/2685653721/RegdmweNm"},{"num":285,"day":"2026-08-21","stem":"钟某性情暴躁，常殴打妻子柳某，柳某经常找同村未婚男青年杜某诉苦排遣，日久生情，并在婚内与杜某同居。双方离婚时，因双方均存在过错，都不得主张离婚损害赔偿。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"正确。夫妻双方对离婚均存在过错，离婚时相互不能主张离婚损害赔偿。","auto":"A","link":"https://weibo.com/2685653721/RenhJxNPd"},{"num":286,"day":"2026-08-21","stem":"无配偶的女性收养男性的，收养人与被收养人不需要40周岁的年龄差。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"答案：错误。无配偶者收养异性子女的，收养人与被收养人的年龄应当相差四十周岁以上。","auto":"B","link":"https://weibo.com/2685653721/RepDRl4J9"},{"num":287,"day":"2026-08-22","stem":"甲(女，45周岁，有配偶)可以单独收养自己5周岁的外甥。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。有配偶者收养子女，应当夫妻共同收养。因甲有配偶，应当由夫妻双方共同作出收养决定。","auto":"B","link":"https://weibo.com/2685653721/RewIer2RO"},{"num":288,"day":"2026-08-22","stem":"小强现年9周岁，生父谭某已故，生母徐某虽有抚养能力，但因准备再婚决定将其送养。谭某父母有优先抚养的权利。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"正确。配偶一方死亡，另一方送养未成年子女的，死亡一方的父母有优先抚养的权利。","auto":"A","link":"https://weibo.com/2685653721/Rez4mc7FD"},{"num":289,"day":"2026-08-23","stem":"谢某与张某婚后生育二子，分别为谢甲、谢乙。后二人因感情不和离婚，张某携二子改嫁于丧偶的陈某。陈某与前妻生有一子陈甲、一女陈乙。因陈某已有二名子女，故不得收养谢甲、谢乙。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。虽陈某已有两名子女，但经生父母同意后，陈某可收养继子女，不受人数限制。","auto":"B","link":"https://weibo.com/2685653721/ReG8JfTas"},{"num":290,"day":"2026-08-23","stem":"收养关系解除后，养子女与养父母以及其他近亲属间的权利义务关系即行消除，与生父母以及其他近亲属间的权利义务关系是否恢复，可以协商确定。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。成年养子女与生父母以及其他近亲属间的权利义务关系是否恢复，可以协商确定。未成年养子女与生父母以及其他近亲属间的权利义务关系自行恢复。","auto":"B","link":"https://weibo.com/2685653721/ReIuR6tEe"},{"num":291,"day":"2026-08-24","stem":"甲在遗嘱中指定所留房屋归其子乙，存款归侄女丙。甲死之后乙、丙两人被告知3个月后参加甲的遗产分割。但直至遗产分割时，乙和丙均未作出是否接受遗产的意思表示。本案中，乙、丙的行为均视为放弃接受遗产。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。乙有继承人资格，属于遗嘱继承人，其未作表示的沉默视为接受继承;而丙无继承人资格，属于受遗赠人，其未作表示的沉默视为放弃受遗赠。","auto":"B","link":"https://weibo.com/2685653721/RePzeowYR"},{"num":292,"day":"2026-08-24","stem":"继承人因继承法规定情形丧失继承权后，确有悔改表现，被继承人表示宽恕或者事后在遗嘱中将其列为继承人的，该继承人不丧失继承权。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。继承人因下列行为之一丧失继承权的，无法因悔改而恢复：（一）故意杀害被继承人；（二）为争夺遗产而杀害其他继承人。","auto":"B","link":"https://weibo.com/2685653721/ReRVlDtd4"},{"num":293,"day":"2026-08-25","stem":"甲与父亲乙因琐事争吵。甲出具书面声明:本人自愿与乙断绝父子关系。本案中，甲丧失对其父亲遗产继承权。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。书面声明断绝父子关系并非法定的丧失继承权的事由。","auto":"B","link":"https://weibo.com/2685653721/ReYZJ1hHK"},{"num":294,"day":"2026-08-25","stem":"甲在道路正常行走时被违法超速的乙驾车撞死，甲的老母亲获得丧葬费、死亡赔偿金等共计100万元的赔偿。该100万元赔偿是甲的遗产。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。100万元的赔偿金并非甲死亡时遗留的财产，故并非甲的遗产。","auto":"B","link":"https://weibo.com/2685653721/Rf1lQuwcr"},{"num":295,"day":"2026-08-26","stem":"甲有一子乙，乙结婚生子丙。乙因意外先于甲死亡。甲死亡时，本由乙继承的份额，由丙代乙之位继承。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"正确。被继承人的子女先于被继承人死亡，应由该继承人继承的遗产份额，由被继承人子女的直系晚辈血亲代位继承。","auto":"A","link":"https://weibo.com/2685653721/Rf8qduZZi"},{"num":296,"day":"2026-08-26","stem":"甲乙是兄弟，其父母已去世。甲未婚未育。乙生有一子丙。后乙因意外先于甲死亡。甲死亡时，因无法定继承人，故其遗产由国家取得以用于公益事业。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。被继承人的兄弟姐妹先于被继承人死亡，应由该继承人继承的遗产份额，由被继承人兄弟姐妹的子女代位继承。","auto":"B","link":"https://weibo.com/2685653721/RfaMlkthU"},{"num":297,"day":"2026-08-27","stem":"被继承人死亡后，除立有有效遗嘱外，只有法定继承人才能取得遗产。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。对继承人以外的依靠被继承人扶养的缺乏劳动能力又没有生活来源的人，或者继承人以外的对被继承人扶养较多的人，可以分给他们适当的遗产。","auto":"B","link":"https://weibo.com/2685653721/RfhQJ0XRl"},{"num":298,"day":"2026-08-27","stem":"肖某育有二子一女，长子甲拒绝对肖某尽赡养义务。肖某死亡分配遗产时，甲应当不分或少分。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。有扶养能力和有扶养条件的继承人，不尽扶养义务的，分配遗产时，应当不分或者少分。","auto":"B","link":"https://weibo.com/2685653721/RfkcQcBPh"},{"num":299,"day":"2026-08-28","stem":"因受遗赠人表示接受才能取得遗产，故遗赠属于双方民事法律行为。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。即使受遗赠人未表示接受遗赠不能取得遗产所有权，但不影响遗赠行为已经成立，故遗赠属于单方行为。","auto":"B","link":"https://weibo.com/2685653721/Rfrhdd5QH"},{"num":300,"day":"2026-08-28","stem":"自书遗嘱由遗嘱人亲笔书写，亲笔签名、盖章或按指印，注明年、月、日。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"错误。自书遗嘱由遗嘱人亲笔书写全部内容，并亲笔签名，注明年、月、日。盖章或按指印不符合自书遗嘱的要件。","auto":"B","link":"https://weibo.com/2685653721/RftDl1si7"},{"num":301,"day":"2026-08-29","stem":"代书遗嘱由其中他人代书，性质上属于代理。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"","auto":null,"link":"https://weibo.com/2685653721/RfAHI47uv"},{"num":302,"day":"2026-08-29","stem":"根据民法典规定，遗嘱人可以立打印遗嘱，但应当有两个以上见证人在场见证，并由遗嘱人和见证人在打印遗嘱上签名，注明年、月、日。该说法是否正确？","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answerRef":"","auto":null,"link":"https://weibo.com/2685653721/RfD3Pzyr8"}]}

  fazhishi: {

    data: {"author":"龚成思法制史","generated":"2026-08-29","questions":[{"num":1,"day":"2026-05-12","stem":"【绪论】关于中国传统法制的主要特征，下列说法正确的是？","options":[{"k":"A","t":"法律以维护民权为要务"},{"k":"B","t":"在法律体系上“诸法合体，民刑不分”"},{"k":"C","t":"法律维护个人本位的社会结构及其经济基础"},{"k":"D","t":"无讼是中国古代法制建设的价值取向"}],"answerRef":"D。中国传统法制的主要特征包括：（1）注重和谐，维护“一统”。（2）法自君出，重权隆法。君主享有最高的立法权，法律也以维护君权为要务，A错。（3）法典编纂保持“诸法合体，民刑不分”的体例，但在法律体系上，则是“诸法并存，民刑有分”的，B错。（4）家族本位，伦理法制。并非个人本位，C错。（5）调处息争，无讼是求。调处是实现息讼、无讼的重要手段，D对。","auto":"D","link":"https://weibo.com/3612107761/QEYA4mqx2"},{"num":2,"day":"2026-05-13","stem":"【绪论】中华法系是被世界公认的特点鲜明、影响深远的一大法系。下列国家或地区中，属于中华法系的是？","options":[{"k":"A","t":"印度"},{"k":"B","t":"暹罗"},{"k":"C","t":"越南"},{"k":"D","t":"波斯"}],"answerRef":"C。印度、暹罗（泰国）属于印度法系，波斯（伊朗）属于伊斯兰法系，A、B、D错。朝鲜（高丽）、日本、越南属于中华法系，C对。","auto":"C","link":"https://weibo.com/3612107761/QF8iSuaBW"},{"num":3,"day":"2026-05-14","stem":"【夏商】中国历史上第一个世袭君主是？","options":[{"k":"A","t":"禹"},{"k":"B","t":"夏启"},{"k":"C","t":"商汤"},{"k":"D","t":"周文王"}],"answerRef":"B。从夏禹传位于其子启开始，王位世袭制取代了氏族社会的禅让制，并最终导致原始氏族制度的解体及国家的建立。夏启成为中国历史上第一位世袭君主，B对。","auto":"B","link":"https://weibo.com/3612107761/QFhs47Gf1"},{"num":4,"day":"2026-05-14","stem":"【夏商】为惩治职官犯罪，商朝有“三风十愆”之规定。下列选项中，不属于“三风”的是？","options":[{"k":"A","t":"巫风"},{"k":"B","t":"淫风"},{"k":"C","t":"乱风"},{"k":"D","t":"马风"}],"answerRef":"D。 “三风”指巫风、淫风、乱风三类官吏的恶劣风气。像“马风”这种看着煞有其事实则毫无意义的凑数选项理应直接排除❌。","auto":"D","link":"https://weibo.com/3612107761/QFqO3ruCi"},{"num":5,"day":"2026-05-15","stem":"【夏商】上古五刑中最轻的刑罚是？","options":[{"k":"A","t":"墨刑"},{"k":"B","t":"劓刑"},{"k":"C","t":"剕刑"},{"k":"D","t":"宫刑"}],"answerRef":"A。墨刑，又称黥刑，是在罪人面上或额头刺刻后再涂上墨，留下痕迹作为受刑人的标志。墨刑既是刻人肌肤的肉刑，又使受刑人蒙受耻辱。墨刑是上古五刑中最轻的刑罚，后来的刺字刑即是这一刑罚的变种。","auto":"A","link":"https://weibo.com/3612107761/QFAgtmow6"},{"num":6,"day":"2026-05-16","stem":"【夏商】旧五刑中除死刑外最为残酷的刑罚是？","options":[{"k":"A","t":"墨刑"},{"k":"B","t":"劓刑"},{"k":"C","t":"剕刑"},{"k":"D","t":"宫刑"}],"answerRef":"D。宫刑，又称淫刑、腐刑，源于苗民的椓刑，是破坏生殖器官的刑罚。对男性为去势，对女性为幽闭。宫刑早先适用于“男女不以义交者”，后来逐渐扩大适用，成为五刑中除死刑外最为残酷的刑罚。汉以后，宫刑作为代死之刑，至北齐天统五年（569年）才从法律上最终废止。","auto":"D","link":"https://weibo.com/3612107761/QFJDY5144"},{"num":7,"day":"2026-05-18","stem":"【西周】据《左传·昭公六年》载：周有乱政，而作（ ）？","options":[{"k":"A","t":"禹刑"},{"k":"B","t":"汤刑"},{"k":"C","t":"九刑"},{"k":"D","t":"吕刑"}],"answerRef":"C。夏有乱政而作禹刑，商有乱政而作汤刑，周有乱政而作九刑。C对。","auto":"C","link":"https://weibo.com/3612107761/QFTdlnJEW"},{"num":8,"day":"2026-05-19","stem":"【西周】西周经成康之治后，至穆王时国势渐衰，财政拮据。周穆王为革新政治，命司寇吕侯作（ ）？","options":[{"k":"A","t":"禹刑"},{"k":"B","t":"汤刑"},{"k":"C","t":"九刑"},{"k":"D","t":"吕刑"}],"answerRef":"D。夏有乱政而作禹刑，商有乱政而作汤刑，周有乱政而作九刑。周穆王为革新政治，命司寇吕侯作《吕刑》。《吕刑》是西周中期具有代表性的刑法。","auto":"D","link":"https://weibo.com/3612107761/R05h3x2B3"},{"num":9,"day":"2026-05-19","stem":"【西周】比较完整的赎刑制度最早见于？","options":[{"k":"A","t":"禹刑"},{"k":"B","t":"汤刑"},{"k":"C","t":"九刑"},{"k":"D","t":"吕刑"}],"answerRef":"D。《吕刑》规定了较为完整的收赎制度，D对。","auto":"D","link":"https://weibo.com/3612107761/R0ek5nTNt"},{"num":10,"day":"2026-05-20","stem":"【西周】《后汉书·陈宠传》对西周礼刑关系的描述是：“礼之所去，刑之所取，失礼则入刑，相为表里。”关于对西周礼刑的理解，下列选项正确的是？","options":[{"k":"A","t":"周礼分为五礼，核心在于“亲亲”“尊尊”，规定了政治关系的等级"},{"k":"B","t":"西周时期五刑，即墨、劓、剕（刖）、宫、大辟，适用于庶民而不适用于贵族"},{"k":"C","t":"“礼”不具备法的性质，缺乏国家强制性，需要“刑”作为补充"},{"k":"D","t":"违礼即违法，在维护统治的手段上“礼”“刑”二者缺一不可"}],"answerRef":"D。西周有五礼，吉礼（祭祀之礼）、凶礼（丧葬之礼）、军礼（行兵打仗之礼）、宾礼（迎宾待客之礼）、嘉礼（冠婚之礼），可以归纳为“亲亲”与“尊尊”两个方面，即“亲亲父为首”和“尊尊君为首”。它主要强调宗法伦理而不是政治关系的等级，A错。西周有五刑，墨、劓、剕（刖）、宫、大辟，强调“礼不下庶人，刑不上大夫”。“礼不下庶人”强调礼有等级差别，禁止任何越礼的行为；“刑不上大夫”强调贵族官僚在适用刑罚上的特权，并不是贵族没有刑罚，B错。“礼”具有规范性和国家强制性，具备法的性质，C错。西周强调“出礼入刑”。“礼”正面、积极地规范人们的言行，而“刑”则对违背礼的行为进行处罚，即“礼之所去，刑之所取，失礼则入刑，相为表里”，D对。","auto":"D","link":"https://weibo.com/3612107761/R0nV45z5Q"},{"num":11,"day":"2026-05-21","stem":"【西周】《左传》云:“礼，经国家，定社稷，序民人，利后嗣者也。”这是对周礼的一种评价。关于周礼，下列表述正确的是？","options":[{"k":"A","t":"周礼是早期先民祭祀风俗自然流传到西周的产物"},{"k":"B","t":"周礼仅属于宗教、伦理道德性质的规范"},{"k":"C","t":"“礼不下庶人”强调“礼”有等级差别"},{"k":"D","t":"西周时期“礼”与“刑”是相互对立的两个范畴"}],"answerRef":"C。礼在中国古代是社会的典章制度和道德规范。它最初来自祭祀的程序，但是到了西周，周公制礼，礼作为典章制度，不是自然而然形成的，而是人的主观能动性的选择，A错。礼既是中国古代法律的渊源之一，也是古代法律的重要组成部分，具有法律效力，B错。在封建时代，礼维持社会、政治秩序，巩固等级制度，是调整人与人之间的各种社会关系和权利义务的规范和准则，“礼不下庶人”体现了人与人的不平等，C对。西周强调“出礼入刑”，即礼和刑是相互依存、相互补充的，礼是正面的规范，刑是礼的后盾，“礼之所去，刑之所取，失礼则入刑，相为表里”， D错。","auto":"C","link":"https://weibo.com/3612107761/R0xn2pTpS"},{"num":12,"day":"2026-05-23","stem":"【西周】《礼记·王制》载：“疑狱，氾与众共之。众疑，赦之。”该规定是？","options":[{"k":"A","t":"三赦之法"},{"k":"B","t":"三宥之法"},{"k":"C","t":"三刺之法"},{"k":"D","t":"三风十愆"}],"answerRef":"C。“三赦”之法：老幼犯罪减免刑罚，A错。“三宥”之法：区分故意与过失、惯犯与偶犯，B错。“三刺”之法：罪疑从轻、罪疑从赦。西周时为保证适用法律的谨慎，防止错杀无辜，对犯罪事实有疑的案件，实行从轻处断或赦免罪责的原则。凡是疑案，就要广泛征求民众意见，民众认为案件确有疑问，即予以赦免，C对。三风十愆是商朝惩治职官犯罪的罪名，不是西周的定罪量刑原则，D错。","auto":"C","link":"https://weibo.com/3612107761/R0GVg6Bv8"},{"num":13,"day":"2026-05-24","stem":"【西周】西周商品经济发展促进了民事契约关系的发展。《周礼》载:“听买卖以质剂。”汉代学者郑玄解读西周买卖契约形式:“大市谓人民、牛马之属，用长券；小市为兵器、珍异之物，用短券。”对此，下列说法正确的是？","options":[{"k":"A","t":"长券为“质”，短券为“剂”"},{"k":"B","t":"“质”由买卖双方自制，“剂”由官府制作"},{"k":"C","t":"设有专职官员管理立契事宜，称为“质人”"},{"k":"D","t":"买卖契约也可采用“傅别”形式"}],"answerRef":"A。据《周礼》载，“质”“剂”有别。“质”，是买卖奴隶、牛马所使用的较长的契券；“剂”，是买卖兵器、珍异之物所使用的较短的契券，A对。质、剂均由官方制作，作为处理买卖纠纷的凭证，说明官方已对市场交易进行干预，B错。依据《周礼》，西周设有专职官员管理立契事宜，称为“司约”，并设“质人”，作为市场管理人员，C错。傅别指借贷契约，是解决债务纠纷的凭证。《周礼》载:“听称责（责同债）以傅别。”“傅”即债券，一分为二称“别”，债权人执左券，债务人持右券，司法官以其为凭证审理有关债权债务纠纷案件，D错。","auto":"A","link":"https://weibo.com/3612107761/R0Qnrg1TY"},{"num":14,"day":"2026-05-25","stem":"【西周】履行“六礼”程序，是西周婚姻关系的成立要件。男家请媒妁向女家提亲属于“六礼”中的？","options":[{"k":"A","t":"纳吉"},{"k":"B","t":"纳征"},{"k":"C","t":"纳采"},{"k":"D","t":"纳币"}],"answerRef":"C。“六礼”包括：一是“纳采”，即男家请媒妁向女家提亲，C对；二是“问名”，即男方询问女子名字、生辰等，卜于宗庙以定吉凶；三是“纳吉”，即卜得吉兆后即与女家订婚；四是“纳征”，又称“纳币”，即男方派人送聘礼至女家，婚约正式成立；五是“请期”，即商请女方择定婚期；六是“亲迎”，即婚期之日新郎迎娶新妇。","auto":"C","link":"https://weibo.com/3612107761/R0ZMk6KFL"},{"num":15,"day":"2026-05-25","stem":"【西周】西周宗法制下，继承制度的核心是？","options":[{"k":"A","t":"子女均分制"},{"k":"B","t":"诸子均分制"},{"k":"C","t":"嫡长子继承制"},{"k":"D","t":"父母、配偶与子女均分制"}],"answerRef":"C。嫡长子继承至西周逐步制度化和法律化，成为宗法制度的一项基本原则。西周的宗法制着眼于从长远解决周天子及各级贵族的爵封继承和宗祧继承问题，同时也解决财产继承问题。嫡长子继承制的原则是“立嫡以长不以贤，立子以贵不以长”，目的是保持贵族的政治特权、祭祀权和财产权不致分散或受到削弱。C对。","auto":"C","link":"https://weibo.com/3612107761/R194QlHBP"},{"num":16,"day":"2026-05-27","stem":"【西周】关于西周法制，下列选项正确的是？","options":[{"k":"A","t":"周初统治者为修补以往神权政治学说的缺陷，提出了“德主刑辅，礼法并用”的政治法律主张"},{"k":"B","t":"《后汉书·陈宠传》称西周时期的礼刑关系为“礼之所去，刑之所取，失礼则入刑，相为表里”"},{"k":"C","t":"西周的借贷契约称为“书约”，法律规定重要的借贷行为都须订立书面契约"},{"k":"D","t":"西周时期在宗法制度下已形成子女平均继承制"}],"answerRef":"B。为谋求长治久安，周初统治者提出了“以德配天，明德慎罚”的政治法律主张。而“德主刑辅，礼法并用”是西汉中期以后的立法指导思想，A错。“礼”正面、积极地规范人们的言行，而“刑”则对违背礼的行为进行处罚。其关系正如《后汉书·陈宠传》所说的“礼之所去，刑之所取，失礼则入刑，相为表里”，两者共同构成西周法律的完整体系，B对。西周的借贷契约叫“傅别”，C错。西周形成了嫡长子继承制，这种继承主要是王、贵族政治身份的继承，土地、财产的继承是其次，D错。","auto":"B","link":"https://weibo.com/3612107761/R1iyRmBzO"},{"num":17,"day":"2026-05-28","stem":"【西周】西周中央常设的最高司法官是？","options":[{"k":"A","t":"大司寇"},{"k":"B","t":"廷尉"},{"k":"C","t":"大理寺卿"},{"k":"D","t":"刑部尚书"}],"answerRef":"A。西周形成了比较系统的司法机构。中央常设最高司法官为大司寇，“掌建邦之三典，以佐王刑邦国、诘四方”，辅助周王掌管全国司法工作。遇有重大或疑难案件，须上报周王最后裁断，或由周王指派高级贵族进行议决，A对。秦汉至魏晋时期的最高司法官为廷尉，B错。北齐至唐宋的最高司法官为大理寺卿，C错。明清的最高司法官为刑部尚书，D错。","auto":"A","link":"https://weibo.com/3612107761/R1s4SERiq"},{"num":18,"day":"2026-05-29","stem":"【西周】据《周礼》载，西周“以五刑听万民之狱讼”的司法官是？","options":[{"k":"A","t":"大司寇"},{"k":"B","t":"小司寇"},{"k":"C","t":"司刑"},{"k":"D","t":"司刺"}],"answerRef":"B。西周中央常设最高司法官为大司寇，“掌建邦之三典，以佐王刑邦国、诘四方”，辅助周王掌管全国司法工作，A错。大司寇之下设小司寇，“以五刑听万民之狱讼”，协助大司寇审理案件，处理狱讼，B对。此外还有各种专职的属吏如司刑、司刺、掌囚、掌戮等，处理各类司法事务，C、D错。","auto":"B","link":"https://weibo.com/3612107761/R1Bo8wZZl"},{"num":19,"day":"2026-05-29","stem":"【西周】西周时期当事人起诉应缴纳诉讼费，其中刑事诉讼费被称为？","options":[{"k":"A","t":"“听讼”"},{"k":"B","t":"“断狱”"},{"k":"C","t":"“钧金”"},{"k":"D","t":"“束矢”"}],"answerRef":"C。审理民事案件被称为“听讼”，审理刑事案件被叫作“断狱”，A、B错。法律对于刑事、民事案件的起诉、受案、审理都有具体要求。当事人起诉应缴纳诉讼费，刑事、民事诉讼费分别被称为“钧金”（三十斤铜）和“束矢”（一百支箭），C对、D错。","auto":"C","link":"https://weibo.com/3612107761/R1KOvb2hF"},{"num":20,"day":"2026-05-31","stem":"【西周】在长期的司法实践中，总结出一套“以五声听狱讼求民情”的经验，即运用察言观色进行审讯，以判断当事人陈述的真伪的时期是？","options":[{"k":"A","t":"夏商"},{"k":"B","t":"西周"},{"k":"C","t":"春秋战国"},{"k":"D","t":"秦"}],"answerRef":"B。在长期的司法实践中，西周总结出一套“以五声听狱讼求民情”的经验，即“五听”。西周以后历朝的司法实践都沿用了“五听”。B对。","auto":"B","link":"https://weibo.com/3612107761/R1UFGuA17"},{"num":21,"day":"2026-06-01","stem":"【春秋】中国历史上第一次正式公布成文法是在？","options":[{"k":"A","t":"夏商时期"},{"k":"B","t":"西周时期"},{"k":"C","t":"春秋时期"},{"k":"D","t":"战国时期"}],"answerRef":"C。针对上古时期不预设刑、临事议制的法制传统，春秋时期的政治改革家明确主张公布法律，要求打破世袭贵族对于法律的垄断，将成文法公布于众。公元前536年，郑国的执政子产鉴于当时社会关系的变化和旧礼制的崩溃，率先“铸刑书于鼎，以为国之常法”，一般认为这是中国历史上第一次正式公布成文法。C对。","auto":"C","link":"https://weibo.com/3612107761/R23IazJSe"},{"num":22,"day":"2026-06-02","stem":"【春秋】于公元前501年私造刑法，因其书之于竹简上而称为《竹刑》的郑国大夫是？","options":[{"k":"A","t":"子产"},{"k":"B","t":"驷歂"},{"k":"C","t":"邓析"},{"k":"D","t":"赵鞅"}],"answerRef":"C。继子产铸刑鼎之后，郑国大夫邓析于公元前501年私造刑法，因其书之于竹简上而称为《竹刑》，C对。执政驷歂以私制刑书的罪名处死邓析，但仍用其《竹刑》。","auto":"C","link":"https://weibo.com/3612107761/R2dqh8DNJ"},{"num":23,"day":"2026-06-02","stem":"【春秋】春秋时期，针对以往传统法律体制的不合理性，出现了诸如晋国赵鞅“铸刑鼎”，郑国执政子产“铸刑书”等变革活动。对此，下列说法正确的是？","options":[{"k":"A","t":"晋国赵鞅“铸刑鼎”为中国历史上首次公布成文法"},{"k":"B","t":"奴隶主贵族对公布法律并不反对，认为利于其统治"},{"k":"C","t":"打破了“刑不可知，则威不可测”的壁垒"},{"k":"D","t":"孔子作为春秋时期思想家，肯定赵鞅“铸刑鼎”的举措"}],"answerRef":"C。公元前536年，郑国的执政子产鉴于当时社会关系的变化和旧礼制的崩溃，率先“铸刑书于鼎，以为国之常法”，一般认为这是中国历史上第一次正式公布成文法。公元前513年，晋国的执政赵鞅、荀寅把前任执政范宣子所编的刑书正式铸于鼎上，公之于众，这是中国历史上第二次公布成文法的活动，A错。春秋时期成文法的公布，对旧贵族操纵和使用法律的特权是严重的冲击，是新兴地主阶级的一次重大胜利，B错。成文法的公布，否定了“刑不可知，则威不可测”的旧传统，明确了“法律公开”这一新兴地主阶级的立法原则，对于后世封建法制的发展具有深远的影响，C对。孔子对晋国“铸刑鼎”持反对意见：“晋其亡乎！失其度矣。”“民在鼎矣，何以尊贵？”“贵贱无序，何以为国？”D错。","auto":"C","link":"https://weibo.com/3612107761/R2msH6LCf"},{"num":24,"day":"2026-06-03","stem":"【战国】中国历史上第一部比较系统、完整的成文法典是？","options":[{"k":"A","t":"“禹刑”"},{"k":"B","t":"《吕刑》"},{"k":"C","t":"《竹刑》"},{"k":"D","t":"《法经》"}],"answerRef":"D。“禹刑”并不是一部成文法典，而是泛指夏朝的法律和刑罚，大部分内容是启及其后继者根据氏族社会晚期习俗陆续积累的习惯法，托名为禹所作，故称“禹刑”，具体内容无可详考，A错。周穆王为革新政治，命司寇吕侯作《吕刑》，是西周中期具有代表性的刑法，但并非成文法典，B错。郑国大夫邓析于公元前501年私造刑法，因其书之于竹简上而称为《竹刑》，但《竹刑》并非成文法典，C错。战国时期的《法经》作为历史上第一部比较系统、完整的成文法典，在中国立法史上具有重要地位。《法经》的体例和内容，为后世成文法典的编纂奠定了重要基础。《法经》六篇为秦、汉直接继承，成为秦律、汉律的主要篇目，D对。","auto":"D","link":"https://weibo.com/3612107761/R2vWPjJK8"},{"num":25,"day":"2026-06-05","stem":"【战国】战国时期影响最大、效果最为突出的社会变革是？","options":[{"k":"A","t":"吴起变法"},{"k":"B","t":"李悝变法"},{"k":"C","t":"商鞅变法"},{"k":"D","t":"王安石变法"}],"answerRef":"C。商鞅变法是战国时期影响最大、效果最为突出的社会变革，在深度和广度上都超过了其他诸侯国的改革。商鞅变法在政治、经济和法律制度等方面推行全面改革，使秦国从一个西疆小国发展成为国力强盛、制度先进的大国，为灭六国、统一天下奠定了坚实基础。C对。","auto":"C","link":"https://weibo.com/3612107761/R2Fw6xVOP"},{"num":26,"day":"2026-06-05","stem":"【战国】律成为历朝历代的主要法律形式始于？","options":[{"k":"A","t":"子产铸刑书"},{"k":"B","t":"邓析造竹刑"},{"k":"C","t":"李悝变法"},{"k":"D","t":"商鞅变法"}],"answerRef":"D。商鞅通过改法为律，使得秦律内容比较系统完整，适用广泛，并且保持相对稳定。从此以后，律成为历朝历代的主要法律形式。D对。","auto":"D","link":"https://weibo.com/3612107761/R2OLVwZjf"},{"num":27,"day":"2026-06-06","stem":"【秦】法家的法治理论对秦朝的政权建设和法制活动影响极大，尤其是法、术、势相结合的思想，主张这一思想的代表人物是？","options":[{"k":"A","t":"李悝"},{"k":"B","t":"商鞅"},{"k":"C","t":"李斯"},{"k":"D","t":"韩非"}],"answerRef":"D。法家的法治理论，尤其是韩非子法、术、势相结合的思想，对秦朝的政权建设和法制活动影响极大，D对。","auto":"D","link":"https://weibo.com/3612107761/R2Yb8yM2i"},{"num":28,"day":"2026-06-08","stem":"【秦】在1975年12月出土的湖北云梦睡虎地秦墓竹简中，有大量关于律的内容。下列选项中，属于云梦秦简所载的秦律篇目的是？","options":[{"k":"A","t":"《厩库律》"},{"k":"B","t":"《效律》"},{"k":"C","t":"《杂律》"},{"k":"D","t":"《捕亡律》"}],"answerRef":"B。《厩库律》是唐律篇目，秦律篇目中有《厩苑律》《仓律》，A错。《效律》是秦律篇目，B对。《杂律》是唐律篇目，秦律篇目中有《内史杂律》《尉杂律》，C错。《捕亡律》是唐律篇目，秦律篇目中有《捕盗律》，D错。","auto":"B","link":"https://weibo.com/3612107761/R37Mdb4cz"},{"num":29,"day":"2026-06-09","stem":"【秦】据史书所载的秦朝刑事罪名，下列选项中，最不具有秦朝法律文化的专制特色的是？","options":[{"k":"A","t":"“妄言”"},{"k":"B","t":"“以古非今”"},{"k":"C","t":"“非所宜言”"},{"k":"D","t":"“失刑”"}],"answerRef":"D。秦朝有诽谤与妖言、以古非今、妄言、非所宜言、投书等惩治思想言论的罪名，集中反映了秦朝法律文化的专制特色。“失刑”指官员因过失而导致量刑不当，相对而言最不具有秦朝法律文化的专制特色。D对。","auto":"D","link":"https://weibo.com/3612107761/R3hh43y1r"},{"num":30,"day":"2026-06-10","stem":"【秦】作刑，即后世的徒刑，是在一定时期内对罪犯限制人身自由，并强制无偿劳役之刑。秦朝将大量的徒刑用于军事设施和土木工程兴造。下列选项中，作为秦朝最轻等级的作刑的是？","options":[{"k":"A","t":"城旦舂"},{"k":"B","t":"隶臣妾"},{"k":"C","t":"司寇"},{"k":"D","t":"候"}],"answerRef":"D。作刑分为不同的等级，由重到轻依次是：城旦舂、鬼薪白粲、隶臣妾、司寇、候。一般认为，秦朝的作刑尚没有关于刑期的系统规定。D对。","auto":"D","link":"https://weibo.com/3612107761/R3qydbmxB"},{"num":31,"day":"2026-06-10","stem":"【秦】秦统治者总结前代法律实施方面的经验，结合本朝特点，形成了一些刑罚适用原则。对于秦律原则的相关表述，下列选项正确的是？","options":[{"k":"A","t":"关于刑事责任能力的确定，以身高作为标准，男、女身高六尺二寸以上为成年人，其犯罪应负刑事责任"},{"k":"B","t":"重视人的主观意识状态，对故意行为要追究刑事责任，对过失行为则认为无犯罪意识，不予追究"},{"k":"C","t":"对共犯、累犯等加重处罚，对自首、犯后主动消除犯罪后果等减轻处罚"},{"k":"D","t":"教唆成年人、未成年人犯罪，对教唆人均实行同罪，加重处罚"}],"answerRef":"C。秦律以身高判定是否成年，大约六尺五寸为男性成年身高标准，六尺二寸为女性成年身高标准。男女不同，A错。秦律区分故意（端）与过失（不端），故意犯罪处刑从重，过失犯罪处刑从轻，B错。秦律规定共同犯罪加重处罚原则，在侵犯财产罪的处罚方面，两人或两人以上实施的犯罪较个人犯罪加重量刑，五人以上的共犯处罚尤重。秦律规定有累犯加重处罚原则，犯罪被处刑后再犯罪，加重处罚。秦律还规定有自首减轻处罚原则，秦律区分“自出”“自告”与“得”（捕获），“自出”“自告”等自首者从轻。若犯罪后能主动消除犯罪后果，可减免处罚。C对。秦律规定教唆犯加重处罚的原则，教唆未成年人犯罪者，加重处罚，不是同罪，D错。","auto":"C","link":"https://weibo.com/3612107761/R3zVVnMDa"},{"num":32,"day":"2026-06-11","stem":"【秦】秦朝时期最高武官是？","options":[{"k":"A","t":"丞相"},{"k":"B","t":"太尉"},{"k":"C","t":"御史大夫"},{"k":"D","t":"廷尉"}],"answerRef":"B。秦朝中央机构的主要官吏为“三公九卿”。三公，即丞相、太尉和御史大夫。丞相的职责是辅佐皇帝，总理百政；太尉为最高武官；御史大夫则为监察官之首。丞相之下设九卿，分管各项政务。廷尉位于“九卿”之列，是中央司法机关，负责审理地方的上诉案件和郡县不能决断的疑难案件，同时也负责审理皇帝交办的“诏狱”。B对。","auto":"B","link":"https://weibo.com/3612107761/R3JmliVF1"},{"num":33,"day":"2026-06-12","stem":"【秦】秦朝掌握最高司法审判权的是？","options":[{"k":"A","t":"皇帝"},{"k":"B","t":"司寇"},{"k":"C","t":"廷尉"},{"k":"D","t":"御史大夫"}],"answerRef":"A。皇帝掌握着最高司法审判权，重大案件往往由皇帝亲自审判和裁决。A对。","auto":"A","link":"https://weibo.com/3612107761/R3SELimQO"},{"num":34,"day":"2026-06-14","stem":"【秦】秦朝的中央司法机关是？","options":[{"k":"A","t":"大司寇"},{"k":"B","t":"廷尉"},{"k":"C","t":"大理寺"},{"k":"D","t":"刑部"}],"answerRef":"B。廷尉位于“九卿”之列，是秦朝中央司法审判机关，负责审理地方的上诉案件和郡县不能决断的疑难案件，同时也负责审理皇帝交办的“诏狱”。B对。西周的中央司法机关为大司寇，北齐唐宋的中央司法机关为大理寺，元明清的中央司法机关为刑部。","auto":"B","link":"https://weibo.com/3612107761/R42kTCEmX"},{"num":35,"day":"2026-06-14","stem":"【汉】下列选项中，属于汉武帝时确立的立法指导思想的是？","options":[{"k":"A","t":"以德配天，明德慎罚"},{"k":"B","t":"德主刑辅，礼法并用"},{"k":"C","t":"德本刑用"},{"k":"D","t":"明刑弼教"}],"answerRef":"B。A是西周的立法指导思想，C是唐朝的立法指导思想，D是明朝的立法指导思想。","auto":"B","link":"https://weibo.com/3612107761/R4btogwg1"},{"num":36,"day":"2026-06-15","stem":"【汉】下列选项中，属于汉朝危害中央集权制的犯罪是？","options":[{"k":"A","t":"阿党附益"},{"k":"B","t":"废格诏书"},{"k":"C","t":"大不敬"},{"k":"D","t":"蔽匿盗贼"}],"answerRef":"A。危害中央集权制的犯罪包括：阿党附益、左官、非正、出界、逾制（僭越）、漏泄省中语、酎金不如法、事国人过员，A对。B属于危害君主专制的犯罪，C属于危害皇帝尊严的犯罪，D属于危害国家政权的犯罪。","auto":"A","link":"https://weibo.com/3612107761/R4kVzeWSU"},{"num":37,"day":"2026-06-16","stem":"【汉】“阿党”是汉朝危害中央集权的犯罪之一，具体是指？","options":[{"k":"A","t":"诸侯国的官吏与诸侯王结党，知其犯罪不举奏"},{"k":"B","t":"朝廷大臣交通诸侯，助其获得非法利益"},{"k":"C","t":"朝廷官员“舍天子而仕诸侯”"},{"k":"D","t":"非嫡系子孙继承爵位"}],"answerRef":"A。B是“附益”，C是“左官”，D是“非正”。","auto":"A","link":"https://weibo.com/3612107761/R4urxlAjQ"},{"num":38,"day":"2026-06-17","stem":"【汉】“事国人过员”是汉朝危害中央集权的犯罪，具体是指？","options":[{"k":"A","t":"诸侯王擅自越出封国疆界"},{"k":"B","t":"泄露朝廷机密事宜"},{"k":"C","t":"帝王酎祭时诸侯所献贡金的成色不符合标准"},{"k":"D","t":"诸侯王在王国内滥征人力，扩张势力"}],"answerRef":"D。A是出界，B是漏泄省中语，C是酎金不如法。","auto":"D","link":"https://weibo.com/3612107761/R4DUJ5qJD"},{"num":39,"day":"2026-06-18","stem":"【汉】据《汉书·张释之传》载，汉文帝一次车驾经过中渭桥，有人从桥下跑出来，惊了舆马。根据汉朝法律，该行为构成？","options":[{"k":"A","t":"不敬"},{"k":"B","t":"阑入"},{"k":"C","t":"失阑"},{"k":"D","t":"犯跸"}],"answerRef":"D。“亏礼废节谓之不敬”，凡是对皇帝及朝廷尊严构成威胁的行为，即为不敬，严重者则为大不敬，A错。“阑入”是指无凭证擅自闯入宫殿，B错。“失阑”是指警卫人员失职致使他人无证入宫，C错。“犯跸”是指帝王出行时，警卫仪仗为其开路清道，禁止人们通行，如有人违犯此禁，即构成犯跸，D对。","auto":"D","link":"https://weibo.com/3612107761/R4Ne2gSPf"},{"num":40,"day":"2026-06-19","stem":"【汉】汉朝对外贸易活动活跃，政府重视通过立法管理对外贸易活动。开辟汉朝的“丝绸之路”是在？","options":[{"k":"A","t":"汉高祖时期"},{"k":"B","t":"汉文帝时期"},{"k":"C","t":"汉景帝时期"},{"k":"D","t":"汉武帝时期"}],"answerRef":"D。汉朝对外贸易活动比较活跃，著名的“丝绸之路”就是在汉武帝时期开辟的。","auto":"D","link":"https://weibo.com/3612107761/R4WIPl1D7"},{"num":41,"day":"2026-06-21","stem":"【汉】汉朝皇帝制度在因袭秦制的基础上进一步发展，皇权得到加强，并越来越神秘化、法律化。为突出皇帝至尊地位，皇帝称号及其相关的称谓都被进一步法律化、制度化。依据蔡邕《独断》所载，皇帝所至曰？","options":[{"k":"A","t":"乘舆"},{"k":"B","t":"省中"},{"k":"C","t":"幸"},{"k":"D","t":"御"}],"answerRef":"C。蔡邕《独断》载：“汉天子正号曰皇帝，自称曰朕，臣民称之曰陛下，其言曰制诏，史官记事曰上，车马衣服器械百物曰乘舆，所在曰行在，所居曰禁中，后曰省中，印曰玺，所至曰幸，所进曰御。其命令一曰策书，二曰制书，三曰诏书，四曰戒书。”C对。","auto":"C","link":"https://weibo.com/3612107761/R56k69Fhm"},{"num":42,"day":"2026-06-22","stem":"【汉】汉朝实行郡国地方官自下而上向朝廷推荐本地人才为官的制度。作为汉代最主要的选拔方式的是？","options":[{"k":"A","t":"察举"},{"k":"B","t":"征召"},{"k":"C","t":"辟举"},{"k":"D","t":"任子"}],"answerRef":"A。察举是郡国地方官自下而上向朝廷推荐本地人才为官的制度，是汉代最主要的选拔方式。察举制度始于西汉而盛于东汉，由皇帝下诏责成中央和地方各级长官每年向朝廷推荐贤能之士为官，A对。征召和辟举合称“征辟”，皆为自上而下直接选拔官吏的制度。征召有两种：一是皇帝诏令各郡推举“贤良方正能直言极谏者”，经过皇帝对策后任用为官，称为诏举，也叫“举贤良文学”；二是皇帝特诏征用有特殊才能或德高望重之士，这是选拔特殊人才任官的制度，由皇帝派遣专使以特诏聘书“辟书”聘请，B错。辟举也称辟除，是高级主管官吏或地方郡守以上官吏自选为属吏的制度，C错。任子，即高级官吏可以保任其子弟为官，D错。","auto":"A","link":"https://weibo.com/3612107761/R5fWxDucw"},{"num":43,"day":"2026-06-23","stem":"【汉】汉朝从中央到地方建立了一套自成系统的监察组织。下列选项中，作为汉朝最高监察机关的是？","options":[{"k":"A","t":"廷尉"},{"k":"B","t":"尚书台"},{"k":"C","t":"御史台"},{"k":"D","t":"都察院"}],"answerRef":"C。A是汉朝最高司法机关，B是东汉中枢机构，D是明清时期最高监察机关。","auto":"C","link":"https://weibo.com/3612107761/R5p6Eb5aU"},{"num":44,"day":"2026-06-23","stem":"【汉】汉武帝时为强化中央集权，把全国分为13个监察区，每区派出刺史1人。刺史在御史中丞的领导之下行使监察权，依据的是？","options":[{"k":"A","t":"《监御史九条》"},{"k":"B","t":"《六条问事》"},{"k":"C","t":"《上计律》"},{"k":"D","t":"《风宪宏纲》"}],"answerRef":"B。汉初惠帝时曾颁行监察法规《监御史九条》，A错。刺史在御史中丞的领导之下，依照《六条问事》行使监察权。到西汉末年，刺史的实际权限已超出《六条问事》的范围，直接干预地方行政事务。《六条问事》是对所属郡、国进行监督的标准，其中，一条规定监察强宗豪右，五条规定监察郡国守相，B对。两汉时期对地方郡国守相和县令的考核，仍沿秦制，通过上计的方式进行考课。汉《上计律》规定，年终由郡国上计史携带上计簿到京师上计，汇报工作，C错。元仁宗时期编撰的《风宪宏纲》是元朝监察法律的集大成者，D错。","auto":"B","link":"https://weibo.com/3612107761/R5ynm3s8j"},{"num":45,"day":"2026-06-25","stem":"【汉】录囚制度即由皇帝或上级司法机关通过对囚徒的复核审录，监督和检查下级司法机关的决狱情况，以平反冤案，疏理滞狱。这一制度正式确立于？","options":[{"k":"A","t":"西周"},{"k":"B","t":"秦"},{"k":"C","t":"汉"},{"k":"D","t":"唐"}],"answerRef":"C。汉代建立了录囚制度，录囚之制对平反冤狱、改善狱政、监督司法及统一法律适用具有积极作用。C对。","auto":"C","link":"https://weibo.com/3612107761/R5I0M969v"},{"num":46,"day":"2026-06-25","stem":"【魏晋南北朝】下列选项中，以“法令明审，科条简要”著称的法典是？","options":[{"k":"A","t":"《晋律》"},{"k":"B","t":"《北魏律》"},{"k":"C","t":"《北齐律》"},{"k":"D","t":"《大业律》"}],"answerRef":"C。“准五服以制罪”是法律儒家化的重要标志之一，使《晋律》成为“峻礼教之防”的工具，其影响极为深远，A错。《北魏律》是经过“综合比较、取精用宏”而制定，B错。《北齐律》以“法令明审，科条简要”著称，在古代法典发展史上起着承前启后的重要作用，对隋唐立法尤具影响，C对。《大业律》是“轻刑其名，酷刑其实”，D错。","auto":"C","link":"https://weibo.com/3612107761/R5Qj3n9i0"},{"num":47,"day":"2026-06-27","stem":"【魏晋南北朝】首创《名例律》的法典篇目放首篇作为总则篇的古代法典是？","options":[{"k":"A","t":"《曹魏律》"},{"k":"B","t":"《晋律》"},{"k":"C","t":"《北齐律》"},{"k":"D","t":"《开皇律》"}],"answerRef":"C。《曹魏律》将《法经》中的《具法》改为《刑名》，置于律首，突出了法典总则的性质和地位，A错。《晋律》从《刑名律》中分出《法例律》篇，完善了刑律总则的内容，B错。《北齐律》首创《名例律》的法典篇目，C对。《开皇律》以《北齐律》为基础，也以《名例律》放首篇为总则篇，但并非首创，D错。","auto":"C","link":"https://weibo.com/3612107761/R61kczdLh"},{"num":48,"day":"2026-06-28","stem":"【魏晋南北朝】首创十二篇体例的古代法典是？","options":[{"k":"A","t":"《曹魏律》"},{"k":"B","t":"《晋律》"},{"k":"C","t":"《北魏律》"},{"k":"D","t":"《北齐律》"}],"answerRef":"D。《曹魏律》是18篇，A错。《晋律》和《北魏律》都是20篇，B、C错。《北齐律》形成12篇的法典体例，D对。","auto":"D","link":"https://weibo.com/3612107761/R6apIENWb"},{"num":49,"day":"2026-06-29","stem":"【魏晋南北朝】下列关于魏晋南北朝时期的立法，说法正确的是？","options":[{"k":"A","t":"《北魏律》20篇，经过“法令明审，科条简要”而制定"},{"k":"B","t":"“格”源于汉代的“科”，东魏始以“格”代“科”"},{"k":"C","t":"西魏《大统式》是历史上最早以“式”为形式的法典"},{"k":"D","t":"《北齐律》以“综合比较、取精用宏”著称"}],"answerRef":"C。《北魏律》20篇，经过“综合比较、取精用宏”而制定，《北齐律》以“法令明审，科条简要”著称，A、D错。“格”源于汉代的“科”，北魏始以“格”代“科”，至东魏制定《麟趾格》，始为独立法典，B错。","auto":"C","link":"https://weibo.com/3612107761/R6jSMmEj9"},{"num":50,"day":"2026-06-30","stem":"【魏晋南北朝】《名例律》作为中国古代律典的总则篇，经历了发展、变化的过程。下列表述不正确的是？","options":[{"k":"A","t":"《法经》六篇中有《具法》篇，置于末尾，为关于定罪量刑中从轻从重法律原则的规定"},{"k":"B","t":"《晋律》共20篇，在《刑名律》后增加了《法例律》，丰富了刑法总则的内容"},{"k":"C","t":"《北齐律》共12篇，将刑名律与法例律合并为《名例律》一篇，充实了刑法总则，并对其进行逐条逐句的疏议"},{"k":"D","t":"《大清律例》的结构、体例、篇目与《大明律》基本相同，《名例律》置首，后为吏律、户律、礼律、兵律、刑律、工律"}],"answerRef":"C。《北齐律》共12篇，将《刑名律》与《法例律》合并为《名例律》一篇，但是它并没有对其进行逐条逐句的疏议，作疏议的是《永徽律疏》，俗称《唐律疏议》，C错。","auto":"C","link":"https://weibo.com/3612107761/R6tbdFJ7h"},{"num":51,"day":"2026-07-01","stem":"【魏晋南北朝】提出近于现代罪刑法定原则的“援法断罪”思想的是？","options":[{"k":"A","t":"陈群"},{"k":"B","t":"张斐"},{"k":"C","t":"杜预"},{"k":"D","t":"刘颂"}],"answerRef":"D。晋代刘颂还提出，“律法断罪，皆当以法律令正文，若无正文，依附名例断之，其正文名例所不及，皆勿论”。这种援法断罪的思想，近于现代罪刑法定原则，为中国古代律学理论和法律思想的一大进步。","auto":"D","link":"https://weibo.com/3612107761/R6CPIl93c"},{"num":52,"day":"2026-07-01","stem":"【魏晋南北朝】“重罪十条”罪名正式确立于？","options":[{"k":"A","t":"《曹魏律》"},{"k":"B","t":"《晋律》"},{"k":"C","t":"《北魏律》"},{"k":"D","t":"《北齐律》"}],"answerRef":"D。“重罪十条”罪名正式确立于《北齐律》，是直接危害国家根本利益的十种重大犯罪的总称，包括反逆、大逆、叛、降、恶逆、不道、不敬、不孝、不义、内乱。“重罪十条”将儒家纲常礼教内容引入刑律，促进了礼与法的结合。","auto":"D","link":"https://weibo.com/3612107761/R6LBIjVN0"},{"num":53,"day":"2026-07-03","stem":"【魏晋南北朝】首创按道里远近划分流刑为五等的制度的是？","options":[{"k":"A","t":"曹魏"},{"k":"B","t":"西晋"},{"k":"C","t":"北齐"},{"k":"D","t":"北周"}],"answerRef":"D。北周五刑体系的排列由轻递重，为杖、鞭、徒、流、死，又首创按道里远近划分流刑为五等的制度。","auto":"D","link":"https://weibo.com/3612107761/R6Vrzsxva"},{"num":54,"day":"2026-07-04","stem":"【魏晋南北朝】“八议”是指贵族官僚中位高权重的八种人犯罪后，普通司法机构无权审理，须在大臣“议其所犯”后，由皇帝对其所犯罪行决定减免刑罚的制度。“八议”制度源于西周的“八辟之议”，正式入律是在？","options":[{"k":"A","t":"秦朝时期"},{"k":"B","t":"汉朝时期"},{"k":"C","t":"曹魏时期"},{"k":"D","t":"南北朝时期"}],"answerRef":"C。自曹魏以后，“八议”遂成为古代法律的重要原则。","auto":"C","link":"https://weibo.com/3612107761/R7560tuxK"},{"num":55,"day":"2026-07-05","stem":"【魏晋南北朝】首立“准五服以制罪”制度的是？","options":[{"k":"A","t":"《曹魏律》"},{"k":"B","t":"《晋律》"},{"k":"C","t":"《北魏律》"},{"k":"D","t":"《北齐律》"}],"answerRef":"B。《晋律》首立“准五服以制罪”制度，是指亲属间的犯罪，据五等丧服所规定的亲等来定罪量刑。","auto":"B","link":"https://weibo.com/3612107761/R7eAWaaCJ"},{"num":56,"day":"2026-07-06","stem":"【魏晋南北朝】在朝堂外悬设登闻鼓，允许有重大枉屈者击鼓鸣冤，直诉于中央甚至皇帝，正式确立了登闻鼓直诉制度的是？","options":[{"k":"A","t":"曹魏"},{"k":"B","t":"西晋"},{"k":"C","t":"北魏"},{"k":"D","t":"北齐"}],"answerRef":"B。西晋在朝堂外悬设登闻鼓，允许有重大枉屈者击鼓鸣冤，直诉于中央甚至皇帝。上诉直诉制度加强了司法机关的内部检查监督，有利于发现和纠正冤假错案。","auto":"B","link":"https://weibo.com/3612107761/R7o3J3zyY"},{"num":57,"day":"2026-07-07","stem":"【魏晋南北朝】死刑复奏制正式确立于？","options":[{"k":"A","t":"秦"},{"k":"B","t":"汉"},{"k":"C","t":"魏晋南北朝"},{"k":"D","t":"隋"}],"answerRef":"C。三国两晋南北朝时期确立了死刑复奏制，即死刑须报告朝廷，经皇帝批准方准执行。死刑复奏制度的确立一方面标榜慎刑，另一方面也使皇帝更牢固地掌握最高审判权。","auto":"C","link":"https://weibo.com/3612107761/R7x54F6I8"},{"num":58,"day":"2026-07-07","stem":"【魏晋南北朝】关于我国古代刑讯制度的表述，下列说法正确的是？","options":[{"k":"A","t":"秦朝提倡使用刑讯手段取得口供"},{"k":"B","t":"北魏以重枷、大杖逼供"},{"k":"C","t":"南梁创立“测立之法”"},{"k":"D","t":"南陈设“测罚之法”"}],"answerRef":"B。为取得口供，允许司法官吏使用刑讯手段，但不提倡刑讯，A错。南梁创立“测罚之法”，对不招供者断绝饮食，三日后才许进食少量的粥，循环使用，C错。南陈设“测立之法”，对受审者先鞭打二十，笞捶三十，再迫其负枷械刑具，站立于顶部尖圆、仅容两足的一尺高之土垛上，折磨逼供，D错。","auto":"B","link":"https://weibo.com/3612107761/R7Gbvb4O4"},{"num":59,"day":"2026-07-09","stem":"【隋】代表了隋朝立法最高成就的律典是？","options":[{"k":"A","t":"《开皇律》"},{"k":"B","t":"《大业律》"},{"k":"C","t":"《武德律》"},{"k":"D","t":"《贞观律》"}],"answerRef":"A。《开皇律》代表了隋朝立法的最高成就，其继承了秦汉以来的历代立法经验，删繁就简，补充完善，为唐代立法奠定了基础。《开皇律》的篇目、体例、概念术语及具体制度变革内容多为唐代立法继承，成为后世立法的模板，A对。隋炀帝修订《大业律》，改革隋文帝时的苛法酷刑。与《开皇律》相比，《大业律》体例由12篇增至18篇，内容上删除“十恶”条款，减轻某些犯罪的处刑。但该律并未认真实施，反而“轻刑其名，酷刑其实”，B错。C、D为唐朝的法律典籍，C、D错。","auto":"A","link":"https://weibo.com/3612107761/R7QgeajKx"},{"num":60,"day":"2026-07-09","stem":"【隋】最早正式规定“十恶”制度的法典是？","options":[{"k":"A","t":"《北齐律》"},{"k":"B","t":"《开皇律》"},{"k":"C","t":"《大业律》"},{"k":"D","t":"《唐律疏议》"}],"answerRef":"B。“重罪十条”罪名正式确立于《北齐律》，A错。《开皇律》在北齐“重罪十条”的基础上正式确立了“十恶”罪名，B对。《大业律》内容上删除“十恶”条款，减轻某些犯罪的处刑，C错。《唐律疏议》以《开皇律》为基础，沿用了“十恶”制度，但并非最早规定，D错。","auto":"B","link":"https://weibo.com/3612107761/R7ZbznihF"},{"num":61,"day":"2026-07-10","stem":"【隋】中国封建制五刑正式确立于？","options":[{"k":"A","t":"北魏"},{"k":"B","t":"北齐"},{"k":"C","t":"北周"},{"k":"D","t":"隋朝"}],"answerRef":"D。北魏始定制以死、流、徒、鞭、杖为五刑，初步形成了以劳役刑为中心的五刑体系，A错。北齐确立死、流、徒、鞭、杖五刑，为隋唐新五刑体系的最终建立奠定了基础，B错。北周五刑体系的排列改由轻递重，为杖、鞭、徒、流、死，又首创按道里远近划分流刑为五等的制度，C错。隋朝《开皇律》删除了前代酷刑，刑罚定型为死、流、徒、杖、笞五刑，新五刑体系自此正式确立，并一直沿用至清末。","auto":"D","link":"https://weibo.com/3612107761/R88wAgvS7"},{"num":62,"day":"2026-07-12","stem":"【唐】下列有关唐朝立法的表述，说法正确的是？","options":[{"k":"A","t":"唐律确定“德主刑辅、礼法并用”为立法指导思想"},{"k":"B","t":"唐朝立法要求宽简、稳定划一"},{"k":"C","t":"唐朝的主要法律形式为:律、令、科、比"},{"k":"D","t":"《贞观律》是唐朝立法的开端"}],"answerRef":"B。西汉中期以后“德主刑辅、礼法并用”，唐朝“德本刑用”，A错。唐朝的主要法律形式为：律、令、格、式，汉朝是律、令、科、比，C错。《武德律》是唐朝立法的开端，D错。","auto":"B","link":"https://weibo.com/3612107761/R8icFDtsY"},{"num":63,"day":"2026-07-13","stem":"【唐】关于唐朝的法律形式，下列表述正确的是？","options":[{"k":"A","t":"律是关于定罪量刑的基本法典"},{"k":"B","t":"令是政府各机构关于行政管理及具体办事规则的规定"},{"k":"C","t":"格是有关国家政权体制、等级制度与行政管理的法规"},{"k":"D","t":"式是皇帝临时颁发的各种敕令"}],"answerRef":"A。令，是有关国家政权组织体制、尊卑贵贱等级制度与行政管理活动方面的法规，B错。格，是皇帝针对“百官有司之所常行之事”临时颁发的各种敕令，经过汇编后上升为普遍适用的法律，称为“永格”，C错。式，是中央政府内部各机构关于行政管理、行政程序及具体办事规则的规定，包括国家机关的公文程式和活动细则，D错。","auto":"A","link":"https://weibo.com/3612107761/R8rDNddSA"},{"num":64,"day":"2026-07-13","stem":"【唐】在唐律中规定“称‘谋’者，二人以上”的篇目是？","options":[{"k":"A","t":"《名例律》"},{"k":"B","t":"《贼盗律》"},{"k":"C","t":"《杂律》"},{"k":"D","t":"《断狱律》"}],"answerRef":"A。《名例律》主要规定刑种、定罪量刑一般原则以及律文之中有关专门术语的界定，A对。《贼盗律》主要规定谋反、谋大逆、恶逆等十恶方面的犯罪，如杀人、强盗、窃盗等重大刑事犯罪及相应的刑事责任，B错。《杂律》主要规定市场管理、债权债务、犯奸失火以及其他一些轻微危害社会秩序和经济关系的犯罪和处罚，C错。《断狱律》是关于审讯、判决、执行和监狱管理方面的法律，D错。","auto":"A","link":"https://weibo.com/3612107761/R8APypx57"},{"num":65,"day":"2026-07-14","stem":"【唐】被后人评价为“乘之则过，除之则不及，过与不及，其失均矣”的古代成文法典是？","options":[{"k":"A","t":"《北魏律》"},{"k":"B","t":"《北齐律》"},{"k":"C","t":"《大业律》"},{"k":"D","t":"《唐律疏议》"}],"answerRef":"D。《北魏律》“综合比较、取精用宏”，A错。《北齐律》“法令明审，科条简要”，B错。《大业律》“轻刑其名，酷刑其实”，C错。秦汉法律一向以繁杂著称，西晋、北齐修律得以精简。唐朝在前律的基础上再行精简，定律12篇，共502条。既凝练概括，又严密周详。后人评价唐律：“乘之则过，除之则不及，过与不及，其失均矣。”","auto":"D","link":"https://weibo.com/3612107761/R8KfZg7oy"},{"num":66,"day":"2026-07-15","stem":"【唐】元代人在《唐律疏议》中说:“乘之（指唐律）则过，除之则不及，过与不及，其失均矣。”表达了对唐律的敬畏之心。下列关于唐律表述错误的是？","options":[{"k":"A","t":"促使法律统治“一准乎礼”，实现了礼律统一"},{"k":"B","t":"科条简要、宽简适中、立法技术高超，结构严谨"},{"k":"C","t":"是我国传统法典的楷模与中华法系形成的标志"},{"k":"D","t":"对古代亚洲及欧洲诸国产生了重大影响，成为其立法渊源"}],"answerRef":"D。作为中华法系的代表作，唐律超越国界，对东亚各国产生了重大影响。朝鲜《高丽律》篇章内容都取法于唐律。日本文武天皇制定《大宝律令》，也以唐律为蓝本。越南李朝太宗时期颁布的《刑书》，大都参用唐律。可见唐律不仅在本国而且在世界法制史上也占有重要地位。但是，由于地理阻隔和文化传统等因素的影响，唐律的影响范围主要局限在东亚，并不能完整覆盖亚洲诸国，特别是对欧洲国家的影响更是可以忽略不计，D错。","auto":"D","link":"https://weibo.com/3612107761/R8TNG9RuG"},{"num":67,"day":"2026-07-17","stem":"【唐】目前为止保存下来最早、最完整的中国古代法典是？","options":[{"k":"A","t":"《法经》"},{"k":"B","t":"《开皇律》"},{"k":"C","t":"《唐律疏议》"},{"k":"D","t":"《宋刑统》"}],"answerRef":"C。《法经》是我国历史上第一部比较系统、完整的成文法典，A错。《开皇律》代表了隋朝立法的最高成就，B错。《唐律疏议》是现存最早、最完整的古代法典，也是中国古代最具影响力的法典，集中体现了唐朝法律空前发达的盛况。唐律是中华传统法典的楷模，在法制史上具有继往开来、承前启后的重要地位。它产生于经济、政治和文化鼎盛发展的唐朝，承袭秦汉的立法成果，吸取汉晋律学的成就，表现出高度的成熟性，C对。《宋刑统》是中国历史上第一部刊版印行的法典，D错。","auto":"C","link":"https://weibo.com/3612107761/R93oyhX8N"},{"num":68,"day":"2026-07-17","stem":"【唐】下列唐朝的法律典籍中，“以刑律分类为门，附以格敕”的法典是？","options":[{"k":"A","t":"《贞观律》"},{"k":"B","t":"《永徽律疏》"},{"k":"C","t":"《开元律》"},{"k":"D","t":"《大中刑律统类》"}],"answerRef":"D。唐宣宗大中年间将唐律按性质分为121门，并将“条件相类”的令、格、式及敕附于律条之后，即“以刑律分类为门，附以格敕”，共1250条，称为《大中刑律统类》，从而改变了自秦汉以来编修刑律的传统体例，形成“刑统”这种新的法典编纂形式，对宋王朝制律产生了重要影响。","auto":"D","link":"https://weibo.com/3612107761/R9cFh2sQ4"},{"num":69,"day":"2026-07-19","stem":"【唐】依唐律下列有关十恶犯罪的表述，说法正确的是？","options":[{"k":"A","t":"车润江杀授业师应属“不道”"},{"k":"B","t":"车润河谋杀父母应属“不睦”"},{"k":"C","t":"车润湖告发父母应属“不孝”"},{"k":"D","t":"车润海奸父妾应属“不义”"}],"answerRef":"C。杀本属府主、刺史、县令、现授业师等方面的犯罪属“不义”，不道，即杀一家非死罪三人、肢解人及造畜蛊毒、厌魅的行为，A错。殴打或谋杀祖父母、父母属“恶逆”，谋杀或卖缌麻以上亲属“不睦”，B错。不孝，即告发或咒骂祖父母、父母，祖父母、父母在世而别籍异财者等，C对。奸小功以上亲或父、祖妾，以及亲属内的通奸属“内乱”，D错。","auto":"C","link":"https://weibo.com/3612107761/R9miDo9AE"},{"num":70,"day":"2026-07-20","stem":"【唐】关于“十恶”制度，以下说法正确的是？","options":[{"k":"A","t":"某甲砍皇陵树木，盗皇陵香炉，属“谋反”之罪"},{"k":"B","t":"某甲谋杀其祖父母，属“不道”之罪"},{"k":"C","t":"甲、乙是兄弟，未经父母同意，分立门户，属“不孝”之罪"},{"k":"D","t":"某甲与妻子吵架，出门遇授业师乙。乙教育某甲，某甲殴打乙，属“不义”之罪"}],"answerRef":"C。破坏皇帝陵寝的行为属于谋大逆，谋反是指直接谋害皇帝、危害国家的行为，A错。殴打或谋杀祖父母、父母属于恶逆，不道是指杀一家非死罪三人、肢解人及造畜蛊毒、厌魅的行为，B错。父母在世，子孙别籍异财属于不孝，C对。不义是指杀本管上司、授业师及夫丧违礼的行为，某甲仅对授业师乙实施殴打，还达不到“不义”的标准，D错。","auto":"C","link":"https://weibo.com/3612107761/R9vRRdxqZ"},{"num":71,"day":"2026-07-21","stem":"【唐】下列选项中属于唐律规定的“六杀”罪名的有？","options":[{"k":"A","t":"情杀"},{"k":"B","t":"贼杀"},{"k":"C","t":"奸杀"},{"k":"D","t":"误杀"}],"answerRef":"D。对于杀人罪，唐律区分了“六杀”，即所谓的“谋杀”“故杀”“斗杀”“误杀”“过失杀”“戏杀”。","auto":"D","link":"https://weibo.com/3612107761/R9FlifRjB"},{"num":72,"day":"2026-07-21","stem":"【唐】唐玄宗开元年间，方圆村村民杜某外出打猎，发现山林中有一只野猪正在拱地，遂引弓射箭，走近一看，发现不幸射中竹马村村民马某，致其死亡。依照唐律，杜某的行为构成的罪名是？","options":[{"k":"A","t":"故杀"},{"k":"B","t":"误杀"},{"k":"C","t":"戏杀"},{"k":"D","t":"过失杀"}],"answerRef":"D。“故杀”是指事先虽无预谋，但情急杀人时已有杀人的意念，A错。“误杀”是指种种原因杀错了对象，B错。“戏杀”是指“以力共戏”，本无杀人之意而导致杀人后果，C错。“过失杀”是指“耳目所不及，思虑所不至”而杀人，“共举重物，力所不致；若乘高履危足跌及因击禽兽以致杀之属，皆是。”D对。","auto":"D","link":"https://weibo.com/3612107761/R9OpK1jws"},{"num":73,"day":"2026-07-23","stem":"【唐】在唐律中，规定“诸谋杀人者，徒三年；已伤者，绞；已杀者，斩”的篇目是？","options":[{"k":"A","t":"《名例律》"},{"k":"B","t":"《贼盗律》"},{"k":"C","t":"《斗讼律》"},{"k":"D","t":"《杂律》"}],"answerRef":"B。对于杀人罪，《唐律疏议》中《贼盗律》《斗讼律》区分了“六杀”，即所谓的“谋杀”“故杀”“斗杀”“误杀”“过失杀”“戏杀”。其中，谋杀规定在《贼盗律》中，另五杀规定在《斗讼律》中。","auto":"B","link":"https://weibo.com/3612107761/R9Y9U8FOR"},{"num":74,"day":"2026-07-24","stem":"【唐】依照唐律的规定，在相互斗殴中“元无杀心”而将人杀死是？","options":[{"k":"A","t":"故杀"},{"k":"B","t":"斗杀"},{"k":"C","t":"误杀"},{"k":"D","t":"戏杀"}],"answerRef":"B。“故杀”指事先虽无预谋，但情急杀人时已有杀人的意念，A错；“斗杀”指在相互斗殴中“元无杀心”而将人杀死，B对；“误杀”指由于种种原因杀错了对象，C错；“戏杀”指“以力共戏”，本无杀人之意而导致杀人后果，D错。","auto":"B","link":"https://weibo.com/3612107761/Ra7wS6w9f"},{"num":75,"day":"2026-07-24","stem":"【唐】在唐律中，规定“诸保辜者，手足殴伤人限十日，以他物殴伤人者二十日，以刃及汤火伤人者三十日，折跌支体及破骨者五十日”的篇目是？","options":[{"k":"A","t":"《名例律》"},{"k":"B","t":"《贼盗律》"},{"k":"C","t":"《斗讼律》"},{"k":"D","t":"《杂律》"}],"answerRef":"C。《名例律》规定刑种、定罪量刑一般原则以及律文之中有关专门术语的界定，A错。《贼盗律》规定了谋反、谋大逆、恶逆、谋杀、强盗、窃盗等重大刑事犯罪及相应的刑事责任，B错。《斗讼律》规定斗殴犯罪和告讼犯罪，C对。《杂律》主要规定市场管理、债权债务、犯奸失火等犯罪，D错。","auto":"C","link":"https://weibo.com/3612107761/RagHCBOQt"},{"num":76,"day":"2026-07-25","stem":"【唐】唐朝天宝年间，方圆村屠夫马某与车夫车某因争抢竹马村民女岳某发生殴斗，马某持刀将车某砍伤，在辜限内车某因伤死亡。依唐律，马某应论处的罪名是？","options":[{"k":"A","t":"斗殴"},{"k":"B","t":"强盗"},{"k":"C","t":"杀人"},{"k":"D","t":"伤害"}],"answerRef":"C。唐律规定：“限内死者，各依杀人论；其在限外及虽在限内，以他故死者，各依本殴伤法。”","auto":"C","link":"https://weibo.com/3612107761/Raq8K8gBN"},{"num":77,"day":"2026-07-27","stem":"【唐】下列关于唐律中公罪和私罪说法正确的是","options":[{"k":"A","t":"缘公事致罪就是公罪"},{"k":"B","t":"“公罪”处刑从重"},{"k":"C","t":"“私罪”处刑从轻"},{"k":"D","t":"不缘公事，私自犯者是私罪"}],"answerRef":"D。唐律规定官吏“缘公事致罪，而无私曲者”为“公罪”；“不缘公事，私自犯者”，或“虽缘公事，意涉阿曲”的为“私罪”，A错、D对。“公罪”处刑从轻，“私罪”处刑从重，B、C错。","auto":"D","link":"https://weibo.com/3612107761/RazMSETYw"},{"num":78,"day":"2026-07-28","stem":"【唐】唐朝开元年间，方圆村村民车某与岳某共谋盗窃。两人被抓获后，经官府审理认定，车某为“造意者”，属首犯，岳某为从犯。依唐律，车某应处徒三年，对岳某应处？","options":[{"k":"A","t":"徒三年"},{"k":"B","t":"徒两年半"},{"k":"C","t":"徒两年"},{"k":"D","t":"免予处罚"}],"answerRef":"B。唐律规定：“诸共犯罪者，以造意为首，随从者减一等。”徒刑以半年为等差分为五等：徒一年、一年半、二年、二年半和三年。","auto":"B","link":"https://weibo.com/3612107761/RaJeFwcvp"},{"num":79,"day":"2026-07-29","stem":"【唐】唐朝时竹马村村民马某一并案发三罪，三种罪的处刑分别为徒一年、徒二年和徒三年。依据唐律的规定，马某最终将被处以？","options":[{"k":"A","t":"徒三年"},{"k":"B","t":"徒四年"},{"k":"C","t":"徒一年以上徒六年以下"},{"k":"D","t":"流两千里"}],"answerRef":"A。唐律规定：“诸二罪以上俱发，以重者论。等者，从一。”唐采用重罪吸收轻罪、刑不累加的原则，也就是两罪轻重不等，只科重罪，不计轻罪。二罪相等，从一罪处刑。","auto":"A","link":"https://weibo.com/3612107761/RaSO9duVB"},{"num":80,"day":"2026-07-30","stem":"【唐】唐永徽年间，甲由祖父乙抚养成人。甲好赌欠债，多次索要乙一祖传玉坠未果，起意杀乙。某日，甲趁乙熟睡，以木棒狠击乙头部，以为致死（后被救活），遂夺玉坠逃走。唐律规定，谋杀尊亲处斩，但无致伤如何处理的规定。对甲应当实行下列哪一处罚？","options":[{"k":"A","t":"按“诸断罪而无正条，其应入罪者，则举轻以明重”，应处斩刑"},{"k":"B","t":"按“诸断罪而无正条，其应出罪者，则举重以明轻”，应处绞刑"},{"k":"C","t":"致伤未死，应处流三千里"},{"k":"D","t":"属于“十恶”犯罪中的“不孝”行为，应处极刑"}],"answerRef":"A。唐律中，“诸断罪而无正条，其应入罪者，则举轻以明重，其应出罪者，则举重以明轻”，具体说来就是刑罚适用上的“类推原则”，相似情况，相同处理。其含义为:对法无明文规定的犯罪，凡应减轻处罚的，则列举重罚处罚的规定，比照从轻处断；凡应加重处刑的犯罪，则列举轻罚处刑的规定，比照从重处断。如本案中，谋杀尊亲处斩，但无已伤杀重罪的条文，在处理已伤尊亲的案件时，通过类推就可以知道更应处以斩刑。即举轻（预谋伤害）以明重（已经伤害），相同处理，处斩刑，A对，B、C错。不孝，指对直系尊亲属有忤逆言行，如控告或咒骂祖父母、父母；祖父母、父母在世时别籍异财，不予供养；居父母丧时嫁娶作乐，脱去丧服，改着吉服；闻祖父母、父母丧，匿不举哀；诈称祖父母、父母死亡。而殴打及谋杀祖父母、父母属于恶逆，而不是不孝，D错。","auto":"A","link":"https://weibo.com/3612107761/Rb1VYcrBz"},{"num":81,"day":"2026-07-31","stem":"【唐】下列选项属依唐律为国家服徭役和纳赋税的法定年龄的是？","options":[{"k":"A","t":"黄"},{"k":"B","t":"小"},{"k":"C","t":"中"},{"k":"D","t":"丁"}],"answerRef":"D。关于民事行为能力，唐朝既没有明确的概念，也没有统一的年龄规定，大体上与法律所确认的丁年，即为国家服徭役和缴纳赋税的法定年龄相当。唐高祖武德七年定令：“凡男女始生为黄，四岁为小，十六为中，二十有一为丁，六十为老。”后来又改二十二、二十三岁为丁，五十八岁为老。","auto":"D","link":"https://weibo.com/3612107761/RbbyxAz95"},{"num":82,"day":"2026-08-01","stem":"【唐】唐朝时期，杨氏嫁与王某为妻，后杨父生活不能自理，杨氏为尽孝道，欲长期照顾杨父，王某答应与杨氏解除婚姻关系。下列说法正确的是？","options":[{"k":"A","t":"官府可据此强制解除婚姻关系"},{"k":"B","t":"双方可以适用“和离”"},{"k":"C","t":"王某可根据七出休妻"},{"k":"D","t":"杨氏可根据义绝强制解除婚姻关系"}],"answerRef":"B。“和离”是指夫妻双方可以通过协商达成合议解除婚姻关系，“义绝”是一种强制离婚制度，指夫妻间或夫妻双方亲属之间或夫妻一方对他方亲属有殴、骂、杀、奸等行为，视为夫妻双方恩断义绝，无论夫妻双方是否同意，由官府主导强制离婚。本题中杨氏为照顾父亲，与丈夫王某合议解除婚姻关系，不存在“七出”的过错，也不符合“义绝”的要求，而属于“和离”的情形，据此B对，A、C、D错。","auto":"B","link":"https://weibo.com/3612107761/RbkPhkVeb"},{"num":83,"day":"2026-08-02","stem":"【唐】唐朝“掌以刑法典章，纠正百官之罪恶”的国家机构是？","options":[{"k":"A","t":"刑部"},{"k":"B","t":"大理寺"},{"k":"C","t":"御史台"},{"k":"D","t":"尚书省"}],"answerRef":"C。刑部是唐朝主复核机关，A错。大理寺是唐朝主审判机关，B错。唐朝中央设御史台作为最高监察机关，“掌邦国刑宪、典章之政令，以肃正朝列”，“掌以刑法典章，纠正百官之罪恶”，C对。作为三省之一的尚书省，负责执行皇帝的诏敕和经皇帝批准的各项政令，尚书省下设六部，D错。","auto":"C","link":"https://weibo.com/3612107761/RbuwQE0zf"},{"num":84,"day":"2026-08-03","stem":"【唐】为提倡惜贤敬老的社会风尚，唐朝对致仕官员往往给予一些特殊的政治礼遇和经济待遇。致仕以后，五品以上官仍给半禄，其他官也有永业田可养老。唐朝官员的致仕年龄为？","options":[{"k":"A","t":"50岁"},{"k":"B","t":"60岁"},{"k":"C","t":"70岁"},{"k":"D","t":"80岁"}],"answerRef":"C。退休年龄：汉唐为70岁，明朝为60岁。","auto":"C","link":"https://weibo.com/3612107761/RbDOWwMN7"},{"num":85,"day":"2026-08-03","stem":"【唐】唐德宗建中元年，实行两税法。此建议的提出者是宰相？","options":[{"k":"A","t":"长孙无忌"},{"k":"B","t":"房玄龄"},{"k":"C","t":"李林甫"},{"k":"D","t":"杨炎"}],"answerRef":"D。唐太宗命长孙无忌、房玄龄等人全面修订律令，经过11年的时间，完成并正式颁布《贞观律》，A、B错。唐玄宗开元年间，由李林甫等人主持修订《永徽律疏》，删除不合时宜的条款与称谓，颁行刊定天下，称为《开元律》，C错。唐德宗建中元年，采纳宰相杨炎的建议，实行两税法。两税法的基本原则是量出制入，即以大历十四年之垦田数为准，总计当时各种开支总数以定两税总数。按每户的土地面积征收地税，按财产多寡确定的户等征收户税，每年分夏秋两季征收。过去的租庸调以及杂税一律废除，所有主户客户，无论是定居还是行商，均须纳税，税额由资产和田亩数确定，D对。","auto":"D","link":"https://weibo.com/3612107761/RbMWba4ds"},{"num":86,"day":"2026-08-04","stem":"【唐】在唐律中，规定“诸市司评物价不平者，计所贵贱，坐赃论”的篇目是？","options":[{"k":"A","t":"《名例律》"},{"k":"B","t":"《擅兴律》"},{"k":"C","t":"《诈伪律》"},{"k":"D","t":"《杂律》"}],"answerRef":"D。《名例律》规定刑种、定罪量刑一般原则以及律文之中有关专门术语的界定，A错。《擅兴律》规定军队的征调指挥、行军出征、军需供给和工程兴造方面的法律，B错。《诈伪律》是关于惩治欺诈和伪造的法律，C对。《杂律》主要规定市场管理、债权债务、犯奸失火等犯罪，题干所引条文规定的是唐朝市场管理制度的内容。唐律规定，对于评品物价不平者，计价格差距，按坐赃罪处理，D对。","auto":"D","link":"https://weibo.com/3612107761/RbWeJ8d0g"},{"num":87,"day":"2026-08-05","stem":"【唐】中国历史上第一项外贸征税法令颁行于？","options":[{"k":"A","t":"秦朝"},{"k":"B","t":"汉朝"},{"k":"C","t":"唐朝"},{"k":"D","t":"宋朝"}],"answerRef":"C。贞观十七年（643年）诏令，对外国商船贩至中国的龙香、沉香、丁香、白豆蔻四种货物，政府抽取1/10的实物税，C对。","auto":"C","link":"https://weibo.com/3612107761/Rc5Hj866n"},{"num":88,"day":"2026-08-07","stem":"【唐】在广州设置市舶使，是为国家首置外贸专职官署的是？","options":[{"k":"A","t":"唐太宗"},{"k":"B","t":"唐高宗"},{"k":"C","t":"唐玄宗"},{"k":"D","t":"武则天"}],"answerRef":"D。武则天统治时期，在广州设置市舶使，为国家首置外贸专职官署。对外贸易活跃地区的地方官也有一定管理外贸的权力。","auto":"D","link":"https://weibo.com/3612107761/RcfqviA24"},{"num":89,"day":"2026-08-08","stem":"【唐】关于隋唐的法律制度，下列说法错误的是？","options":[{"k":"A","t":"隋朝的《开皇律》确立了封建制新五刑：死、流、徒、杖、笞"},{"k":"B","t":"张某杀人碎尸，按唐律当定“不道”之罪"},{"k":"C","t":"官员在执行公务时不慎出现差错而犯罪，是为“公罪”"},{"k":"D","t":"唐代的刑部行使中央司法审判权"}],"answerRef":"D。夏商时期确立奴隶制旧五刑：墨、劓、剕、宫、大辟刑，隋朝《开皇律》确立封建制新五刑：死、流、徒、杖、笞，A对。十恶中的“不道”包括杀一家非死罪者三人，或用肢解分尸的手段杀人；或用蛊毒的方法，企图使人中毒致死等行为，B对。唐律规定“缘公事致罪，而无私曲者”是为“公罪”，官员在执行公务时不慎出现差错而犯罪的情形发生在履行公务过程中，且并非为求私利而犯罪，属于“公罪”，C对。唐代行使中央审判权的机关为大理寺，刑部主管复核，D错。","auto":"D","link":"https://weibo.com/3612107761/RcoQZz4F0"},{"num":90,"day":"2026-08-08","stem":"【宋】中国历史上第一部刊版印行的法典是？","options":[{"k":"A","t":"《法经》"},{"k":"B","t":"《唐律疏议》"},{"k":"C","t":"《宋刑统》"},{"k":"D","t":"《条画五章》"}],"answerRef":"C。《法经》作为历史上第一部比较系统、完整的成文法典，在中国立法史上具有重要地位，但并未刊版印行，A错。《唐律疏议》是现存最早、最完整的古代法典，也是中国古代最具影响力的法典，集中体现了唐朝法律空前发达的盛况，但并未刊版印行，B错。宋朝建立后不久，太祖即制定颁布了《宋建隆重详定刑统》，简称《宋刑统》，共12篇，502条，“模印颁行”天下，成为中国历史上第一部刊版印行的法典，C对。成吉思汗时期（1211年），下令郭宝玉制定新令，批准颁布《条画五章》，这是蒙古政权第一次汉化的立法，但它并不是第一部刊版印行的法典，D错。","auto":"C","link":"https://weibo.com/3612107761/Rcy4om69e"},{"num":91,"day":"2026-08-10","stem":"【宋】中国古代对一种刑罚有如下描述：“流罪得免远徙，徒罪得免役年，笞杖得减决数”。该材料描述的刑罚是？","options":[{"k":"A","t":"廷杖"},{"k":"B","t":"刺配"},{"k":"C","t":"凌迟"},{"k":"D","t":"折杖"}],"answerRef":"D。廷杖是明朝皇帝处罚大臣的非常之刑。明律中并无廷杖的刑罚，但从朱元璋开始，经常于殿廷之上，由司礼监监刑，锦衣卫施刑，杖责冒犯皇帝的大臣，A错。刺配是将杖刑、配役、刺面三刑同时施于一人的复合刑罚，“既杖其脊，又配其人，而且刺其面，是一人之身，一事之犯而兼受三刑”，B错。凌迟，也作陵迟，俗称“千刀万剐”，是以利刃零割碎剐残损肢体，使受刑人在极端痛苦中缓慢死去的酷刑，这是古代死刑中最为残酷的行刑方式，C错。折杖法为宋太祖建隆四年创立，此法将笞刑、杖刑折为臀杖；徒刑折为脊杖，杖后释放；流刑折为脊杖，并于本地配役一年；加役流，脊杖后就地配役三年。但死刑及反逆、强盗等重罪不适用此法，D对。","auto":"D","link":"https://weibo.com/3612107761/RcHI3pkoe"},{"num":92,"day":"2026-08-10","stem":"【宋】宋朝最高军事行政机关是？","options":[{"k":"A","t":"中书门下"},{"k":"B","t":"枢密院"},{"k":"C","t":"制勘院"},{"k":"D","t":"推勘院"}],"answerRef":"B。中书门下是宋朝的最高行政机关，其长官“中书门下平章事”通常由两三人担任，实际行使宰相的权力。为防范相权过重，又设副相“参知政事”，A错。枢密院为最高军事行政机关，其长官枢密使与宰相同品级，故与中书门下并称“二府”。军政移于枢密院，削弱了宰相的权柄，又使枢密院和宰相互相牵制，B对。宋初还增设制勘院和推勘院等临时性机构，负责审理皇帝交办的案件，C、D错。","auto":"B","link":"https://weibo.com/3612107761/RcQWksUre"},{"num":93,"day":"2026-08-12","stem":"【宋】有文献评价某朝的法制状况：“收乡长、镇将之权悉归于县，收县之权悉归于州，收州之权悉归于监司，收监司之权悉归于朝廷。”这段话所评价的朝代是？","options":[{"k":"A","t":"汉朝"},{"k":"B","t":"唐朝"},{"k":"C","t":"宋朝"},{"k":"D","t":"明朝"}],"answerRef":"C。宋朝地方有路、州、县三级。第一，宋朝地方机构新设路一级政权，实际上是中央派出机构，并使其权一分为四，其长官为经略安抚使、转运使、提点刑狱使、提举常平使，称之为“四司”，分别监管地方军政、财赋、司法、盐铁专卖等事。四司互不统属而互相监督，皆听命于皇帝。第二，路下设府、州、军、监为直属中央的同级行政机关，州级长官由朝廷任命文官担任。第三，州以下仍为县，由皇帝任命文官为知县。宋朝地方行政权力之高度集中于中央，为前代所未曾有，其结果是唐末以来形成的藩镇割据消灭殆尽，但是地方上独立处置和应付事变的能力也随之削弱。","auto":"C","link":"https://weibo.com/3612107761/Rd0zbwvGM"},{"num":94,"day":"2026-08-12","stem":"【宋】下列被评价为“官与职殊”“名与实分”的是？","options":[{"k":"A","t":"务限法"},{"k":"B","t":"鞫谳分司制"},{"k":"C","t":"翻异别推制"},{"k":"D","t":"差遣制"}],"answerRef":"D。务限法即规定在农务繁忙季节停止民事诉讼审判的法律制度，A错。鞫谳分司制，即“审”与“判”分为两事，分别由不同的官员担当，二者相互牵制。审问案情的官员无权量刑，检法量刑之事别由其他官员负责，B错。翻异别推制，又称翻异别勘制，是为防止冤假错案而建立的复审制度，即在发生犯人推翻原有口供，而且“所翻情节，实碍重罪”时，案件须重新审理，应将该案交由其他司法官或司法机构重新审理，C错。宋官制区分官、职、遣：官只代表其品级和俸禄高低。职是文官的荣誉虚衔。差遣才是其实际的职事。这种“官与职殊”“名与实分”的差遣制虽着眼于巩固君主中央集权，但也酿成了宋一代的冗官之弊，D对。","auto":"D","link":"https://weibo.com/3612107761/Rd9RL8kTX"},{"num":95,"day":"2026-08-13","stem":"【宋】宋初“以防大理、刑部之失”于禁中特设的司法机构是？","options":[{"k":"A","t":"枢密院"},{"k":"B","t":"都察院"},{"k":"C","t":"审刑院"},{"k":"D","t":"大理院"}],"answerRef":"C。枢密院是宋朝中央最高军事行政机关，A错。都察院是明清时期中央最高监察机关，B错。宋初为强化皇帝对中央司法机关的控制，另于禁中特设审刑院，“以防大理、刑部之失”。凡须奏报皇帝的各种案件，经大理寺断谳后，须报审刑院复核，由知院事和详议官拟出定案文稿，经中书省奏报皇帝论决，C对。大理院是清末及北洋政府时期的中央最高司法审判机关，D错。","auto":"C","link":"https://weibo.com/3612107761/RdjgvxvjJ"},{"num":96,"day":"2026-08-14","stem":"【宋】宋初为强化皇帝对中央司法机关的控制，在皇宫中设立？","options":[{"k":"A","t":"审官院"},{"k":"B","t":"审刑院"},{"k":"C","t":"宣政院"},{"k":"D","t":"理藩院"}],"answerRef":"B。审官院是宋朝对在京中央官员进行考课的机关，A错。宋初为强化皇帝对中央司法机关的控制，另于禁中特设审刑院，“以防大理、刑部之失”。凡须奏报皇帝的各种案件，经大理寺断谳后，须报审刑院复核，由知院事和详议官拟出定案文稿，经中书省奏报皇帝论决，B对。宣政院是元朝中央最高宗教审判机关，C错。理藩院是清朝设立的少数民族案件的上诉审机关，D错。","auto":"B","link":"https://weibo.com/3612107761/RdsBjyj2k"},{"num":97,"day":"2026-08-16","stem":"【宋】宋朝元丰年间，方圆村村民岳某与竹马村村民车某因发生民间借贷纠纷，岳某欲告官解决。依《宋刑统》的规定，官府可以受理岳某词状的时间是？","options":[{"k":"A","t":"五月初一"},{"k":"B","t":"七月初一"},{"k":"C","t":"九月初一"},{"k":"D","t":"十一月初一"}],"answerRef":"D。务限法即规定在农务繁忙季节停止民事诉讼审判的法律制度。“务”指农务，规定每年农历二月初一“入务”，即开始进入农忙季节，直到九月三十日止。在“务限”期内，州县官停止受理有关田宅、婚姻、债负、地租等民事案件，限满之日即十月初一日称“务开”，方可受理上述案件，直至次年入务日为止。","auto":"D","link":"https://weibo.com/3612107761/RdCmW3S6e"},{"num":98,"day":"2026-08-16","stem":"【宋】世界上第一部比较系统的法医学专著是？","options":[{"k":"A","t":"《名公书判清明集》"},{"k":"B","t":"《洗冤集录》"},{"k":"C","t":"《大札撒》"},{"k":"D","t":"《淳熙条法事类》"}],"answerRef":"B。《名公书判清明集》是一部“名公”所作的诉讼判词和官府公文的分类汇编，其中绝大部分为民事诉讼判词，包括官吏、赋役、文事、户婚、人伦、人品、惩恶计七门。主要辑录了包括朱熹、真德秀、胡石壁等多位“名公”任官期间所作的部分判词，集中反映了当时的法律实践以及理学思想对立法和司法审判的渗透，A错。《洗冤集录》是宋慈所著的一部法医学专著。南宋理宗时期，湖南提点刑狱使宋慈总结历代法医检验技术，结合自己的办案实践，编著了这本世界上第一部比较系统的法医学专著，并获准颁行全国，成为司法检验活动的指南，B对。“札撒”，蒙语“大法令”之意，是古代蒙古部落首领对部众发布的命令，是蒙古人早期初创性的法律规范和生活习惯。大蒙古国建立之后，成吉思汗于1225年下令编撰札撒和训令，史称《大札撒》或《札撒大全》，C错。南宋孝宗淳熙年间，为了适应司法实践的需要，把相关的敕、令、格、式及指挥、申明（法律解释）等，依事分门别类加以汇编，名之为《淳熙条法事类》。“条法事类”的出现是宋朝法典编纂体例的又一创新，D错。","auto":"B","link":"https://weibo.com/3612107761/RdLdkdGGZ"},{"num":99,"day":"2026-08-17","stem":"【宋】辽朝第一部比较完整的法典是？","options":[{"k":"A","t":"《新定条例》"},{"k":"B","t":"《贞观玉镜统》"},{"k":"C","t":"《天盛改旧新定律令》"},{"k":"D","t":"《皇统制》"}],"answerRef":"A。辽兴宗重熙五年编成《新定条例》547条，是辽朝第一部比较完整的法典，史称《重熙条例》，A对。《贞观玉镜统》是西夏的军法典，B错。西夏仁宗天盛年间，正式制定《天盛改旧新定律令》，共20卷，150门，1461条。该法典无注释、附例，仅律令条文达20余万言，其详细程度为中古法令之最。内容涵盖刑事法、行政法、经济法、民事法、诉讼法、军事法等，C错。熙宗皇统三年，制定了金朝第一部成文法典《皇统制》，D错。","auto":"A","link":"https://weibo.com/3612107761/RdUZTaale"},{"num":100,"day":"2026-08-18","stem":"【宋】辽、西夏、金时期详细程度为中古法令之最的法律典籍是？","options":[{"k":"A","t":"《新定条例》"},{"k":"B","t":"《贞观玉镜统》"},{"k":"C","t":"《天盛改旧新定律令》"},{"k":"D","t":"《皇统制》"}],"answerRef":"C。辽兴宗重熙五年编成《新定条例》547条，是辽朝第一部比较完整的法典，史称《重熙条例》，A错。《贞观玉镜统》是西夏的军法典，B错。西夏仁宗天盛年间，正式制定《天盛改旧新定律令》，共20卷，150门，1461条。该法典无注释、附例，仅律令条文达20余万言，其详细程度为中古法令之最。内容涵盖刑事法、行政法、经济法、民事法、诉讼法、军事法等，C对。熙宗皇统三年，制定了金朝第一部成文法典《皇统制》，D错。","auto":"C","link":"https://weibo.com/3612107761/Re4ivgt3T"},{"num":101,"day":"2026-08-19","stem":"【宋】金朝第一部成文法典是？","options":[{"k":"A","t":"《新定条例》"},{"k":"B","t":"《贞观玉镜统》"},{"k":"C","t":"《天盛改旧新定律令》"},{"k":"D","t":"《皇统制》"}],"answerRef":"D。辽兴宗重熙五年编成《新定条例》547条，是辽朝第一部比较完整的法典，史称《重熙条例》，A错。《贞观玉镜统》是西夏的军法典，B错。西夏仁宗天盛年间，正式制定《天盛改旧新定律令》，共20卷，150门，1461条。该法典无注释、附例，仅律令条文达20余万言，其详细程度为中古法令之最。内容涵盖刑事法、行政法、经济法、民事法、诉讼法、军事法等，C错。熙宗皇统三年，制定了金朝第一部成文法典《皇统制》，D对。","auto":"D","link":"https://weibo.com/3612107761/RedPC2PHl"},{"num":102,"day":"2026-08-20","stem":"【宋】辽、西夏、金时期，从形式到内容实现了全面汉化、被后人称其“实唐律也”的法律是？","options":[{"k":"A","t":"《新定条例》"},{"k":"B","t":"《天盛改旧新定律令》"},{"k":"C","t":"《皇统制》"},{"k":"D","t":"《泰和律义》"}],"answerRef":"D。辽兴宗重熙五年编成《新定条例》547条，是辽朝第一部比较完整的法典，史称《重熙条例》，A错。西夏仁宗天盛年间，正式制定《天盛改旧新定律令》，共20卷，150门，1461条。该法典无注释、附例，仅律令条文达20余万言，其详细程度为中古法令之最。内容涵盖刑事法、行政法、经济法、民事法、诉讼法、军事法等，B错。熙宗皇统三年，制定了金朝第一部成文法典《皇统制》，C错。金朝章宗泰和二年颁行《泰和律令敕条格式》，包括《泰和律义》12篇，《泰和令》20卷，《新定敕条》3卷及《六部格式》30卷。至此，金朝形成了如宋朝一样的律、令、格、式、编敕体系，从形式到内容实现了全面汉化。金朝法制汉化程度远超辽和西夏。尤其是《泰和律义》12篇名目与唐宋雷同，后人称其“实唐律也”，D对。","auto":"D","link":"https://weibo.com/3612107761/RenfGpKsa"},{"num":103,"day":"2026-08-22","stem":"【元】蒙古政权第一次汉化的立法是？","options":[{"k":"A","t":"《约法三章》"},{"k":"B","t":"《条画五章》"},{"k":"C","t":"《至元新格》"},{"k":"D","t":"《大扎撒》"}],"answerRef":"B。刘邦攻占咸阳后，曾以废除秦朝苛法为号召，与关中父老“约法三章”。“约法三章”既是西汉立法之开端，也对刘邦争取民心、赢得楚汉战争的胜利继而夺取全国政权起到重要作用，A错。成吉思汗时期，下令郭宝玉制定新令，批准颁布《条画五章》，这是蒙古政权第一次汉化的立法，B对。《至元新格》侧重行政、财政、民事等方面，是元朝统一中国后颁布的第一部比较系统的成文法典，C错。“札撒”，蒙语“大法令”之意，是古代蒙古部落首领对部众发布的命令，是蒙古人早期初创性的法律规范和生活习惯。大蒙古国建立之后，成吉思汗于1225年下令编纂札撒和训令，史称《大札撒》或《札撒大全》，D错。","auto":"B","link":"https://weibo.com/3612107761/RewLNw0Xc"},{"num":104,"day":"2026-08-23","stem":"【元】在法律内容上“暗用而明不用，名废而实不废”，将律文大量化为条格、断例等形式的朝代是？","options":[{"k":"A","t":"秦"},{"k":"B","t":"唐"},{"k":"C","t":"宋"},{"k":"D","t":"元"}],"answerRef":"D。由于元朝立国之始便排斥汉族原有的法律体系，所以没有沿袭唐宋时期传统的立法形式，只是以符合蒙古习惯的令、条格、制、敕、断例等庞杂的法律形式，替代国家统一律典的编纂。在法律内容上“暗用而明不用，名废而实不废”，将唐宋之律文大量化为条格、断例等形式，使条格和断例成为法律的主要形式。","auto":"D","link":"https://weibo.com/3612107761/ReGcF7f4x"},{"num":105,"day":"2026-08-24","stem":"【元】元朝统一中国后颁布的第一部比较系统的成文法典是？","options":[{"k":"A","t":"《条画五章》"},{"k":"B","t":"《大札撒》"},{"k":"C","t":"《至元新格》"},{"k":"D","t":"《大元通制》"}],"answerRef":"C。成吉思汗时期，下令郭宝玉制定新令，批准颁布《条画五章》，这是蒙古政权第一次汉化的立法，A错。“札撒”，蒙语“大法令”之意，是古代蒙古部落首领对部众发布的命令，是蒙古人早期初创性的法律规范和生活习惯。大蒙古国建立之后，成吉思汗于1225年下令编纂札撒和训令，史称《大札撒》或《札撒大全》，B错。元世祖于至元二十八年令中书右丞相何荣祖等“以公规、治民、御盗、理财等十事辑为一书，名曰《至元新格》，令刻版颁行，使百司遵守”。《至元新格》侧重行政、财政、民事等方面，是元朝统一中国后颁布的第一部比较系统的成文法典，C对。《大元通制》颁行于元英宗至治三年，共2539条，分诏制、条格、断例、别类四部分，其篇目仿唐、宋旧律，分为20篇。《大元通制》是一部由法规和判例组成的汇编，是成文法与判例法的结合。它的编成标志着元建立以来法典编纂已基本完成，元代法典至此定型，D错。","auto":"C","link":"https://weibo.com/3612107761/RePJclqTC"},{"num":106,"day":"2026-08-24","stem":"【元】“诸强奸人幼女者，处死；虽和同强，女不坐。”规定这一法律的是？","options":[{"k":"A","t":"隋朝"},{"k":"B","t":"唐朝"},{"k":"C","t":"宋朝"},{"k":"D","t":"元朝"}],"answerRef":"D。元朝罪名体系最为显著的变化，是强奸幼女罪的确立。《唐律疏议》和《宋刑统》规定的奸类罪中，未特别列出强奸幼女罪。元朝法律则规定：“诸强奸人幼女者，处死；虽和同强，女不坐。”处罚比一般强奸罪（杖107）要重得多。元朝将“幼女”的年龄界定为10岁以下。而且，犯强奸幼女罪，一般不适用赎法。","auto":"D","link":"https://weibo.com/3612107761/ReYTCe9FS"},{"num":107,"day":"2026-08-25","stem":"【元】下列选项中有“充警迹人，红泥粉壁”制度，规定强盗、窃盗罪犯在服刑完毕后，发付原籍充“警迹人”的朝代是？","options":[{"k":"A","t":"秦"},{"k":"B","t":"汉"},{"k":"C","t":"唐"},{"k":"D","t":"元"}],"answerRef":"D。元朝确立“充警迹人，红泥粉壁”制度，规定强盗、窃盗罪犯在服刑完毕后，发付原籍充“警迹人”。在其家门首立红泥粉壁，其上开具姓名、犯事情由，由邻居监督其行止，且每半个月需面见官府接受督察，五年不犯者除籍，再犯者终身拘籍。通过昭示盗贼犯人之劣迹，以彰其过，达到“自警亦警人”的目的，有些类似于现代的社区矫正制度。","auto":"D","link":"https://weibo.com/3612107761/Rf8oYkl9U"},{"num":108,"day":"2026-08-27","stem":"【元】结束了以诗赋取士的历史，首创以程朱理学为内容的经义取士制度的是？","options":[{"k":"A","t":"唐朝"},{"k":"B","t":"宋朝"},{"k":"C","t":"元朝"},{"k":"D","t":"明朝"}],"answerRef":"C。唐朝科举考试以明经、进士二科最受重视，A错。宋朝科举考试内容仍侧重诗赋、经义，B错。元朝建立以后，科举考试制度长期停废，直至元仁宗延祐元年才恢复。元朝的科举每三年举行一次，分为乡试、会试和殿试三级。元朝结束了以诗赋取士的历史，首创以程朱理学为内容的经义取士制度，对明清科举制度影响很大，C对、D错。","auto":"C","link":"https://weibo.com/3612107761/RfhRnc65T"},{"num":109,"day":"2026-08-28","stem":"【元】元朝的全国最高宗教审判机关是？","options":[{"k":"A","t":"大宗正府"},{"k":"B","t":"宣政院"},{"k":"C","t":"刑部"},{"k":"D","t":"大理寺"}],"answerRef":"B。大宗正府专门负责审理蒙古人、色目人和宗室的案件，既是元朝管理蒙古贵族事务的机构，又是具有独立管辖范围的中央司法机关，A错。宣政院是主持全国佛教事务和统领吐蕃地区军、民之政的中央机构，同时也是全国最高宗教审判机关，负责审理重大的僧侣案件和僧俗纠纷案件，B对。元朝的刑部属中书省，掌司法行政与审判，原属大理寺的职能，部分地归于刑部，元朝裁撤了大理寺的建制，C、D错。","auto":"B","link":"https://weibo.com/3612107761/Rfrjx46Cm"},{"num":110,"day":"2026-08-29","stem":"【明】帝制中国最后一部令典是？","options":[{"k":"A","t":"《武德令》"},{"k":"B","t":"《贞观令》"},{"k":"C","t":"《大明令》"},{"k":"D","t":"《大清令》"}],"answerRef":"C。令是规定国家制度、规章制度方面的政令，律才是定罪量刑的法典。明朝制定《大明令》之后不再单独修令，国家的行政规范转由会典、条例等承担，故《大明令》成为帝制中国最后一部令典，C对。《武德令》《贞观令》均为唐朝令典，A、B错。清朝未曾制定独立的令典，《大清令》并不存在，D错。","auto":"C","link":"https://weibo.com/3612107761/RfAPFBHVH"}]}
