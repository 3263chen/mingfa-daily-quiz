    data: {"author":"刑法车润海","generated":"2026-08-29","questions":[{"num":1,"day":"2026-06-28","stem":"甲明知乙患有心脏病，仍然对其辱骂，乙因情绪激动而病发。甲见状逃离现场，乙因未得到及时救助而死亡。对甲应当认定为：（单选）","options":[{"k":"A","t":"作为犯罪（故意杀人罪）"},{"k":"B","t":"不作为犯罪（故意杀人罪）"},{"k":"C","t":"作为犯罪（过失致人死亡罪）"},{"k":"D","t":"意外事件"}],"answerRef":"B。解析：根据构成要件行为的类型化原理，只有致死概率高的行为才能解释为故意杀人行为。甲虽然明知乙患有心脏病，仍然对其辱骂，但辱骂心脏病患者的行为，造成死亡结果的概率依然很低。如果将此种行为解释为故意杀人会产生两大问题： 一是，明知他人有心脏病而与其发生争吵，是否也应解释为故意杀人行为？二是，辱骂心脏病患者，但对方并未病发，对行为人是否认定为故意杀人罪未遂？ 因此，针对心脏病患者的辱骂行为不能直接认定为故意杀人罪。但是，甲的辱骂行为导致乙病发，客观上甲因先前的辱骂行为对乙负有救助义务。在乙病发时甲故意不救助乙，此时致人死亡的概率较高。根据构成要件行为的类型化原理，甲故意不救助乙，放任死亡结果发生的行为，可认定为不作为的故意杀人罪。","auto":"B","link":"https://weibo.com/1669134634/R6apedKnc"},{"num":2,"day":"2026-06-29","stem":"下列选项中，15周岁的行为人不负刑事责任的是？（单选）","options":[{"k":"A","t":"甲在聚众斗殴中致人死亡"},{"k":"B","t":"乙非法拘禁他人使用暴力致人伤残"},{"k":"C","t":"丙走私海洛因8000克"},{"k":"D","t":"丁偶尔与不满10周岁的幼女发生性关系"}],"answerRef":"C。解析：已满14周岁不满16周岁的人，犯故意杀人、故意伤害致人重伤或者死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质罪的，应当负刑事责任。 A项，聚众斗殴致人死亡的，行为转化为故意杀人罪，甲应当负刑事责任；A项不当选。 B项，非法拘禁他人使用暴力致人伤残，行为转化为故意伤害罪致人重伤，乙应当负刑事责任；B项不当选。 C项，15周岁的行为人仅需对贩卖毒品罪承担刑事责任，对走私毒品罪不负刑事责任；C项当选。 D项，根据司法解释，已满14周岁不满16周岁的人偶尔与幼女发生性行为，情节轻微，未造成严重后果的，不认为是犯罪。 但是，立法上将“奸淫不满十周岁的幼女”规定为强奸罪的加重处罚情节。因此，与不满10周岁的幼女发生性关系不可能属于司法解释规定的“情节轻微”，故丁的行为构成强奸罪，且应当按照加重处罚情节处理。D项不当选。","auto":"C","link":"https://weibo.com/1669134634/R6jPZ17dE"},{"num":3,"day":"2026-06-30","stem":"关于犯罪的主观方面，下列选项错误的是？（单选）","options":[{"k":"A","t":"犯罪动机不是任何犯罪的构成要件"},{"k":"B","t":"犯罪目的是某些犯罪的构成要件"},{"k":"C","t":"间接故意不存在犯罪目的"},{"k":"D","t":"间接故意不存在犯罪动机"}],"answerRef":"A。解析：犯罪动机是推动行为人实施犯罪行为的内心起因。对于绝大多数犯罪而言，犯罪动机不是构成要件。但对于少数犯罪而言，犯罪动机则是构成要件。如构成徇私枉法罪，要求行为人具有徇私徇情的动机，否则便不构成徇私枉法罪。因此，A项错误。 犯罪目的是某些犯罪的构成要件，如多数财产犯罪要求行为人以非法占有他人财物为目的；绑架罪要求以勒索财物等为目的。B项正确。 犯罪目的与犯罪动机只能存在于直接故意中，因为两者都是追求特定危害结果发生。因此，间接故意中不存在犯罪目的与犯罪动机。C、D项正确。","auto":"A","link":"https://weibo.com/1669134634/R6tvpCphA"},{"num":4,"day":"2026-07-01","stem":"甲深夜潜入乙家行窃，发现留长发、穿花色睡衣的乙正在睡觉，便扑向乙身强脱其衣。乙惊醒后大声喝问，甲才发现乙是男性。关于甲的行为，错误的是？（多选）","options":[{"k":"A","t":"强奸罪预备"},{"k":"B","t":"强奸罪未遂"},{"k":"C","t":"强奸罪中止"},{"k":"D","t":"事实认识错误"}],"answerRef":"AC。解析：甲意图奸淫乙，已经“扑向乙身强脱其衣”了，因此已经进入犯罪的实行阶段，只能成立犯罪实行阶段的中止或未遂，不构成犯罪预备。本案中，甲放弃犯罪的原因是乙的男性身份，不可能完成强奸。因此，甲放弃犯罪是因为自己意志以外的原因，只能成立犯罪未遂，不可能成立犯罪中止。因此，甲的行为是对象不能犯未遂。B项说法正确。A、C项说法错误。 本案中，甲误男为女，属于对象不能犯未遂，属于广义的事实认识错误。因此，不能犯未遂，从定义上看，是指因事实认识错误，不可能达到既遂的未遂。","auto":"AC","link":"https://weibo.com/1669134634/R6CGY7yWo"},{"num":5,"day":"2026-07-02","stem":"甲欲杀丙，故意将装好子弹的枪递给乙，并欺骗乙说是空枪。甲指使乙向丙开枪，结果丙中弹身亡。对甲、乙的认定，错误的是？（多选）","options":[{"k":"A","t":"构成共同犯罪"},{"k":"B","t":"不构成共同犯罪"},{"k":"C","t":"以共同过失犯罪论处"},{"k":"D","t":"甲构成故意杀人罪的教唆犯"}],"answerRef":"ACD。解析：间接正犯，又称间接实行犯，是指支配犯罪的幕后者，即将他人作为犯罪的工具，通过支配他人实施犯罪。 间接正犯的成立条件：一是客观上对实行者有支配力；二是主观上对实行者有支配的故意。甲以欺骗手段支配乙的杀人事实，构成故意杀人罪的间接实行犯，乙构成过失致人死亡罪。 本案中，甲具有犯罪故意，乙没有犯罪故意。根据《刑法》第25条，共同犯罪是指二人以上共同故意犯罪，故甲、乙不构成共同犯罪。 提示：成立教唆犯，要求教唆他人去故意犯罪，如果故意利用他人的过失行为，则构成间接正犯。","auto":"ACD","link":"https://weibo.com/1669134634/R6M7qhMJt"},{"num":6,"day":"2026-07-03","stem":"甲盗窃丙的财物，丙抓捕甲。甲请求乙帮助，乙与甲一起殴打丙致其重伤。 假设一：乙以为丙在抢劫甲的财物，为帮助甲才对丙使用暴力。甲、乙的行为:（单选，本题较难，请仔细思考）","options":[{"k":"A","t":"甲、乙构成共同犯罪"},{"k":"B","t":"甲不构成结果加重犯"},{"k":"C","t":"乙构成故意伤害罪"},{"k":"D","t":"乙不具有法定的从宽处罚情节"}],"answerRef":"D。解析：乙误将丙当做不法侵害人，对其使用暴力，属于假想防卫。由于假想防卫不可能构成故意犯罪，故甲、乙不构成共同犯罪（甲是故意，乙为过失）。A项错误。 甲在盗窃他人财物时，为抗拒抓捕当场对丙使用暴力，其行为转化为抢劫罪，属于抢劫罪致人重伤的结果加重犯。B项错误。 由于乙属于假想防卫，故不构成故意伤害罪（假想防卫无故意），应当认定为过失致人重伤罪。C项错误。 针对防卫过当的情形，应当减轻或者免除处罚。但是，假想防卫不是防卫过当，不属于法定的从宽处罚情节。D项正确。","auto":"D","link":"https://weibo.com/1669134634/R6VxOm3SG"},{"num":7,"day":"2026-07-04","stem":"甲盗窃丙的财物，丙抓捕甲。甲请求乙帮助，乙与甲一起殴打丙致其重伤。 假设二：乙明知甲的所作所为，为帮助甲脱身而对丙使用暴力。关于甲、乙的行为，错误的是？（单选，本题难度较大，请认真思考）","options":[{"k":"A","t":"甲、乙构成共同犯罪"},{"k":"B","t":"乙属于实质的一罪"},{"k":"C","t":"对乙应当认定为故意伤害罪"},{"k":"D","t":"乙构成结果加重犯"}],"answerRef":"C。解析：甲在盗窃他人财物时，为抗拒抓捕当场对丙使用暴力，其行为转化为抢劫罪。甲在抢劫过程中，乙中途加入，构成事前无通谋的共同犯罪。由于抢劫行为造成重伤结果，故乙构成抢劫致人重伤的结果加重犯，属于实质的一罪，不再认定为故意伤害罪。 提示：解题技巧为甲乙必然构成共犯，A项正确；结果加重犯属于实质的一罪，BD项同对同错，由于是单选题，故不可能同错。因此，本题选C。","auto":"C","link":"https://weibo.com/1669134634/R74Yal9Qs"},{"num":8,"day":"2026-07-05","stem":"甲盗窃丙的财物，丙抓捕甲。甲请求乙帮助，乙与甲一起殴打丙致其重伤。 假设三：乙(15周岁)明知甲为抗拒抓捕，为帮助甲脱身而对丙使用暴力。关于甲、乙的行为，正确的是？（单选，本题难度很大，请仔细思考）","options":[{"k":"A","t":"甲、乙不构成共同犯罪"},{"k":"B","t":"甲构成间接实行犯"},{"k":"C","t":"甲不再认定为教唆犯"},{"k":"D","t":"乙构成抢劫罪"}],"answerRef":"C。解析：根据司法解释，已满14周岁不满16周岁的人不符合转化抢劫的主体条件，故对乙应当认定为故意伤害罪，故甲、乙在故意伤害罪范围内构成共犯。A项错误、D项错误。 由于乙达到了故意伤害致人重伤的刑事责任年龄，故甲并未支配乙的行为，不属于间接实行犯。B项错误。 甲、乙均对丙实施了伤害行为，属于共同实行犯，对甲不再认定为教唆犯。因为教唆犯是教唆他人实行犯罪，而本人不参与犯罪的实行。C项正确。","auto":"C","link":"https://weibo.com/1669134634/R7efIf2pb"},{"num":9,"day":"2026-07-06","stem":"下列选项属于继续犯的是？","options":[{"k":"A","t":"拐卖妇女、儿童罪"},{"k":"B","t":"收买被拐卖的妇女、儿童罪"},{"k":"C","t":"故意伤害罪致人重伤，且久治不愈"},{"k":"D","t":"诈骗罪"}],"answerRef":"A。解析：继续犯，又称持续犯，是指作用于同一对象的一个犯罪行为从着手实行到实行终了，犯罪行为与不法状态在一定时间内同时处于继续状态的犯罪。 提示：继续犯的实行行为与不法状态同时开始，同时结束。 拐卖妇女、儿童罪的犯罪行为从开始“拐”，到“卖”出去存在持续的过程，属于继续犯。A项当选。 收买被拐卖的妇女、儿童罪的实行行为是“收买”，这属于非持续行为，故不属于继续犯。B项不当选。 故意伤害罪的伤害行为结束后，被害人人身损害状态并未随之结束，不属于继续犯。C项不当选。 诈骗罪属于财产犯罪，诈骗行为结束后，被害人的财产损失状态依然存在，故诈骗罪不属于继续犯，而是属于状态犯。D项不当选。","auto":"A","link":"https://weibo.com/1669134634/R7nPlgRQY"},{"num":10,"day":"2026-07-07","stem":"甲为报仇意图杀死乙，当其得知乙在值班时，便放火将值班室烧毁，结果却将帮乙值班的丙烧死。关于甲的犯罪主观方面，下列选项错误的是？（单选）","options":[{"k":"A","t":"甲具有犯罪目的"},{"k":"B","t":"甲具有犯罪动机"},{"k":"C","t":"甲具有直接故意"},{"k":"D","t":"甲具有间接故意"}],"answerRef":"D。解析：对象错误，是指行为人预想侵犯的对象与实际侵犯的对象在法律性质上相同。根据法定符合说，对象错误对行为的性质没有影响。 本案中，甲意图杀死乙，却将顶替乙值班的丙烧死。这种对象错误不影响故意的认定，因为甲想烧死值班室的人，事实上也是烧死了值班室的人。因此，甲对死亡是直接故意。甲的犯罪动机是报仇，其犯罪目的是追求他人死亡结果发生。 提示：解题技巧为排除法。在直接故意中才可能存在犯罪动机与犯罪目的。本题为单选题，具有犯罪直接故意，才可能具备犯罪动机与犯罪目的，因此ABC只可能同对，不可能同错。因此，本题选D。","auto":"D","link":"https://weibo.com/1669134634/R7xfMB9Dk"},{"num":11,"day":"2026-07-08","stem":"关于未成年人以及怀孕的妇女的规定，下列选项正确的是？（单选）","options":[{"k":"A","t":"犯罪时怀孕的妇女不适用死刑"},{"k":"B","t":"审判时未满18周岁的人不适用死刑"},{"k":"C","t":"对犯罪时符合缓刑条件的怀孕的妇女，应当宣告缓刑"},{"k":"D","t":"对审判时符合缓刑条件的怀孕的妇女，可以宣告缓刑"}],"answerRef":"B。解析：审判时（而非犯罪时）怀孕的妇女不适用死刑，这体现了对胎儿的保护。A项错误。 根据刑法规定，犯罪时未满18周岁的人不适用死刑。审判时未满18周岁的人在犯罪时必然不满18周岁，故不适用死刑。B项正确。 对审判时（而非犯罪时）符合缓刑条件的怀孕的妇女，应当（而非可以）宣告缓刑。C、D错误。 综上，本题的正确答案是B。","auto":"B","link":"https://weibo.com/1669134634/R7HzwnnNR"},{"num":12,"day":"2026-07-09","stem":"下列哪一种情形不成立累犯？","options":[{"k":"A","t":"甲因诈骗罪被判处3年有期徒刑缓刑3年，缓刑期满后的第3年又盗窃数额巨大的财物"},{"k":"B","t":"乙犯强奸罪被判处5年有期徒刑，刑满释放后的第4年，又犯妨害公务罪，被判处6个月有期徒刑"},{"k":"C","t":"丙犯抢夺罪被判处4年有期徒刑，执行3年后被假释，于假释期满后的第5年又犯故意杀人罪被判处无期徒刑"},{"k":"D","t":"丁犯叛逃罪被判处2年管制，管制期满后20年又犯为境外刺探国家秘密罪，被判处6个月拘役"}],"answerRef":"A。解析：累犯分为一般累犯与特殊累犯。 A项，根据《刑法》第65条可知，构成累犯必须是有期徒刑被执行完毕或被赦免。《刑法》第76条规定“缓刑考验期满，原判的刑罚就不再执行”，所以，对于缓刑考验期满的犯罪分子来说，其有期徒刑并未执行，当然不存在“执行完毕或者被赦免”的情况，所以缓刑考验期满又犯罪的人，不可能构成累犯。A项当选。 B、C项，乙、丙都属于“被判处有期徒刑以上刑罚的犯罪分子，刑罚执行完毕或者赦免以后，在5年以内再犯应当判处有期徒刑以上刑罚之罪的”情况，故构成累犯。 D项，根据《刑法》第66条，危害国家安全犯罪、恐怖活动犯罪、黑社会性质的组织犯罪的犯罪分子，在刑罚执行完毕或者赦免以后，在任何时候再犯上述任一类罪的，都以累犯论处。丁所犯两罪均为危害国家安全犯罪，故构成累犯。 综上，本题答案为A。","auto":"A","link":"https://weibo.com/1669134634/R7Qj8pdaC"},{"num":13,"day":"2026-07-10","stem":"甲入户窃取官员乙家的财物，在携带财物逃出乙家后被发觉。甲为抗拒抓捕，当场以揭发乙的贪污罪行相威胁，迫使乙放弃追赶。对甲的行为？（单选）","options":[{"k":"A","t":"应当认定为盗窃罪"},{"k":"B","t":"应当认定为普通抢劫"},{"k":"C","t":"应当认定为事后抢劫"},{"k":"D","t":"属于情节加重犯"}],"answerRef":"A。解析：甲以非法占有为目的，入户盗窃，应当认定为盗窃罪。 甲并非基于压制乙的反抗而取得财物，不构成普通抢劫。甲为了抗拒抓捕，虽然当场威胁乙，但并非以暴力相威胁，故不构成转化型抢劫。 提示：普通抢劫的客观行为包括暴力、威胁以及其他方法。而事后抢劫仅包括暴力或者以暴力相威胁，不包括其他方法。 入户盗窃属于特殊盗窃的一种，不属于情节加重犯。","auto":"A","link":"https://weibo.com/1669134634/R7ZxnkjGL"},{"num":14,"day":"2026-07-11","stem":"关于管制、缓刑、与假释，下列选项正确的是？","options":[{"k":"A","t":"缓刑的考验对应执行机关"},{"k":"B","t":"假释的考验对应考察机关"},{"k":"C","t":"管制的执行对应监督机关"},{"k":"D","t":"以上均是错误选项"}],"answerRef":"D。解析：管制对应的为执行机关，缓刑对应的为考察机关，假释对应的是监督机关。","auto":"D","link":"https://weibo.com/1669134634/R895K7hGD"},{"num":15,"day":"2026-07-12","stem":"甲将17周岁的乙骗至地下游戏室。在乙打游戏时，甲致电乙父声称绑架其子，勒索10万元赎金。乙父信以为真，担心儿子受到伤害转账10万元给甲。对甲的行为应当认定为？（单选）","options":[{"k":"A","t":"绑架罪"},{"k":"B","t":"抢劫罪"},{"k":"C","t":"敲诈勒索罪"},{"k":"D","t":"诈骗罪"}],"answerRef":"C。解析：甲虽然声称绑架了乙，事实上并未实施绑架行为，也没打算绑架乙，故不符合绑架罪的犯罪构成，不成立绑架罪，A项错误； 甲并未对乙使用暴力等压制反抗的手段，也并非以当场杀害相威胁向乙父勒索赎金，故不构成抢劫罪，B项错误； 甲以非法占有为目的，谎称绑架乙，向乙父勒索财物，应当认定为敲诈勒索罪，C项正确； 甲虽然对乙父实施欺骗行为，但乙父并非“自愿”处分财物，而是基于恐惧心理被迫处分财物。因此，甲不构成诈骗罪。D项错误。 提示：这点与法考观点不同。 因此，本题答案为C。","auto":"C","link":"https://weibo.com/1669134634/R8io7EbOY"},{"num":16,"day":"2026-07-13","stem":"下列危害公共安全的行为中，应当认定为以危险方法危害公共安全罪的是？（多选）","options":[{"k":"A","t":"甲盗窃人员密集往来的非机动车道上的窨井盖"},{"k":"B","t":"乙夜间使用激光照射高速公路上驾车的司机"},{"k":"C","t":"丙在飞机降落时擅自打开安全门，危及飞行安全"},{"k":"D","t":"丁在闹市区抢夺公交车的方向盘致使公交车失控，造成严重后果"}],"answerRef":"ABCD。解析：根据司法解释, 盗窃人员密集往来的非机动车道上的窨井盖, 应当认定为以危险方法危害公共安全罪； 乙夜间使用激光照射高速公路上驾车的司机, 该行为具有造成重大交通事故的高度危险，危及不特定多数人的生命健康和重大公私财产安全, 应当认定为以危险方法危害公共安全罪； 丙在飞机降落时擅自打开安全门，严重危及公共安全，应当认定为以危险方法危害公共安全罪。注意：该行为不构成破坏交通工具罪。因为安全门在符合条件的情况下是允许打开的，该行为并非对飞机本身的破坏。 丁在闹市区抢夺公交车的方向盘致使公交车失控，造成严重后果，危及不特定多数人的生命健康和重大公私财产安全，应当认定为以危险方法危害公共安全罪。","auto":"ABCD","link":"https://weibo.com/1669134634/R8rOJi0hV"},{"num":17,"day":"2026-07-14","stem":"甲盗窃价值2万元的彩票“刮刮乐”，中奖10万元并兑奖，领取奖金后被抓获。对甲应当如何认定？（单选）","options":[{"k":"A","t":"盗窃罪，数额为12万元"},{"k":"B","t":"盗窃罪，数额为10万元"},{"k":"C","t":"盗窃罪与诈骗罪，数额分别为2万元与10万元"},{"k":"D","t":"诈骗罪，数额为12万元"}],"answerRef":"A。解析：根据司法解释，盗窃不记名、不挂失的有价支付凭证、有价证券、有价票证的，应当按票面数额和盗窃时应得的孳息、奖金或者奖品等可得收益一并计算盗窃数额。因此，对甲应当认定为盗窃罪，数额为12万元。","auto":"A","link":"https://weibo.com/1669134634/R8Bfkmnqg"},{"num":18,"day":"2026-07-15","stem":"关于犯罪既遂，下列说法正确的是？","options":[{"k":"A","t":"自然人犯罪与单位犯罪的既遂标准完全相同"},{"k":"B","t":"在海关监管现场被查获的，构成犯罪既遂"},{"k":"C","t":"为贩卖而购买毒品，购入毒品即构成犯罪既遂"},{"k":"D","t":"组织他人偷越国境，入境后在前往目的地的途中被抓捕，构成犯罪既遂"}],"answerRef":"ABC。解析：A项，我国刑法理论认为，犯罪既遂的标准为构成要件齐备说，而且只有这一个既遂标准。具体到个罪，只有齐备了构成要件才是既遂。例如，虽然盗窃罪与诈骗罪的既遂数额不同，但这只是既遂数额，而非既遂标准。A项正确。 根据司法解释，BC项构成既遂，D项构成未遂。对于此类特殊规定，请大家留意。","auto":"ABC","link":"https://weibo.com/1669134634/R8KFSaJKO"},{"num":19,"day":"2026-07-16","stem":"不考虑数额，关于诈骗罪，下列选项正确的是？","options":[{"k":"A","t":"甲诱骗乙点击植入木马程序的链接，转走其2万元财物，构成诈骗罪"},{"k":"B","t":"乙欺骗他人点击付款链接付款，非法取得其2万元财物，构成诈骗罪"},{"k":"C","t":"丙采用自我交易方式虚构用车订单，获取网约车公司订单补贴，构成诈骗罪"},{"k":"D","t":"丁谎称代他人保管财物，收到财物后据为己有，且拒不退还，构成侵占罪"}],"answerRef":"BC。解析：甲诱骗乙点击植入木马程序的链接，由于乙缺乏处分意识（不知道自己在付款），甲不构成诈骗罪，应当认定为盗窃罪。A项错误。 乙欺骗他人点击付款链接，他人具有处分财物的意识，故乙构成诈骗罪。B项正确。 丙采用自我交易方式虚构用车订单，属于虚构事实欺骗网约车公司，网约车公司基于认识错误处分财物，故丙构成诈骗罪。C项正确。 丁以非法占有为目的，谎称代他人保管财物，对他人实施欺骗行为。被害人基于认识错误处分了财物的占有权，故丁构成诈骗罪。D项错误。","auto":"BC","link":"https://weibo.com/1669134634/R8U62kAJ8"},{"num":20,"day":"2026-07-17","stem":"关于抢劫罪，下列选项正确的是？","options":[{"k":"A","t":"甲持刀拦停公交车后，逼迫乘客下车，对其实施抢劫，属于在公共交通工具上抢劫"},{"k":"B","t":"甲在公交车上扒窃被发觉，乙追赶甲致马路对面时，甲为抗拒抓捕而对乙使用暴力。甲属于在公共交通工具上抢劫"},{"k":"C","t":"甲用绳子捆住乙实施抢劫，劫取财物后未松绑。因地处偏僻，乙被饿死。甲构成抢劫致人死亡的结果加重犯"},{"k":"D","t":"甲在寒冷的冬夜抢劫乙致其重伤，取财后离开。乙因无人救助被冻死，甲构成抢劫致人死亡的结果加重犯"}],"answerRef":"ACD。解析：。 解析： A项，在公共交通工具上抢劫，包括在处于运营状态的公共交通工具上对旅客及司售、 乘务人员实施抢劫，也包括拦截运营途中的公共交通工具对旅客及司售、 乘务人员实施抢劫。A项正确。 提示：在公共交通工具上抢劫的本质是抢劫司乘人员，因此登上车抢劫乘客与将乘客赶下车实施抢劫，都属于在公共交通工具上抢劫。 B项，在公共交通工具上实施盗窃、 诈骗、 抢夺被发现，行为人为窝藏赃物、 抗拒抓捕或者毁灭罪证而当场使用暴力或者以暴力相威胁的，如果暴力或者暴力胁迫行为发生在公共交通工具上，可以认定为 “在公共交通工具上抢劫”。 如果发生在公共交通工具外，则不能认定为 “在公共交通工具上抢劫”。 因此，甲在公交车上扒窃被发觉，乙追赶甲致马路对面时，甲为抗拒抓捕而对乙使用暴力，不属于属于在公共交通工具上抢劫。B项错误。 总结：针“在公共交通工具上抢劫”的规定：普通抢劫看对象，事后抢劫看地点。 C项，分析案件时，既要坚持全面评价，又要禁止重复评价。【马工程】在刑法就某种故意犯罪行为规定了结果加重犯或因发生严重结果而成立重罪时，由于可以将加重结果评价在相应的结果加重犯或者另一重罪中，因此，不要再评价行为人对加重结果的不作为。 甲实施抢劫后并未松绑致使乙被饿死。甲的前行为构成抢劫罪，但是甲不释放乙的行为不需要独立评价为故意杀人。因为： （1）如果前行为（作为）可以包含该结果，则足以全面评价，无需数罪并罚。 例1，甲砍杀乙致其重伤，又不救助乙致其死亡。从表面上看，甲因为先前的砍杀行为对乙负有救助义务，如果不救助，可能构成不作为犯罪。但是，甲的前行为（砍杀）已经可以包含死亡结果，因此对后续不救助的行为不需要独立认定，就可以做到全面评价。对甲应当认定为作为形式的故意杀人罪既遂。 例2、甲酒后驾驶致使乙重伤，又肇事逃逸，不救助乙致其死亡。甲因先前的肇事行为对乙负有救助义务，如果不救助可能构成不作为犯罪。但是，立法上已经规定了“逃逸致人死亡”。因此对后续不救助的行为不需要独立认定，就可以做到全面评价。对甲应当认定为交通肇事罪的加重犯，即逃逸致人死亡，而无需以交通肇事罪与不作为犯罪并罚。 （2）如果前行为（作为）不能包含该结果，则应数罪并罚，否则不足以全面评价。 例如，甲盗伐林木，不慎砸中巡逻员乙。甲明知地处偏僻，但放任乙死亡。甲因为先前的盗伐林木的行为对乙负有救助义务，如果不救助，可能构成不作为犯罪。由于盗伐林木的行为不能包含死亡结果，故应当分别评价。也即，前行为构成盗伐林木罪，后行为构成不作为的故意杀人罪，应当并罚。 提示：不作为也是危害行为。甲不履行救助义务本身就是危害行为，因此先后实施了两个行为，而非一行为，且不作为行为需要独立评价。 C项中，甲用绳子捆住乙实施抢劫，劫取财物后未松绑。因地处偏僻，乙被饿死。由于前行为（抢劫）可以包含死亡结果，故甲构成抢劫致人死亡的结果加重犯，不再认定为不作为的故意杀人罪。而且，甲没有松绑，意味着抢劫中压制反抗的状态一直持续，且与死亡结果具有因果关系。C项正确。 D项，甲在寒冷的冬夜抢劫乙致其重伤，取财后离开。乙因无人救助被冻死，甲构成抢劫致人死亡的结果加重犯。D项正确，理由同上。","auto":"ACD","link":"https://weibo.com/1669134634/R93wFu7JK"},{"num":21,"day":"2026-07-18","stem":"李某遭甲强奸后逃离时滑落河中。甲看到李某在水中挣扎，仍离开现场，李某溺水身亡。甲的行为应认定为？（本题来自真题）","options":[{"k":"A","t":"强奸罪"},{"k":"B","t":"故意杀人罪"},{"k":"C","t":"强奸罪和故意杀人罪"},{"k":"D","t":"强奸罪和过失致人死亡罪"}],"answerRef":"A。解析：甲强奸李某后，李某在逃跑时不慎落水，甲对李某未救助致其死亡。对甲应当认定为强奸罪一罪，属于强奸造成其他严重后果。理由： 1、从救助义务的角度看，李某落水是发生在强奸行为以后，而不是强奸过程中。由此，需要值得注意的是：【考试分析的表述】行为人的先前行为具有发生某种危害结果的危险，行为人负有防止其发生的义务。也即，先前行为有造成何种结果发生的危险，就有义务防止何种结果发生。 如果甲在追赶李某，李某不慎落水，则甲对李某负有救助义务，甲有能力而故意不履行救助义务，致使李某死亡结果发的，应当以强奸罪与不作为的故意杀人罪并罚。 本案中，甲的强奸行为已经结束，强奸行为本身的危险随着强奸行为的结束而消除。因此，甲对李某没有救助义务。试想若认为甲在强奸李某后，仍然对李某负有救助义务，该义务何时才结束？如果认为甲对李某负有救助义务，会出现以下问题： （1）如果李某当场自杀，甲有无阻止其自杀的义务？ （2）如果李某三天后自杀，甲有无前往李某家救助的义务？ （3）为防止意外，甲有无将李某送回家的义务？ 2、从全面评价的角度看，立法上规定了“强奸致使被害人重伤、死亡或者其他严重后果”。既然“严重后果”与“重伤、死亡”是并列关系，故应当将强奸致使被害人重伤、死亡限定为强奸行为直接造成重伤、死亡。 由此，如果不是由强奸行为直接造成死亡结果，而是由介入因素造成死亡等结果，则应当认定为“强奸造成其他严重后果”，如强奸后，被害人自杀等。 既然被害人自杀都可以认定为强奸造成其他严重后果，那么李某在逃跑时落水溺亡，更可以评价为强奸造成其他严重后果。因为在以下情形中： 情形1：强奸→被害人自杀；情形2：强奸→被害人逃跑落水溺死。 可以看出，被害人逃跑溺死与强奸行为的关系更紧密。既然强奸行为导致被害人自杀，都可以评价为强奸造成“严重后果”。那么，关系更加紧密的“逃跑溺死”更可以评价为强奸造成“严重后果”。 最后，强奸造成其他严重后果的法定刑为10以上有期徒刑、无期徒刑或者死刑。对甲认定为强奸罪一罪，也完全符合罪责刑相适应原则。","auto":"A","link":"https://weibo.com/1669134634/R9cXh6Q58"},{"num":22,"day":"2026-07-19","stem":"下列选项中，属于派生的犯罪构成是？","options":[{"k":"A","t":"多次盗窃"},{"k":"B","t":"多次抢夺"},{"k":"C","t":"多次抢劫"},{"k":"D","t":"多次敲诈勒索"}],"answerRef":"C。解析：多次抢劫属于抢劫罪的情节加重犯，属于派生的犯罪构成中的加重的犯罪构成；另外三项均是盗窃罪、抢夺罪、敲诈勒索罪的成立情形之一，并不具有较重或者较轻的法益侵害程度，故属于标准的犯罪构成（普通的犯罪构成）。","auto":"C","link":"https://weibo.com/1669134634/R9mnYmldt"},{"num":23,"day":"2026-07-20","stem":"关于虐待罪与虐待被监护、看护人罪，下列选项正确的是？（多选）","options":[{"k":"A","t":"甲故意不为年迈的母亲治病，构成虐待罪"},{"k":"B","t":"甲经常酒后无端虐待妻子乙，致其重伤，构成虐待罪"},{"k":"C","t":"甲经常对瘫痪在床的妻子乙辱骂，致其自杀身亡。甲构成虐待罪的结果加重犯"},{"k":"D","t":"幼儿园（具备法人资格）虐待儿童，构成虐待被看护人罪，属于单位犯罪"}],"answerRef":"BCD。解析：虐待罪，是指虐待家庭成员，情节恶劣的行为；虐待被监护、看护人罪，是指对未成年人、老年人、患病的人、残疾人等负有监护、看护职责的人虐待被监护、看护的人，情节恶劣的行为。 A项，甲故意不为年迈的母亲治病，属于不履行抚养义务，应当认定为遗弃罪。因为单纯的不作为只能构成遗弃罪，虐待罪的行为方式具有作为的内容。也即，作为或者作为+不作为。A项错误。 B项，甲经常酒后无端虐待妻子乙，致其重伤，构成虐待致人重伤的结果加重犯。B项正确。 C项，虐待致人重伤、死亡的，构成虐待罪的结果加重犯。这里的致人“重伤、死亡”包括被害人自杀、自残。甲经常对瘫痪在床的妻子乙辱骂，致其自杀身亡，构成虐待致人死亡的结果加重犯。C项正确。 D项，根据《刑法》规定，虐待被看护人罪的犯罪主体是特殊主体，包括对未成年人、老年人、患病的人、残疾人等负有监护、看护职责的自然人和单位。D项正确。 综上，本题的正确答案是BCD。","auto":"BCD","link":"https://weibo.com/1669134634/R9wKRdldo"},{"num":24,"day":"2026-07-21","stem":"不考虑数额，下列哪些行为应以职务侵占罪论处？（多选）","options":[{"k":"A","t":"村民小组组长甲利用职务上的便利，将村民小组集体财产非法据为己有"},{"k":"B","t":"村委会主任乙利用协助镇政府发放救灾款物的便利，将救灾款非法据为己有"},{"k":"C","t":"国有控股公司部门经理丙利用职务上的便利，将本单位的5万元公款非法据为己有"},{"k":"D","t":"丁与私营企业的主管王某勾结，利用其职务上的便利，将该单位资金非法据为己有"}],"answerRef":"ACD。解析：职务侵占罪，是指公司、企业或者其他单位的人员，利用职务上的便利，将本单位财物非法占有，数额较大的行为。 A项，最高人民法院《关于村民小组组长利用职务便利非法占有公共财物行为如何定性问题的批复》指出：“对村民小组组长利用职务上的便利，将村民小组集体财产非法占为己有，数额较大的行为，应当以职务侵占罪定罪处罚。”A项正确。 B项，根据立法解释，村民委员会等基层组织人员协助人民政府从事行政管理工作时，属于“其他依照法律从事公务的人员”。乙利用协助镇政府发放救灾款物的便利，将救灾款非法据为己有，属于协助人民政府从事行政管理工作，应当认定为贪污罪。B项错误。 C项，在国有公司中从事公务的人员属于国家工作人员，这里的“国有公司”是指纯国有，而不包括国有控股公司。由于题干并未表明丙属于受委派从事公务的人员，故丙不具有国家工作人员的身份，故对丙应当认定为职务侵占罪。C项正确。 D项，王某作为私营企业的主管，利用其职务上的便利，将该单位资金非法据为己有，其行为构成职务侵占罪。丁与王某相勾结，构成职务侵占罪的共犯。D项正确。 综上，本题的正确答案是ACD。","auto":"ACD","link":"https://weibo.com/1669134634/R9FeQEVa0"},{"num":25,"day":"2026-07-22","stem":"甲为承揽工程，欲送给官员乙一张存有10万元现金的银行卡，并谎称卡内只有5000元。乙使用该卡时发现卡内有10万元，因担心被追究责任，便主动将该卡上交给纪委。关于本案，下列选项错误的是？","options":[{"k":"A","t":"甲构成行贿罪既遂"},{"k":"B","t":"乙不构成受贿罪"},{"k":"C","t":"甲的行贿数额为10万元"},{"k":"D","t":"应当将10万元返还给甲"}],"answerRef":"D。解析：行贿罪，是指为谋取不正当利益，给予国家工作人员以财物的行为。 A项，甲为谋取不当利益，给予官员乙10万元现金，应当认定为行贿罪。由于甲已经将贿赂送出，故构成行贿罪既遂。A项正确。 B项，根据司法解释，除特定情形外，受贿罪的立案数额为3万元。本案中，乙误以为卡内只有5000元，且在发现真相后主动上交贿赂款，故主观上没有收受数额较大财物的故意，不构成受贿罪。B项正确。 C项，主观上甲具有行贿10万元的故意，客观上甲也将10万元财物交付给乙，故行贿数额为10万元。C项正确。 D项，银行卡内的10万元属于贿赂款，即犯罪的组成之物，应当予以没收并上交国库，而不是返还给甲。D项错误。 综上，本题的正确答案是：D。","auto":"D","link":"https://weibo.com/1669134634/R9OIT5dYh"},{"num":26,"day":"2026-07-23","stem":"甲伪造身份证骗领了 5 张信用卡，用其在网上银行套取 10 万元，用于个人消费后将卡销毁，甲的行为应认定为？","options":[{"k":"A","t":"盗窃罪"},{"k":"B","t":"信用卡诈骗罪"},{"k":"C","t":"伪造身份证件罪"},{"k":"D","t":"妨害信用卡管理罪"}],"answerRef":"B。解析：甲的行为分别构成伪造身份证件罪、使用虚假身份证件罪、妨害信用卡管理罪，但以上犯罪行为都是信用卡诈骗罪的手段行为，应当认定为牵连犯，择一重罪处罚，认定为信用卡诈骗罪。 提示：盗窃信用卡并使用的应当认定为盗窃罪，甲并非盗窃信用卡并使用，故不应当认定为盗窃罪。","auto":"B","link":"https://weibo.com/1669134634/R9Y7CiqVn"},{"num":27,"day":"2026-07-24","stem":"医药代表甲为了给予医生乙回扣，需计算乙开处方时的用药量。甲找到公立医院负责统计医生处方的工作人员丙，给予其数额较大的财物，以获取医生的处方用药量，并据此给予乙数额较大的回扣。关于本案：","options":[{"k":"A","t":"乙构成受贿罪"},{"k":"B","t":"丙构成非国家工作人员受贿罪"},{"k":"C","t":"丙构成受贿罪"},{"k":"D","t":"甲仅构成对非国家工作人员行贿罪"}],"answerRef":"C。解析：医生乙利用开处方的便利为医药代表谋取利益，构成非国家工作人员受贿罪。甲对其行贿，构成对非国家工作人员行贿罪。 丙是公立医院负责药方统计的工作人员，属于国家工作人员，故丙构成受贿罪。甲对其行贿，构成行贿罪。 对甲应当实行数罪并罚。 提示：国家工作人员的认定关键看：其职务行为有无行政职责（管理）性，或者是否管理国有财产。本案中，丙负责统方，属于行使国有单位赋予的管理权，故属于国家工作人员。 总结：医生非法收受他人财物，利用开处方的便利（处方权）为他人谋利，构成非国家工作人员受贿罪。利用公立医院的统方权为他人谋利，构成受贿罪。","auto":"C","link":"https://weibo.com/1669134634/Ra7wP3HJv"},{"num":28,"day":"2026-07-25","stem":"下列哪些选项属于“挪用公款归个人使用”？（多选）","options":[{"k":"A","t":"以个人名义将公款借给某国有企业使用"},{"k":"B","t":"以个人名义将公款借给某私营企业使用"},{"k":"C","t":"个人决定以单位名义将公款借给其他单位使用，谋取个人利益的"},{"k":"D","t":"以个人名义将公款借给其他单位使用，未谋取个人利益的"}],"answerRef":"ABCD。解析：根据《全国人大常委会关于刑法第三百八十四条第一款的解释》规定，有下列情形之一的，属于挪用公款“归个人使用”： （1）将公款供本人、亲友或者其他自然人使用的； （2）以个人名义将公款供其他单位使用的； （3）个人决定以单位名义将公款供其他单位使用，谋取个人利益的。 综上，本题的正确答案是ABCD。","auto":"ABCD","link":"https://weibo.com/1669134634/RakBRx0QL"},{"num":29,"day":"2026-07-26","stem":"建筑公司负责人甲为催讨某国有企业的100万元建筑欠款，送给公安局副局长乙10万元，请其帮忙协调。乙遂向该国有单位负责人丙打招呼，谎称甲是自己的亲友，请其按照合同约定及时支付所欠款项。丙很快将所欠款项结清。关于本案，下列说法正确的是？（单选）","options":[{"k":"A","t":"甲构成行贿罪"},{"k":"B","t":"甲构成单位行贿罪"},{"k":"C","t":"乙构成受贿罪"},{"k":"D","t":"甲、乙均不构成犯罪"}],"answerRef":"D。解析：甲主观上不具有谋取不正当利益的目的，不构成行贿罪或者单位行贿罪。A、B项错误；成立斡旋型受贿罪，要求为他人谋取不正当利益，故乙不构成受贿罪。C项错误、D项当选。 对乙收受的10万元财物，只能按照党纪或公务员法的规定处理。","auto":"D","link":"https://weibo.com/1669134634/Raqn4n5uu"},{"num":30,"day":"2026-07-27","stem":"关于卖淫领域的相关犯罪，下列说法正确的是？（多选）","options":[{"k":"A","t":"组织卖淫者是否设置固定的卖淫场所、组织卖淫者人数多少、规模大小，不影响组织卖淫行为的认定"},{"k":"B","t":"传播性病行为是否实际造成他人患上严重性病的后果，不影响传播性病罪的成立"},{"k":"C","t":"明知自己患有艾滋病而卖淫、嫖娼的，构成传播性病罪，从重处罚。如果将艾滋病传播给对方，构成故意伤害罪（重伤）"},{"k":"D","t":"收买被拐卖的妇女后又强迫其卖淫构成其他犯罪的，应当数罪并罚"}],"answerRef":"ABCD。解析：A项，根据司法解释，卖淫人员在3人以上的，组织者构成组织卖淫罪。注意：组织卖淫者（老板）是一人还是多人、有无固定的卖淫场所，不影响本罪的成立。A项正确。 B项，传播性病罪属于行为犯，是否实际造成他人患上严重性病的后果，不影响传播性病罪的成立。B项正确。 C项，根据司法解释，明知自己患有艾滋病或者感染艾滋病病毒而卖淫、嫖娼的，以传播性病罪定罪，从重处罚。明知自己感染艾滋病病毒而卖淫、嫖娼，致使他人感染艾滋病病毒的，应当认定为故意伤害罪致人重伤。C项正确。 D项，收买被拐卖的妇女、儿童后，又对妇女、儿童实施其他犯罪行为（卖出除外）的，应数罪并罚。D项正确。 【提示】先收买被拐卖的妇女、儿童，又将其出卖的，只定拐卖妇女、儿童罪一罪。 综上，本题的正确答案是ABCD。","auto":"ABCD","link":"https://weibo.com/1669134634/RazOeA6wn"},{"num":31,"day":"2026-07-28","stem":"甲是某图书馆馆长（全额拨款的国有事业单位），乙是该馆副馆长。甲、乙等人集体讨论决定：在书籍采购过程中，以单位名义账外暗中收受回扣的方式，收受书商丙所送人民币50万元，用于发放工作人员福利及支付本单位其他开支。关于本案：","options":[{"k":"A","t":"甲、乙不构成贪污罪"},{"k":"B","t":"甲、乙构成受贿罪"},{"k":"C","t":"丙构成行贿罪"},{"k":"D","t":"应当对该图书馆判处罚金刑"}],"answerRef":"AD。解析：甲、乙等人集体讨论决定，收受书商丙所送人民币50万元，用于发放工作人员福利及支付本单位其他开支。这说明甲、乙主观上并没有非法占有目的，因此不构成贪污罪； 甲、乙主观上为了单位利益实而收受书商的财物，而且受贿行为也是以单位的名义实施的，故不构成受贿罪；该图书馆构成单位受贿罪，书商构成对单位行贿罪。 行贿罪是指为了谋取不正当利益，给予国家工作人员以财物，书商丙是给予国有单位而非给予特定国家工作人员以财物，因此不构成行贿罪，而是构成对单位行贿罪。 由于图书馆构成单位犯罪，故应当对该图书馆判处罚金刑。","auto":"AD","link":"https://weibo.com/1669134634/RaJgaFmcU"},{"num":33,"day":"2026-07-30","stem":"关于侵犯财产罪，下列选项错误的是？（单选）","options":[{"k":"A","t":"甲偷开朋友的摩托车，导致车辆丢失，不构成盗窃罪"},{"k":"B","t":"乙在盗窃电力设备过程中，为抗拒抓捕当场使用暴力，可以转化为抢劫罪"},{"k":"C","t":"丙为实施抢劫而偷开他人机动车，并将机动车遗弃导致丢失的，应当以抢劫罪与盗窃罪并罚"},{"k":"D","t":"丁基于报仇杀死他人后，又临时起意取走其身上的财物，应当认定以故意杀人罪与盗窃罪并罚"}],"answerRef":"A。解析：根据司法解释，偷开他人的机动车，导致车辆丢失的，以盗窃罪定罪处罚。 A项错误； 由于盗窃电力设备罪是盗窃罪的特别法条，因此在盗窃电力设备过程中为抗拒抓捕当场使用暴力，可以转化为抢劫罪。B项正确； 根据司法解释，为实施其他犯罪，偷开机动车作为犯罪工具使用后非法占有车辆，或者将车辆遗弃导致丢失的，以盗窃罪和其他犯罪数罪并罚，将车辆送回未造成丢失的，按照其所实施的其他犯罪从重处罚。C项正确； 根据司法解释，基于其他目的杀害被害人后，又临时起意取走其财物的，以故意杀人罪与盗窃罪实行并罚。D项正确。","auto":"A","link":"https://weibo.com/1669134634/Rb26482Ae"},{"num":34,"day":"2026-07-31","stem":"甲盗窃后逃跑，乙抓捕甲。甲为抗拒抓捕，当场持枪威胁乙，但是不小心触动扳机致使乙死亡。关于本案，下列选项正确的是？（多选）","options":[{"k":"A","t":"对甲应当认定为抢劫罪"},{"k":"B","t":"如果A项正确，则甲构成抢劫致人死亡"},{"k":"C","t":"即使A项正确，甲也不构成结果加重犯"},{"k":"D","t":"对甲应当数罪并罚"}],"answerRef":"AB。解析：甲犯盗窃罪，为抗拒抓捕当场持枪威胁乙，其行为转化为抢劫罪。虽然甲对乙的死亡无故意，但存在过失，且甲的抢劫行为与死亡结果有因果关系。因此，对甲应当认定为抢劫致人死亡的结果加重犯。因此，A、B项正确，C、D项错误。 提示：转化抢劫的客观行为包括：一，当场使用暴力；二，当场以暴力相威胁。本案中，甲属于当场以暴力相威胁，且该行为与乙的死亡具有因果关系。因此，甲构成抢劫致人死亡的结果加重犯。","auto":"AB","link":"https://weibo.com/1669134634/RbbwCuuRa"},{"num":35,"day":"2026-08-01","stem":"下列选项中犯罪主体包括单位的是？（多选）","options":[{"k":"A","t":"集资诈骗罪"},{"k":"B","t":"保险诈骗罪"},{"k":"C","t":"非法经营罪"},{"k":"D","t":"组织、领导传销活动罪"}],"answerRef":"ABCD。解析：单位犯罪必须由刑法明文规定，如果法律未规定某罪的主体包括单位，则该最只能由自然人构成。 根据刑法规定，单位可构成集资诈骗罪、保险诈骗罪、非法经营罪。 至于组织、领导传销活动罪，单位也可以构成。因为组织、领导传销活动罪对应是第224条之一，而《刑法》第231条规定，单位犯本节第221条至第230条规定之罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照本节各该条的规定处罚。 由此，单位也可以构成组织、领导传销活动罪。也即，单位可能属于组织者或者领导者。","auto":"ABCD","link":"https://weibo.com/1669134634/RbkWShmM8"},{"num":36,"day":"2026-08-02","stem":"关于刑法中的因果关系，下列说法正确的是？","options":[{"k":"A","t":"预备行为和实行行为均会产生刑法上的因果关系"},{"k":"B","t":"结果加重犯的成立要求基本行为与加重结果之间存在因果关系"},{"k":"C","t":"因果关系中的危害结果既包括实害结果，也包括危险结果"},{"k":"D","t":"甲故意不救助自己溺水的孩子致其溺亡，由于没有实行行为，所以不能认定甲和死亡结果存在因果关系"}],"answerRef":"B。解析：预备行为不会直接造成实害结果，只有实行行为才可能直接造成实害结果。因此，只有实行行为才会产生刑法上的因果关系。如果缺乏实行行为，即使偶然导致结果也没有刑法上的因果关系。选项A不当选。 基本犯罪构成的行为与加重结果之间必须具有因果关系，否则不成立结果加重犯。结果加重犯的成立要求基本行为与加重结果之间存在因果关系。选项B当选。 因果关系中的危害结果是实害结果，不包括危险结果。选项C不当选。 甲故意不救助自己溺水的孩子属于不作为，该不作为与死亡结果之间具有因果关系。选项D不当选。 综上，本题正确答案是B。","auto":"B","link":"https://weibo.com/1669134634/RbumMuTlv"},{"num":37,"day":"2026-08-03","stem":"关于缓刑，下列选项错误的是？（单选）","options":[{"k":"A","t":"对于累犯不适用缓刑"},{"k":"B","t":"对于危害国家安全的犯罪分子，不适用缓刑"},{"k":"C","t":"对于数罪并罚但宣告刑为3年以下有期徒刑的犯罪分子，可以适用缓刑"},{"k":"D","t":"虽然故意杀人罪的法定最低刑为3年以上有期徒刑,但只要符合缓刑条件，仍然可以适用缓刑"}],"answerRef":"B。解析：缓刑适用的对象为被判处拘役或者3年以下有期徒刑的犯罪分子，与所犯之罪的性质无关。因此，对于危害国家安全的犯罪分子，如果符合缓刑条件，完全可能适用缓刑。因此，B项错误。 根据刑法规定，对累犯与犯罪集团的首要分子，不得适用缓刑。A项正确。 对于被判处3年以下有期徒刑的犯罪分子可以适用缓刑，包括被判处3年整。因此，CD正确。","auto":"B","link":"https://weibo.com/1669134634/RbDMUj3pH"},{"num":38,"day":"2026-08-04","stem":"甲伪造房主的户口本、身份证，冒充房主的身份，与乙签订房屋买卖合同，约定购房款为200万元，并当场收取定金5万元，并约定余款过户后给付。后双方在办理房产过户手续时，甲的虚假身份被工作人员发现，余款未取得。关于甲的行为，下列选项错误的是？（单选）","options":[{"k":"A","t":"甲构成伪造身份证件罪"},{"k":"B","t":"甲构成合同诈骗罪"},{"k":"C","t":"对甲应当实行数罪并罚"},{"k":"D","t":"甲的诈骗行为，既有既遂又有未遂，应当依照处罚较重的规定处罚"}],"answerRef":"C。解析：甲伪造房主的户口本、身份证，冒充房主的身份，与乙签订房屋买卖合同，分别构成伪造身份证件罪与合同诈骗罪，属于牵连犯，应当择一重罪处罚；根据司法解释，甲的诈骗行为既有既遂(5万元)，又有未遂(195万元)，应当依照处罚较重的规定处罚。","auto":"C","link":"https://weibo.com/1669134634/RbNew02Ts"},{"num":39,"day":"2026-08-05","stem":"下列选项应当认定为生产、销售有毒、有害食品罪的是：（单选）","options":[{"k":"A","t":"甲以销售给他人养殖为目的，非法生产、销售盐酸克伦特罗（瘦肉精）"},{"k":"B","t":"乙销售给养殖户含有瘦肉精的饲料以及动物饮用水"},{"k":"C","t":"丙购买含有瘦肉精的饲料养猪出售"},{"k":"D","t":"丁在男性保健食品中添加过量的食品添加剂"}],"answerRef":"C。解析：生产、销售有毒、有害食品罪的本质是：在食品中“掺入+禁用”物质。根据司法解释，A、B项构成非法经营罪；C项构成生产、销售有毒、有害食品罪；D项构成生产、销售不符合安全标准的食品罪。","auto":"C","link":"https://weibo.com/1669134634/RbWHYy71h"},{"num":40,"day":"2026-08-06","stem":"下列选项属于过失犯罪的是？（多选）","options":[{"k":"A","t":"甲意图烧死在办公室值班的乙，但事后发现，被烧死的是顶替乙值班的丙"},{"k":"B","t":"甲在酷热的夏天逛超市时，将婴儿放在车内，半小时后发现婴儿死亡"},{"k":"C","t":"甲和好友乙开玩笑，故意将乙从五楼推下，乙被摔成重伤"},{"k":"D","t":"货车司机甲马虎装货，导致货物脱落砸中后车，导致后车发生事故，造成后车司机死亡"}],"answerRef":"BD。解析：A项，甲意图烧死在办公室值班的乙，主观上具有杀人故意，虽事后发现被烧死的是顶替乙值班的丙，但这种对象错误不影响故意犯罪的成立。即，根据法定符合说，性质相同，一视同仁。因此，对甲应当认定为故意杀人罪。 B项，甲应当预见在酷热的夏天将婴儿放在车内，有可能会发生严重后果，但因为疏忽大意而没有预见，应当认定为过失致人死亡罪。从题干表述看，无法得知行为人主观上对死亡结果是间接故意。 C项，甲和好友乙开玩笑，故意将乙从五楼推下，乙被摔成重伤。本题中，甲是故意将乙从五楼推下，该行为具有明显的加害性，根据构成要件行为的类型化原理，应当认定为故意犯罪，至少为间接故意形式的故意伤害罪。 D项，货车司机甲马虎装货，应当预见该行为可能造成严重后果。甲违反交通运输管理法规的行为，导致货物脱落砸中后车，并致使后车司机死亡 ，应当认定为交通肇事罪。","auto":"BD","link":"https://weibo.com/1669134634/Rc643yf7v"},{"num":41,"day":"2026-08-07","stem":"乙在自家附近的偏僻路口伺机抢夺，在甲经过时将其背包夺走。回家后乙发现包内竟是自己的财物，原来是甲当晚潜入乙家盗窃所得（数额巨大）。关于本案下列选项正确的是？（多选）","options":[{"k":"A","t":"甲构成盗窃罪既遂"},{"k":"B","t":"乙的行为成立正当防卫"},{"k":"C","t":"乙未侵犯他人财产权，不构成犯罪"},{"k":"D","t":"乙构成抢夺罪未遂"}],"answerRef":"AD。解析：甲入户盗窃，已经取得财物，构成盗窃罪既遂。A项正确； 针对正当防卫，在财产犯罪的场合，只有当场能够挽回损失的，才能认为不法侵害正在进行。本题中甲的盗窃行为已经既遂，且乙并未在盗窃现场发现甲，故不符合正当防卫的时间条件，不成立正当防卫。B项错误。 乙主观上具有抢夺他人财物的故意，客观上实施了抢夺他人财物的行为，完全有可能侵害第三人的财产权，只是由于偶然的原因夺回了自己的财物。因此，应当认定为抢夺罪。由于并未实际侵害他人的财产，故乙构成抢夺罪未遂。C项错误，D项正确。","auto":"AD","link":"https://weibo.com/1669134634/Rcfvc2jWn"},{"num":42,"day":"2026-08-08","stem":"甲闯红灯将丙撞成重伤，乘车人乙指使甲逃逸。甲为了逃避法律追究而逃离事故现场，事故发生两分钟后，丙被路人发现并送医抢救，但因颅内受伤严重，在送医一天后死亡。关于本案，下列说法正确的是？（单选）","options":[{"k":"A","t":"甲构成交通肇事逃逸致人死亡"},{"k":"B","t":"乙构成交通肇事罪的共犯"},{"k":"C","t":"甲构成交通肇事，属于“交通肇事后逃逸”"},{"k":"D","t":"乙构成交通肇事逃逸致人死亡"}],"answerRef":"C。解析：甲闯红灯的行为违反了交通运输管理法规，致使一人死亡，构成交通肇事罪。甲在交通肇事后具有逃逸情节，故属于“交通肇事后逃逸”。C项正确。 提示：即使去掉逃逸情节，甲依然构成交通肇事罪。再将逃逸情节考虑进去，就具备了交通肇事后逃逸的情节。 逃逸致人死亡是指逃逸行为致使被害人得不到救助而死亡，本案中丙在事故发生后两分钟即被他人救助，并非得不到救助而死亡。因此AD项错误。 根据司法解释，单位主管人员、机动车辆的所有人、承包人以及乘车人，在交通事故发生后，指使肇事人逃逸，致使被害人得不到救助而死亡的，应当认定为交通肇事罪的共犯。但本项特殊规定的结构为：“先事故+后逃逸，且被害人因得不到救助而死亡。”因此，乙的行为不符合本项司法解释规定，不构成交通肇事罪的共犯，而应当认定为无罪。B项错误。","auto":"C","link":"https://weibo.com/1669134634/RcoVkpGjD"},{"num":43,"day":"2026-08-09","stem":"下列选项构成抢劫罪的是?(多选)","options":[{"k":"A","t":"甲驾驶摩托车夺走他人背包，致人摔倒造成轻伤"},{"k":"B","t":"乙驾驶摩托车抢夺他人背包，因被害人不放手而采取强拉硬拽方法取走财物"},{"k":"C","t":"丙驾驶摩托车抢夺他人背包，明知会致人伤亡仍然强行夺取，致人摔倒造成重伤"},{"k":"D","t":"丁驾驶摩托车抢夺他人背包，致使他人摔倒造成重伤"}],"answerRef":"BC。解析：飞车抢夺行为，原则上构成抢夺罪。但如果飞车抢夺行为达到了压制被害人反抗的程度，主观上行为人也具有压制被害人反抗的故意，并以此取得被害人的财物的，就符合了抢劫罪的犯罪构成，应当认定为抢劫罪。 根据司法解释，以下情形应当认定为抢劫罪： 1、驾驶车辆逼挤、撞击或强行逼倒他人以排除他人反抗，乘机夺取财物的。 2、驾驶车辆强抢财物时，因被害人不放手而采取强拉硬拽方法强行夺取的。 3、行为人明知其驾驶车辆强行夺取他人财物的手段会造成他人伤亡的后果，仍然强行夺取并放任造成财物持有人轻伤以上后果的。 上述司法解释的3点内容具有的共性是：行为人主观上具有抢劫即压制被害人反抗的故意，客观上实施了压制被害人反抗的行为，因此应当认定为抢劫罪。 A项，甲驾驶摩托车夺走他人背包，致人摔倒造成轻伤，应当认定为抢夺罪。因为题干信息无法表明甲主观上具有压制被害人反抗的故意。A项不当选。 B项，因被害人不放手，乙采用驾驶机动车强拉硬拽的方法取得对方财物。主观上具有压制被害人反抗的故意，客观上也实施了压制被害人反抗的行为，应当认定为抢劫罪。B项当选。 C项，丙驾驶摩托车抢夺他人背包，明知会致人伤亡仍然强行夺取，表明其主观上具有压制被害人反抗的故意，客观上致人摔倒造成重伤，也实施了压制被害人反抗的行为，应当认定为抢劫罪致人重伤的结果加重犯。C项当选。 D项，丁驾驶摩托车抢夺他人背包，致使他人摔倒造成重伤，由于题干信息无法表明丁主观上具有压制被害人反抗的故意，故丁不构成抢劫罪。丁的抢夺行为过失致人重伤，应当认定为抢夺罪规定的情节严重，适用加重的法定刑。D项不当选。","auto":"BC","link":"https://weibo.com/1669134634/Rcymk0Imt"},{"num":44,"day":"2026-08-10","stem":"关于追诉时效，下列选项正确的是?(多选)","options":[{"k":"A","t":"如果法定最高刑为有期徒刑，经过 15 年后认为必须追诉的，报请最高人民检察院核准，可以追诉"},{"k":"B","t":"司法机关立案侦查后，如果行为人没有逃避侦查的，仍然受追诉时效的限制"},{"k":"C","t":"被害人在追诉期限内提出的控告，司法机关应当立案而没有立案的，不受追诉时效的限制"},{"k":"D","t":"滥用职权罪的追诉时效应从实害结果发生之日而非滥用职权之日起计算"}],"answerRef":"BCD。解析：最高人民检察院只能核准法定最高刑为无期徒刑或者死刑的20年时效，如果法定最高刑为有期徒刑，经过 15 年后不得再追诉。A项错误。 B项，在人民检察院、公安机关、国家安全机关立案侦查或者在人民法院受理案件以后，逃避侦查或者审判的，不受追诉期限的限制。也即，介入+逃避。如果行为人没有逃避侦查的，仍然受追诉时效的限制。因此，B项正确。 C项，根据刑法规定，被害人在追诉期限内提出控告，人民法院、人民检察院、公安机关应当立案而不予立案的，不受追诉期限的限制。C项正确。 D项，追诉期限从犯罪之日起计算，即从犯罪成立之日起计算。滥用职权罪属于结果犯，要求国家机关工作人员滥用职权，致使公共财产、国家和人民利益遭受重大损失。因此，应从实害结果发生之日而非滥用职权之日起计算其追诉时效。D项正确。","auto":"BCD","link":"https://weibo.com/1669134634/RcHNzwIH3"},{"num":45,"day":"2026-08-11","stem":"关于妨害司法罪，下列说法正确的是?(多选)","options":[{"k":"A","t":"甲教唆证人乙在刑事诉讼中作虚假证明，构成伪证罪的教唆犯"},{"k":"B","t":"乙将同案犯藏于家中，构成窝藏罪"},{"k":"C","t":"在刑事诉讼中，证人丙前后两次出具的证言之间内容相反，丙成立伪证罪"},{"k":"D","t":"在刑事诉讼中，鉴定人丁故意将轻微伤鉴定为重伤的，成立伪证罪"}],"answerRef":"CD。解析：伪证无教唆，其教唆行为已经被规定为妨害作证罪的实行行为。因此，甲教唆证人乙在刑事诉讼中作虚假证明，应当认定为妨害作证罪。A项错误。 乙将同案犯藏于家中，因缺乏期待可能性，不构成窝藏罪。B项错误。 伪证罪，是指在刑事诉讼中，证人、鉴定人、记录人、翻译人对与案件有重要关系的情节，故意作虚假证明、鉴定、记录、翻译，意图陷害他人或者隐匿罪证的行为。 在刑事诉讼中，证人丙前后两次出具的证言之间内容相反，这说明其中必有一次为虚假证言。伪证罪是行为犯，只要行为实施完毕就构成犯罪既遂。因此，对丙应当认定为伪证罪。C项正确。 在刑事诉讼中，鉴定人丁故意将轻微伤鉴定为重伤的，属于对与案件有重要关系的情节，故意作虚鉴定，应当认定为伪证罪。D项正确。","auto":"CD","link":"https://weibo.com/1669134634/RcRd94nyO"},{"num":46,"day":"2026-08-12","stem":"甲从王某处借得一辆价值10万元的竞赛用自行车，因急需用钱，甲将该车质押给典当行，得款6万元。 在王某索要时，甲无力赎回该车，又向李某借得一辆价值15万元的竞赛用自行车，将该车质押给同一典当行，得款10万元后赎回王某的自行车。 甲将自行车交还给王某后潜逃，导致李某的自行车期满未赎。甲诈骗的金额为（单选）","options":[{"k":"A","t":"6万元"},{"k":"B","t":"10万元"},{"k":"C","t":"15万元"},{"k":"D","t":"25万元"}],"answerRef":"C。解析：第一板块，就甲质押王某的自行车而言： 甲从王某处借得一辆价值10万元的竞赛用自行车，后将该车质押给典当行，该行为尚不足以证明甲主观上具有非法占有目的。甲将自行车交还给王某，王某不存在财产损失，故甲对王某不构成犯罪。 第二板块，就甲质押李某的自行车而言： 在王某索要时，甲无力赎回该车。甲虚构借用自行车的事实欺骗李某，李某基于认识错误将车借给甲，处分了自行车的占有权，故甲构成诈骗罪。根据危害行为与行为对象同时存在的原理，甲的诈骗行为指向的对象是价值15万元的自行车，并且实际取得该自行车。因此，甲的行为构成诈骗罪，犯罪数额为15万元。 提示：不能以典当或者销赃的价格认定犯罪数额。例如，甲盗窃价值1万元的手机，以5000元出售他人。甲的盗窃行为指向的对象是价值1万元的手机，不能将5000元销赃数额认定为犯罪数额。 综上，本题答案为C。","auto":"C","link":"https://weibo.com/1669134634/Rd0DHu8vv"},{"num":47,"day":"2026-08-13","stem":"下列选项应当以故意杀人罪论处的是（多选）？","options":[{"k":"A","t":"甲帮助警察刑讯逼供，致使犯罪嫌疑人死亡的"},{"k":"B","t":"乙（15周岁）聚众斗殴致人死亡的"},{"k":"C","t":"丙强迫他人捐献器官，致人死亡的"},{"k":"D","t":"丁（保姆）在雇主家放火致4人死亡"}],"answerRef":"ABC。解析：在做题时，“先解决无争议的，再讨论有争议的”。警察刑讯逼供致人死亡，根据刑法规定，应当转化为故意杀人罪。因此，甲帮助警察刑讯逼供致人死亡，构成故意杀人罪的共犯。A项正确。 根据刑法规定，聚众斗殴致人死亡的，应当转化为故意杀人罪。因此，15周岁的乙聚众斗殴致人死亡，构成故意杀人罪。B项正确。 根据刑法规定，强迫他人捐献器官致人死亡，构成故意杀人罪。C项正确。 丁（保姆）在雇主家放火致4人死亡，由于该行为危害了公共安全，应当认定为放火罪。D项错误。 提示：放火行为原则上会危害公共安全罪，如果有例外的情形，在题干中一定会做出特别说明。这是基本的命题模式。 也即，应当作出原则的推定，而不能作出例外的设想。如果雇主家独门独院，保姆的放火行为不可能会危害公共安全，题目中一定会有所明示。","auto":"ABC","link":"https://weibo.com/1669134634/Rda3FdjK6"},{"num":48,"day":"2026-08-14","stem":"关于涉及妇女、儿童的犯罪，下列选项正确的是？（单选）","options":[{"k":"A","t":"甲因身体不好，于是将其子出卖，等自己身体康复后又赎回的，不构成拐卖儿童罪"},{"k":"B","t":"甲以抚养为目的将幼儿小明骗走，后来又将小明出卖的，甲的行为构成拐骗儿童罪与拐卖儿童罪，数罪并罚"},{"k":"C","t":"甲在拐骗儿童过程中，对其进行非法拘禁的，仅应认定为拐骗儿童罪"},{"k":"D","t":"甲假装将自己 1 岁的儿子丙卖给乙，得到乙的现金后，暗中尾随抱着丙的乙，然后趁乙不备将其打伤，将丙抢回。甲构成拐卖儿童罪"}],"answerRef":"C。解析：A项，拐卖儿童罪要求主观上以出卖为目的，至于动机如何，在所不问。甲主观上具有出卖儿童的目的，客观上实施的出卖儿童的行为，故构成拐卖儿童罪。A项错误。 B项，甲分别实施了拐骗儿童与拐卖儿童的行为，根据司法解释规定，应当认定为拐卖儿童一罪。B项错误。 C项，拐骗儿童罪属于继续犯，在拐骗儿童的过程中非法拘禁该儿童的，应当认定为拐骗儿童一罪。C项正确。 D项，甲主观上没有出卖儿童的目的，只有诈骗他人财物的故意。因此，对甲应当以诈骗罪与故意伤害罪实行数罪并罚。","auto":"C","link":"https://weibo.com/1669134634/Rdjvlk3BZ"},{"num":49,"day":"2026-08-15","stem":"关于毒品犯罪，下列选项错误的是？（单选）","options":[{"k":"A","t":"甲为了自己吸食而运输数量较大的毒品，被当场查获，应当认定为非法持有毒品罪"},{"k":"B","t":"乙容留他人吸毒，又向其贩卖毒品，应当数罪并罚"},{"k":"C","t":"丙受贩毒者委托为其介绍客源，应当认定为贩卖毒品罪"},{"k":"D","t":"丁为他人代购毒品以赚取“劳务费”，应当认定为贩卖毒品罪"}],"answerRef":"A。解析：根据司法解释，因运输毒品被查货，毒品数量较大的应当认定为运输毒品罪；A项错误。 根据司法解释，容留他人吸食毒品，又向其贩卖毒品，或者贩卖毒品后又容留他人吸食毒品的，应当以贩卖毒品罪与容留他人吸毒罪，实行数罪并罚；B项正确。 丙受贩毒者委托为其介绍客源，应当认定为贩卖毒品罪的帮助犯；C项正确。 丁为他人代购毒品以赚取“劳务费”，属于变相加价牟利，应当认定为贩卖毒品罪。D项正确。","auto":"A","link":"https://weibo.com/1669134634/RdsVgpIOD"},{"num":50,"day":"2026-08-16","stem":"某公司的司机甲按照公司安排，独自一人将公司价值50万元的货物从北京运往山东。途径天津时，甲将该货物变卖后潜逃。对甲应当认定为？（单选）","options":[{"k":"A","t":"盗窃罪"},{"k":"B","t":"破坏生产经营罪"},{"k":"C","t":"职务侵占罪"},{"k":"D","t":"侵占罪"}],"answerRef":"C。解析：甲是某公司的司机，当该公司安排甲独自一人将货物运送到目的地时，甲对该批货物具有经手权（占有权），甲利用该职务便利将本公司的该批货物卖掉，并将所得款项非法占为己有，属于利用职务便利将本单位财物非法占为己有，构成职务侵占罪。","auto":"C","link":"https://weibo.com/1669134634/RdClDlmfm"},{"num":51,"day":"2026-08-17","stem":"甲毒瘾发作产生幻觉，持枪抢走乙的100克海洛因。甲吸食20克后将余下的毒品卖给丙。关于本案，下列说法正确的是？ （多选）","options":[{"k":"A","t":"甲毒瘾发作产生幻觉，属于无刑事责任能力人"},{"k":"B","t":"甲抢劫毒品后又持有，应当认定为非法持有毒品罪"},{"k":"C","t":"甲将毒品卖给丙，构成贩卖毒品罪"},{"k":"D","t":"对甲应当以抢劫罪与贩卖毒品罪，实行数罪并罚"}],"answerRef":"CD。解析：甲毒瘾发作产生幻觉，并实施抢劫行为，理论上称之为原因自由行为。甲可以自由决定自己是否陷入无责任能力状态，因此对自己在无责任能力状态下实施的犯罪行为承担责任，A项错误； 甲抢劫毒品后必然会持有毒品，持有毒品是抢劫毒品行为的当然结果，根据吸收犯原理，对甲的行为应当认定为抢劫罪。根据司法解释，以毒品、假币、淫秽物品等违禁品为对象，实施抢劫的，以抢劫罪定罪；抢劫的违禁品数量作为量刑情节予以考虑，B项错误； 根据司法解释，抢劫违禁品后又以违禁品实施其他犯罪的，应以抢劫罪与具体实施的其他犯罪实行数罪并罚，C、D项正确。","auto":"CD","link":"https://weibo.com/1669134634/RdLKbCyZd"},{"num":52,"day":"2026-08-18","stem":"下列选项正确的是？","options":[{"k":"A","t":"有期徒刑附加政治权利的，剥夺政治权利的刑期自刑罚执行完毕之日或者假释考验期满之日起计算"},{"k":"B","t":"管制犯附加剥夺政治权利的，剥夺政治权利的刑期可以短于管制执行的刑期"},{"k":"C","t":"缓刑考验期内犯新罪的，应当撤销缓刑，按照“先减后并”的原则，实行数罪并罚"},{"k":"D","t":"缓刑犯的考验期不能短于原判刑期"}],"answerRef":"D。解析：A项，有期徒刑附加政治权利的，剥夺政治权利的刑期自刑罚执行完毕之日或者假释之日起计算。因为自刑罚执行完毕或者假释之日起，行为人就有人身自由，就可能行使政治权利。A项错误。 B项，根据刑法规定，管制犯附加剥夺政治权利的，剥夺政治权利的刑期与管制的刑期相同，同时执行。B项错误。 C项，缓刑考验期内犯新罪的，应当撤销缓刑，实行数罪并罚。由于缓刑犯没有实际执行的刑期，故不存在“减”去执行刑期的问题。C项错误。 D项，根据刑法规定，拘役的缓刑的考验期为原判刑期以上1年以下，但不能少于2个月。有期徒刑的缓刑考验期为原判刑期以上5年以下，但不能少于1年。D项正确。","auto":"D","link":"https://weibo.com/1669134634/RdVcz9AZf"},{"num":53,"day":"2026-08-19","stem":"关于正当防卫，下列选项正确的是？（多选）","options":[{"k":"A","t":"只能对犯罪行为进行正当防卫，对违法行为不能进行正当防卫"},{"k":"B","t":"一般防卫与特殊防卫的时间条件不同"},{"k":"C","t":"行为人唆使恶狗伤害他人，若将恶狗打死的，成立正当防卫"},{"k":"D","t":"对精神病人的侵害行为可实行正当"}],"answerRef":"CD。解析：A项，对一些侵害公民人身、财产和破坏社会秩序的违法行为，也可实行正当防卫。A项错误。 B项，特殊防卫与一般防卫在时间条件上相同，都要求不法侵害已经着手，尚未结束。B项错误。 C项，对不法侵害的反击，既可以针对不法侵害人的人身，也可针对其使用的财产。C项正确。 D项，精神病人实施的侵害行为也属于不法侵害，根据司法解释，可对其实行正当防卫。D项正确。","auto":"CD","link":"https://weibo.com/1669134634/Re4Dgriq3"},{"num":54,"day":"2026-08-20","stem":"甲盗窃丙的保险柜，乙为甲望风并约定平分赃款。期间乙打电话建议甲放弃盗窃，甲假意答应。甲窃得数额巨大财物后谎称自己主动放弃，未取得财物。关于本案：","options":[{"k":"A","t":"甲对乙构成诈骗罪"},{"k":"B","t":"乙构成犯罪中止"},{"k":"C","t":"乙构成犯罪未遂"},{"k":"D","t":"乙的行为与丙的损失有因果关系"}],"answerRef":"D。解析：甲实际取得10万元财物，构成盗窃罪既遂。乙劝说甲放弃犯罪，但是未有效防止共同犯罪结果发生，故不构成盗窃罪中止，应当认定为盗窃罪既遂。 共同犯罪是整体行为，乙为甲的盗窃行为望风，客观上促进了甲的盗窃行为，共同造成了丙的财产损失。因此，乙的行为与丙的损失有因果关系。 甲虽然对乙实施欺骗行为，但乙并未基于认识错误处分自己的财物。而且，乙根本不存在财产损失，故甲对乙不构成诈骗罪。","auto":"D","link":"https://weibo.com/1669134634/Ree2yvzae"},{"num":55,"day":"2026-08-21","stem":"甲被国资委（国家机关）委派到某国有控股公司担任负责采购的业务主管，乙是该公司分管采购业务的副总经理。甲、乙相互勾结，乙提议分别利用各自的职务便利，共同收受供应商100万元回扣，据为二人所有。对甲、乙：（单选）","options":[{"k":"A","t":"均应认定为贪污罪"},{"k":"B","t":"均应认定为受贿罪"},{"k":"C","t":"均应认定为非国家工作人员受贿罪"},{"k":"D","t":"对甲认定为受贿罪，对乙认定为非国家工作人员受贿罪"}],"answerRef":"C。解析：根据司法解释，非国家工作人员与国家工作人员通谋，共同收受他人财物，构成共同犯罪的，根据双方利用职务便利的具体情形，分别定罪追究刑事责任： （1）利用国家工作人员的职务便利为他人谋取利益的，以受贿罪追究刑事责任。 （2）利用非国家工作人员的职务便利为他人谋取利益的，以非国家工作人员受贿罪追究刑事责任。 （3）分别利用各自的职务便利为他人谋取利益的, 按照主犯的犯罪性质追究刑事责任，不能分清主从犯的，可以受贿罪追究刑事责任。 本案中，甲、乙相互勾结，乙提议分别利用各自的职务便利，共同收受供应商100万元回扣，故乙属于主犯。因此，应当以非国家工作人员的受贿罪追究两人的刑事责任。 提示：甲具有国家工作人员的身份，乙不具有国家工作人员的身份。","auto":"C","link":"https://weibo.com/1669134634/RenuelO6y"},{"num":56,"day":"2026-08-22","stem":"关于窝藏罪、包庇罪，下列说法错误的是？（多选）","options":[{"k":"A","t":"在逃犯甲意欲自首，乙劝其继续潜逃，构成窝藏罪"},{"k":"B","t":"包庇罪既可以作为方式实施，也可以不作为的方式实施"},{"k":"C","t":"甲为犯罪人乙毁灭有罪的证据，构成包庇罪"},{"k":"D","t":"甲向司法机关出示虚假证据，以证明犯罪人乙无罪，构成窝藏罪"}],"answerRef":"ABCD。解析：窝藏罪，是指明知是犯罪的人而为其提供隐藏处所、财物，帮助其逃匿的行为；包庇罪，是指明知是犯罪的人而作假证明包庇的行为。 A项，乙明知甲为在逃犯，劝其放弃自首，继续潜逃。乙并没有为甲提供隐藏处所、财物等，帮助其逃匿。因此，乙不构成窝藏罪。A项错误。 B项，包庇罪的客观行为是向司法机关作假证明，因此必须是以作为的方式实施。因为单纯的知情不举不可能构成包庇罪。B项错误。 C项，甲为犯罪人乙毁灭有罪的证据，但该行为本身不是向公安司法机关作假证明。因此，甲不构成包庇罪，而是构成帮助毁灭证据罪。D项错误。 提示：只需要知道甲不构成包庇罪即可 D项，甲向司法机关出示虚假证据，以证明犯罪人乙无罪，属于作假证明包庇乙，应当认定为包庇罪而非窝藏罪。D项错误。","auto":"ABCD","link":"https://weibo.com/1669134634/RewUqi7Gd"},{"num":57,"day":"2026-08-23","stem":"甲、乙是逃犯，共谋如果有警察追捕就开枪射杀。甲开枪射杀警察丁未击中，子弹与丁擦肩而过但致乙重伤。关于本案，下列哪些选项是正确的？（多选)","options":[{"k":"A","t":"甲的行为属于行为偏差"},{"k":"B","t":"乙构成故意杀人罪"},{"k":"C","t":"乙构成袭警罪"},{"k":"D","t":"对甲应当实行数罪并罚"}],"answerRef":"ABC。解析：行为偏差，又称打击错误，是指行为人预想打击的目标与实际打击的目标不一致。甲开枪射杀警察丁未击中，子弹与丁擦肩而过但致乙重伤。甲因客观行为偏差造成重伤结果，属于打击错误。A项正确。 甲、乙事前有通谋，主观上具有共同的杀人故意，客观上甲的开枪行为属于共同犯罪行为。因此，甲乙构成故意杀人罪的共同犯罪。B项正确。 袭警罪，是指暴力袭击正在依法执行职务的人民警察或者使用枪支、管制刀具，或者以驾驶机动车撞击等手段严重危及其人身安全的行为。甲、乙事前有通谋，主观上具有袭警罪的共同故意。客观上甲的开枪行为，是甲乙共同的袭警行为。因此，甲乙构成袭警罪的共同犯罪。C项正确。 甲客观上仅实施一个开枪行为，同时构成袭警罪与故意杀人罪，属于想象竞合犯，应当从一重罪处罚。也即，以故意杀人罪未遂定罪处罚。D项错误。 提示：如同醉酒驾驶机动车致人死亡，行为人既构成危险驾驶罪，又构成交通肇事罪，应当以交通肇事罪定罪处罚。如果是单选题，应当选行为人构成交通肇事罪。如果是多选题，应当选行为人构成危险驾驶罪和交通肇事罪。 注意：本题不涉及非法持有枪支罪的问题，题干以及选项信息并未要求判断是否属于非法持有枪支。","auto":"ABC","link":"https://weibo.com/1669134634/ReGl2v8l6"},{"num":58,"day":"2026-08-24","stem":"甲教唆乙枪杀丙，乙误将路人丁当作丙，将丁打死。关于本案，下列选项正确的是？","options":[{"k":"A","t":"甲构成故意杀人罪既遂"},{"k":"B","t":"乙构成故意杀人罪既遂"},{"k":"C","t":"甲属于行为偏差"},{"k":"D","t":"乙属于对象错误"}],"answerRef":"ABCD。解析：乙误将丁当作丙，属于主观认识错误，由于丙、丁的法律性质相同，故乙属于对象错误。 甲教唆乙杀人，乙主观上产生认识错误，即杀错了人。但乙主观上的错误对甲而言属于客观行为偏差，因此甲的行为属于打击错误。乙主观上的认识错误导致甲的教唆行为没有指向正确的目标，即预想打击的目标与实际打击的目标不一致。 【总结】无论实行犯属于对象错误还是打击错误，对教唆犯而言都是客观行为偏差，均属于打击错误。 【提示】在共同犯罪中，各共同犯罪人的行为都是指向同一目标，彼此联系、互相配合，结成一个犯罪行为整体。（一人着手，全部着手；一人既遂，整体既遂。）","auto":"ABCD","link":"https://weibo.com/1669134634/RePLDzvzP"},{"num":59,"day":"2026-08-25","stem":"甲公司贷款诈骗1000万元，让“地下钱庄”的经营者乙将该笔款项以外汇形式转移至境外。事后查明乙对该笔款项的性质知情并获利巨大。关于本案：（多选）","options":[{"k":"A","t":"甲公司构成贷款诈骗罪"},{"k":"B","t":"乙构成为洗钱罪"},{"k":"C","t":"乙构成非法经营罪"},{"k":"D","t":"对乙应当数罪并罚"}],"answerRef":"BC。解析：单位不是贷款诈骗罪的主体，根据司法解释，对甲公司应当认定为合同诈骗罪。 虽然甲公司不构成贷款诈骗罪，但甲公司在客观上实施了贷款诈骗的行为，且该1000万元也系贷款诈骗所得。乙对此明知而将其转移至境外，应当认定为洗钱罪。 【提示】洗钱罪：重行为不重罪名，重事实不重结果。也即，只要客观上有贪金走破黑毒恐的行为及其犯罪所得，均可以成为洗钱罪的对象。 乙对该笔款项的性质知情并获利巨大，故乙经营地下钱庄的行为同时构成非法经营罪与洗钱罪，属于想象竞合犯，应当从一重罪处罚。 而且，根据司法解释，非法从事资金支付结算业务或者非法买卖外汇，构成非法经营罪，同时又构成洗钱罪的，依照处罚较重的规定定罪处罚。","auto":"BC","link":"https://weibo.com/1669134634/ReZcfgCuM"},{"num":60,"day":"2026-08-26","stem":"甲前往乙家抢劫，闯入乙家后发现乙家中无人，便偷走了乙家的数额巨大的财物。关于甲的行为：","options":[{"k":"A","t":"构成入户盗窃"},{"k":"B","t":"构成抢劫罪预备"},{"k":"C","t":"应当认定为盗窃罪既遂"},{"k":"D","t":"应当实行数罪并罚"}],"answerRef":"ABC。解析：根据司法解释，非法进入供他人家庭生活，与外界相对隔离的住所盗窃的，应当认定为“入户盗窃”。甲基于抢劫故意非法进入乙家，后实施盗窃行为，属于入户盗窃。 甲在抢劫故意支配下实施了抢劫的预备行为，在盗窃故意支配下实施了盗窃的实行行为。由于前后两个行为都是针对乙的财物，故应当认定为盗窃罪既遂。其法理为：实行行为吸收非实行行为。如甲既教唆乙杀人，又与乙共同杀死被害人。甲的杀人实行行为吸收教唆行为，应当认定为故意杀人罪的共同实行犯，不再认定为教唆犯。 本案中，虽然甲客观上实施了两个行为，但是被害人仅遭受一份财产损失。因此，对甲应当认定为盗窃罪既遂，而不应实行数罪并罚。","auto":"ABC","link":"https://weibo.com/1669134634/Rf8Cq26aB"},{"num":61,"day":"2026-08-27","stem":"甲不想缴纳电费，采取技术手段使电表转速变慢，然后大量用电。电力公司抄表员根据电表度数登记用电量，甲据少缴大量电费。关于甲的行为：（多选）","options":[{"k":"A","t":"构成盗窃罪"},{"k":"B","t":"构成诈骗罪"},{"k":"C","t":"构成侵占罪"},{"k":"D","t":"应当实行数罪并罚"}],"answerRef":"AB。解析：甲不想缴纳电费，主观上先产生了非法占有目的，客观上利用技术手段，使电表转速变慢，大量用电的过程就是在秘密窃取电力公司的财物（电力），盗窃行为指向的对象是电力本身（无体物），俗称“偷电”。因此，甲构成盗窃罪。 甲利用技术技术手段使电表转速变慢，没有显示正常的用电度数，甲隐瞒了正常的用电情况，属于欺骗行为。该行为使得电力公司基于认识错误放弃了部分财产性利益（电费）。因此，甲的行为构成诈骗罪。 由于甲的非法占有目的产生在前，故不构成侵占罪。同时，甲并未替电力公司保管电力，不符合侵占罪“变合法占有为所有”的逻辑结构。因为甲使用电力就是在消耗电力，不存在保管的问题。因此，甲不构成侵占罪。 最后，评价案件事实，既要坚持全面评价，又要禁止重复评价。甲的行为仅获得一份非法利益，电力公司也仅遭受一份财产损失。因此，对甲应当以盗窃罪与诈骗罪，从一重处罚，不实行数罪并罚。 提示：甲客观上实施了两个行为，前行为是盗窃，针对的对象是电力本身。后行为是诈骗，针对的对象是电力公司的财产性利益（电费）。因此本案不属于想象竞合犯，但基于禁止重复评价的原理，不得实行数罪并罚。一般而言，盗窃罪的入罪门槛更低，如盗窃罪的数额较大为1000元以上，诈骗罪的数额较大为3000元以上。因此，盗窃罪会更重一些。综上，本案应当认定为盗窃罪一罪。","auto":"AB","link":"https://weibo.com/1669134634/Rfi314gWd"},{"num":62,"day":"2026-08-28","stem":"甲趁店员乙不备，偷走某超市价值2万元的名酒。次日，甲伪造购物小票，利用该超市7天无理由退换货规则，将酒“退给”该超市，获利2万元。关于甲的行为：（多选）","options":[{"k":"A","t":"构成盗窃罪"},{"k":"B","t":"构成诈骗罪"},{"k":"C","t":"属于想象竞合犯"},{"k":"D","t":"犯罪数额为4万元"}],"answerRef":"AB。解析：甲以非法占有为目的，偷走超市的名酒，构成盗窃罪，针对的对象是名酒。事后，甲又伪造购物小票，将酒“退给”该超市，属于虚构事实，超市基于认识错误同意退款，甲获利2万元。因此，甲构成诈骗罪，针对的对象是超市的退货款。甲前后实施两个行为，不属于想象竞合犯。 最后，评价案件事实，既要坚持全面评价，又要禁止重复评价。甲的行为仅获得一份非法利益，超市也仅遭受一份财产损失。因此，对甲应当以盗窃罪与诈骗罪，从一重处罚，不实行数罪并罚。最终，应当认定为盗窃罪，犯罪数额为2万元。","auto":"AB","link":"https://weibo.com/1669134634/RfrtFCXEM"},{"num":63,"day":"2026-08-29","stem":"甲怀疑乙与自己的妻子有染，纠集多人报复乙，因天黑视线不清，误将路人丙当作乙，众人殴打丙并造成轻伤。关于甲的行为，应当认定为：（单选）","options":[{"k":"A","t":"故意伤害罪"},{"k":"B","t":"寻衅滋事罪"},{"k":"C","t":"聚众斗殴罪"},{"k":"D","t":"过失致人轻伤，不构成犯罪"}],"answerRef":"","auto":null,"link":"https://weibo.com/1669134634/RfAVznDB0"},{"num":906,"day":"2025-11-28","stem":"甲、乙因经济拮据共谋“搞点钱”，甲提出劫持前房东之子王某，以此向王某家人索要财物，乙同意。甲将放学后的王某骗走，与乙一起将王某带至某水库旁，共同将王某杀死。当晚，甲通过公用电话向王某家人索要巨额财物，被王某家人拒绝。王某家人报警后，甲、乙分开逃跑。警察在附近遇到甲，甲谎称自己是目击者，向警察提供了乙驾车逃跑的方向。警察追赶乙时，乙为了逃跑驾车冲撞警车，随后乙被警方抓获。\n请根据上述材料，分析以下意见是否正确，并说明理由。","options":[],"answerRef":"（1）甲、乙具有未遂情节。\n不正确。理由：甲、乙以勒索财物为目的，将王某杀死并向其家人索要巨额财物。根据《刑法》规定，甲、乙属于在绑架过程中杀害被绑架人，应当认定为绑架罪。虽然甲、乙未取得财物，但完整地实现了绑架罪所规定的全部犯罪构成事实，应当认定为犯罪既遂。\n（2）甲具有立功情节。\n不正确。理由：犯罪分子只有在归案以后才能构成立功，甲谎称自己是目击者，并未向警察投案，不符合立功的时间条件，故不构成立功。\n（3）乙构成袭警罪。\n正确。理由：乙为了逃跑驾车冲撞警车，危及其人身安全，属于暴力袭击正在依法执行职务的人民警察，应当认定为袭警罪。","auto":null,"link":"https://weibo.com/1669134634/QfWDH46r0"},{"num":907,"day":"2025-11-28","stem":"甲、乙商量将王某（女）拐骗到某市卖掉，乙以过生日为名将王某诱骗到一出租屋关押。期间，丙来到出租屋得知二人打算将王某出卖。在甲外出寻找买家时，乙电话告知甲自己不再参与，甲同意。后丙接替乙看管王某。甲联系好买家后返回出租屋，见丙欲强奸王某，转身离开。丙奸淫王某后，又临时起意摘下王某的金饰，王某担心丙继续殴打自己，未敢反抗。\n请根据上述材料分析以下问题并说明理由：","options":[],"answerRef":"1、甲、乙、丙的行为应如何认定？\n（1）甲、乙、丙构成拐卖妇女罪的共同犯罪。\n理由：①甲、乙以出卖为目的，非法控制王某，共同剥夺其人身自由，构成拐卖妇女罪的共犯。②丙明知甲、乙拐卖王某而中途加入，主观上丙与甲、乙具有拐卖妇女的共同故意，客观上丙与甲、乙共同实施了非法控制王某的行为，故丙构成拐卖妇女罪的共犯，属于事前无通谋的共同犯罪。③在控制王某期间，甲放任丙对王某实施强奸行为，根据《刑法》规定，应对甲、丙应认定为拐卖妇女罪一罪。由于乙对丙的强奸行为不知情，主观缺乏强奸故意，故对丙的强奸行为不承担责任。\n（2）丙构成抢劫罪。理由：①丙强奸王某后，又临时起意利用王某不敢反抗的状态，当场劫取其金饰，构成抢劫罪。②丙的抢劫行为属于共同犯罪中的过限行为，对此甲、乙不构成抢劫罪共犯。因此，对丙应以拐卖妇女罪与抢劫罪实行数罪并罚。\n2、甲、乙、丙具备哪些法定量刑情节及相应量刑情节的处理原则是什么？\n（1）关于甲、乙的量刑情节及其处理：\n①甲、乙在拐卖妇女罪的共同犯罪中均是主犯。②甲的行为属于“奸淫被拐卖的妇女”，按照加重处罚情节处理。③ 在乙消极退出犯罪前，甲乙已经非法控制王某，剥夺了其人身自由，完整实现了拐卖妇女罪规定的全部犯罪事实，故乙不成立犯罪中止，应认定为犯罪既遂。\n（2）关于丙的量刑情节及其处理：\n①对丙应当以拐卖妇女罪与抢劫罪实行数罪并罚。②丙的行为属于“奸淫被拐卖的妇女”，按加重处罚情节处理。③丙在拐卖妇女罪的共同犯罪中是从犯，应当从轻、减轻或者免除处罚。","auto":null,"link":"https://weibo.com/1669134634/QfWRC9Lr9"},{"num":912,"day":"2025-11-28","stem":"行人甲违规闯红灯沿人行横道小跑穿行，与驾驶电动自行车的王某发生碰撞，致其连人带车摔倒在机动车道内。乙驾驶小型汽车恰逢绿灯放行，并跟随前车起步。王某恰巧倒在乙的左前侧车轮下，此时乙的车辆已经启动，属该路口等待中的第二辆车，视野在一定程度上被前车遮挡。从甲撞倒王某到王某被车轮碾轧之间的时间不到2秒钟，甲见状逃离现场。乙当即报警并将王某送医，王某经抢救无效于当日死亡。交警部门出具的道路交通事故认定书认定，甲负事故主要责任，王某负事故次要责任。甲被抓获后，在被取保候审期间逃往外地。两月后，甲又到派出所投案，并如实供述上述犯罪事实。\n请根据上述材料，分析辩护人提出的以下意见是否正确，并说明理由。","options":[],"answerRef":"（1）甲的行为应当认定为交通肇事罪。\n正确。理由：甲违反交通运输管理法规，在闯红灯时与王某发生碰撞，致使王某被车辆碾轧致死，构成交通肇事罪。\n（2）甲具有加重处罚情节。\n正确。理由：甲在交通肇事后，为逃避法律追究而逃跑，其行为属于交通肇事后逃逸，应照加重处罚情节处理。但甲的行为不属于“因逃逸致人死亡”。\n（3）乙的行为不构成犯罪。\n正确。理由：乙的行为客观上造成王某死亡，但乙主观上对死亡结果既无故意也无过失，而是由于不能预见的原因造成的，故应当认定为意外事件。\n（4）甲构成自首。\n不正确。理由：甲被动归案以后逃亡外地，不属于自动投案。虽然甲又到派出所投案并如实供述自己的罪行，但根据司法解释，甲不成立自首。","auto":null,"link":"https://weibo.com/1669134634/QfX6w7N7r"},{"num":913,"day":"2025-11-29","stem":"甲（17周岁）深夜强行闯入乙经营的小卖部，打算先将乙杀死，再拿走乙的财物。甲持锤子砸向乙的头部后，误以为乙已经死亡。 取得现金后为毁灭罪证，甲放火点燃乙家并蔓延至邻居丙家，丙及时将火扑灭，幸未造成严重后果。经法医鉴定，乙因颅脑损伤且呼入过量一氧化碳而死亡。甲的家人劝其投案未果，便将其捆绑送至公安局。甲到案后如实交代了自己的犯罪事实。\n请根据上述材料，分析甲的辩护人提出的以下意见是否成立，并说明理由。","options":[],"answerRef":"1、甲的抢劫行为与乙的死亡结果没有因果关系。\n不成立。理由：甲在抢劫过程中误以为乙死亡，为毁尸灭迹而放火并致乙死亡。由于介入因素并不异常，故不中断抢劫行为与死亡结果之间的因果关系。\n2、对甲不得判处死刑。\n成立。理由：甲犯罪时仅17周岁，根据《刑法》规定，对犯罪时不满18周岁的人不得适用死刑。\n3、甲的放火行为未造成严重后果，具有未遂情节。\n不成立。理由：放火罪属于危险犯，只要发生侵害法益的现实危险即构成犯罪既遂。由于甲已经点燃乙家，对公共安全造成了现实危险，齐备了放火罪所规定的全部犯罪构成事实，故构成犯罪既遂。\n4、甲具有自首情节，可以从轻或者减轻处罚。\n不成立。理由：甲被捆绑送至司法机关，属于被动归案，故不符合自动投案的要求，不成立自首。（甲到案后如实供述自己罪行，成立坦白，可以从轻处罚）","auto":null,"link":"https://weibo.com/1669134634/Qg6t412jn"},{"num":914,"day":"2025-11-30","stem":"王某通过微信骚扰甲的妻子孙某，并表示欲与孙某发生婚外情。甲得知此事后，安排孙某将王某约至某公园，并邀约其表弟乙一同持棒球棍、砍刀驾车至约定地点。二人在公园见到王某后，甲先持棒球棍殴打王某，后乙持砍刀将王某砍伤，致王某轻伤。之后，甲要求道歉，并谎称其专门从浙江回来处理此事，质问如何解决。王某担心此时被别人知晓，提出经济补偿，乙通过手机查询机票价格并在一旁持刀威胁，双方协商补偿金额为5000元。期间，甲看到王某微信账户中有8000元。后王某通过微信提现向甲转款5000元。甲提议报警，送王某入医院治疗，王某均表示拒绝。后因王某伤后无法行走而拨打电话报警。甲、乙经公安机关电话通知到案，后因害怕趁警察不备逃跑，二人被通缉后又主动投案，如实供述上述事实。\n请根据上述材料，分析辩护人提出的以下意见是否正确，并说明理由。","options":[],"answerRef":"（1）甲、乙的行为属于牵连犯。\n不正确。理由：甲、乙伤害王某与向王某索取财物的行为不存在手段与目的的牵连关系（或答：不是出于一个最终的犯罪目的），故不构成牵连犯。\n（2）检察机关对甲、乙构成抢劫罪的指控不成立。\n正确。理由：甲、乙伤害王某后，没有利用王某不能反抗、不敢反抗的处境劫取其财物，故不构成抢劫罪。甲乙以非法占有为目的，对王某实施威胁行为，接受王某提出的经济补偿，王某基于恐惧心理处分了5000元财物，应认定为敲诈勒索罪。\n【提示】根据司法解释，行为人实施伤害、强奸等犯罪行为，在被害人未失去知觉，利用被害人不能反抗、不敢反抗的处境，临时起意劫取他人财物的，应以此前所实施的具体犯罪与抢劫罪实行数罪并罚；在被害人失去知觉或者没有发觉的情形下，以及实施故意杀人犯罪行为之后，临时起意拿走他人财物的，应以此前所实施的具体犯罪与盗窃罪实行数罪并罚。本题目不适用上述司法解释。\n（3）甲、乙具有自首情节。\n正确。理由：甲、乙经公安机关电话通知后到案，属于自动投案。虽然甲、乙趁警察不备逃跑，但二人在逃跑后又自动投案并如实供述自己的罪行。根据司法解释，甲、乙构成自首。","auto":null,"link":"https://weibo.com/1669134634/QggbEkXEe"},{"num":915,"day":"2025-12-01","stem":"甲在某厂务工期间被辞退，乙到该厂接替甲的工作。甲认为其被辞退系乙从中作梗所致，对乙怀恨在心，遂决意报复。某日上午，甲携带一把菜刀，来到该厂附近路口守候。当乙驾驶摩托车上班途经该路口时，甲上前向乙讨说法，并持刀将乙的头部和手臂砍致轻伤。乙被砍伤后弃车逃进工厂，甲持刀追赶时见乙叫工友报警。在其他工人出门追赶甲时，甲放弃追赶并返回现场，临时起意将乙价值为5000元的摩托车骑走，工人没有追上甲。甲被羁押在看守所期间发现同监室在押人员丙企图自杀后及时制止。\n请根据上述材料，分析甲的行为应如何认定以及是否具备法定量刑情节？","options":[],"answerRef":"（1）甲的行为应当认定为故意伤害罪与抢夺罪，实行数罪并罚。理由：①甲为报复乙持刀将乙砍成轻伤，构成故意伤害罪。②在砍伤乙后，甲以非法占有为目的，临时起意公然骑走乙的摩托车，构成抢夺罪。③甲砍伤乙后，并未利用乙不能反抗的处境劫取其财物，不构成抢劫罪。（2）甲具有立功情节，可以从轻或者减轻处罚。理由：甲被羁押在看守所期间，及时制止他人自杀，属于有利于国家和社会的突出表现，构成立功。","auto":null,"link":"https://weibo.com/1669134634/Qgpi0E8j5"},{"num":916,"day":"2025-12-02","stem":"乙购买一辆二手摩托车，明知甲未取得摩托车驾驶证，仍让甲驾驶摩托车并搭载自己。途中，甲不慎撞倒行人徐某，摩托车倒地，甲也当场昏迷。乙见徐某尚有呼吸，便拨打了120急救电话。后乙又将徐某拽入路边沟中，驾驶该摩托车载着甲逃离现场。抢救人员到达现场后没发现徐某而拨打乙的电话，乙明知可能是医生所打电话但未接听。乙将甲送往医院，甲醒来后知道自己撞了人但未报警，致使徐某因交通事故致颅脑损伤且未得到及时救助而死亡。乙被抓获后，如实供述甲的藏匿地点，公安机关及时抓获在医院治疗的甲。\n请根据上述材料，分析辩护人提出的以下意见是否正确，并说明理由。","options":[],"answerRef":"（1）甲不属于逃逸致人死亡。\n不正确。理由：甲违反交通运输管理法规，无证驾驶摩托车将徐某撞伤。甲明知发生交通事故，为逃避法律追究而逃逸，致使徐某得不到救助而死亡，属于交通肇事逃逸致人死亡，按加重处罚情节处理。\n（2）乙构成故意杀人罪。\n正确。理由：乙作为车辆的所有人，指使甲无证驾驶摩托车，致使徐某被撞伤。乙在交通肇事后为逃避法律追究，将徐某带离事故现场后隐藏，致使徐某无法得到救助而死亡。根据司法解释，乙构成故意杀人罪。（也可答：乙明知徐某未死亡，仍将其转移至水沟中，放任徐某死亡结果发生，构成故意杀人罪。）\n（3）乙不构成交通肇事罪的共犯。\n不正确。理由：在交通事故发生后，乙为逃避法律追究驾车载甲逃逸，致使徐某因得不到救助而死亡。根据司法解释，乙构成交通肇事罪的共犯\n（4）乙构成立功。\n不正确。理由：乙被抓获后如实供述甲的藏匿地点，但该信息属于犯罪中掌握的同案犯的藏匿地址，不能认定为协助司法机关抓捕同案犯，故乙不构成立功。","auto":null,"link":"https://weibo.com/1669134634/QgztRrjDG"},{"num":917,"day":"2025-12-03","stem":"宋某是甲的未成年女儿。王某与宋某通过网络聊天认识后发生性关系，又以公开宋某的裸照胁迫宋某与其继续发生性关系。之后，宋某将此事告知甲。甲及其家人决定让宋某将王某叫至本村进行私了。当日13时许，王某驾驶面包车到达村口，甲等人持羊角锤、木棍等工具殴打王某，后将王某带至甲家的旧院内。其间，甲等人持棍棒等工具多次殴打王某，并向其家人索要赔偿金人民币50万元。甲等人发现王某伤情较重后，给王某服药，并找村医予以治疗，后王某因伤死亡。经鉴定，王某符合创伤性休克死亡。当晚，甲等人将王某的面包车及尸体推入邻县道路边悬崖下，造成面包车损毁。经鉴定，案涉面包车价值人民币3万元。\n请根据上述材料，分析甲的行为应当如何认定，并说明理由。","options":[],"answerRef":"甲构成故意伤害罪与故意毁坏财物罪，实行数罪并罚。理由：（1）甲为索取赔偿款，非法控制王某，剥夺其人身自由，构成非法拘禁罪。期间，甲持棍棒等工具殴打王某致其死亡，由于主观上对死亡结果是过失，故应当认定为故意伤害罪致人死亡。（2）王某死亡后，甲将王某的面包车推入悬崖，故意毁坏他人数额较大的财物，构成故意毁坏财物罪。（3）甲虽然向王某家人索取财物，但其目的是为了获取赔偿金，而不是为了非法占有他人财物，故不构成绑架罪。\n注意：\n1、甲将王某的尸体推入悬崖，属于犯罪后毁灭证据，不具有期待可能性，不再认定为故意毁坏尸体罪。\n2、事出有因非法拘禁他人并向其亲属索取赔偿金，但系事出有因，索取赔偿金有一定依据，应当定性为非法拘禁，而非绑架罪。\n3、第238条【非法拘禁罪】非法拘禁他人或者以其他方法非法剥夺他人人身自由的，处三年以下有期徒刑、拘役、管制或者剥夺政治权利。具有殴打、侮辱情节的，从重处罚。\n犯前款罪，致人重伤的，处三年以上十年以下有期徒刑;致人死亡的，处十年以上有期徒刑。使用暴力致人伤残、死亡的，依照本法第二百三十四条、第二百三十二条的规定定罪处罚。\n为索取债务非法扣押、拘禁他人的，依照前两款的规定处罚。\n国家机关工作人员利用职权犯前三款罪的，依照前三款的规定从重处罚。\n提示：使用暴力致人伤残、死亡的，行为转化为故意伤害罪或者故意杀人罪，如何做题？\n原则上为了避免理论上的争议，考试时通常直接“平移法条用语”，即使用暴力致人伤残，认定为故意伤害罪；使用暴力致人死亡，认定为故意杀人罪。但是，如果考到本题，由于题干信息非常清晰地指出了行为人对死亡结果是过失心态，则应认定为故意伤害罪致人死亡。","auto":null,"link":"https://weibo.com/1669134634/QgIKavpXk"},{"num":918,"day":"2025-12-04","stem":"2022年，甲到乙承包经营的速递公司打工，并与乙共同租住在某公寓。同年11月，乙以人民币20万元将速递公司的经营权转包给甲。\n因乙多次向甲催要转包费，甲无钱支付，遂起意将乙杀死。2023年1月21日晚，甲趁乙熟睡之机，持斧头猛砍乙的头部和颈部，致乙因失血性休克合并颅脑损伤而死亡。后甲又将死者身上的5000元人民币和背面写有密码的银行卡拿走，并分3次从自动取款机取出3万元现金。经查：甲因犯抢劫罪被判处有期徒刑7年，2020年8月刑满释放。\n请根据上述材料分析对甲如何定罪处罚？","options":[],"answerRef":"甲构成故意杀人罪与盗窃罪，实行数罪并罚。理由：（1）甲因无力偿还债务，持斧头故意将乙杀死，构成故意杀人罪。（2）甲杀死乙后，临时起意取走乙的5000元现金与银行卡，构成盗窃罪。（3）甲以非法占有为目的，持卡取款3万元，属于盗窃信用卡并使用，构成盗窃罪，不再认定为信用卡诈骗罪。（4） 甲因抢劫罪被判处有期徒刑，在刑罚执行完毕后5年内又故意再犯应当被判处有期徒刑以上刑罚之罪，成立累犯，应当从重处罚。","auto":null,"link":"https://weibo.com/1669134634/QgSrn8YD5"},{"num":919,"day":"2025-12-05","stem":"甲与邻居乙因怨生恨。某日，甲趁乙不备潜入其房内，将一包毒鼠药放入乙使用的白色茶壶。当天到乙家聊天、做客的邻居、亲戚等10人喝了壶内的水后中毒，造成1人死亡，7人轻伤，乙经抢救后脱险。（事实一）\n甲又向乙院子门口种植的丝瓜中注射剧毒农药，由于丝瓜棚靠近马路，邻居之间往来频繁，乙和其他邻居摘食毒丝瓜后死亡。经鉴定，乙生前患有糖尿病，医院在对其救治时，仅以糖尿病与高血压症进行治疗。（事实二）\n请根据上述材料回答下列问题并说明理由：","options":[],"answerRef":"1．事实一中甲的投毒行为构成何罪？\n构成故意杀人罪。理由：（1）主观上甲意图非法剥夺乙的生命，具有杀人故意。客观上甲将毒鼠药放入乙使用茶壶内并致1人死亡，虽然存在事实认识错误，但根据法定符合说，应认定为故意杀人罪既遂。（2）由于甲的杀人行为针对的是特定的人，主观上缺乏危害公共安全的故意，故不构成投放危险物质罪。\n2．事实二中甲注射毒药的行为构成何罪？\n构成投放危险物质罪。理由：（1）甲明知乙门前的丝瓜可能被不特定多人摘食，仍向丝瓜中注射剧毒农药，放任危害公共安全结果发生，应认定为投放危险物质罪。（2）虽然医院存在误诊，但不能中断投毒行为与乙的死亡结果之间的因果关系，故甲的行为构成投放危险物质罪致人死亡。\n3．综合事实一与事实二，对甲应当如何处理？\n对甲先后实施的两个独立的犯罪行为，应当以故意杀人罪与投放危险物质罪实行数罪并罚。","auto":null,"link":"https://weibo.com/1669134634/Qh1CctyY5"},{"num":920,"day":"2025-12-06","stem":"甲曾在星星房产公司销售科工作，熟悉办理不动产权登记所需材料以及办理流程。甲伙同乙利用伪造的材料，在不动产中心申请房产登记并取得10套房产的不动产登记证书，给星星房产公司造成重大损失。之后，甲、乙将上述10套房产抵押给个人及小额贷款公司，并办理了抵押登记，实际借款800万元人民币。乙从中获利100万元，其余资金被甲用于偿还个人债务、以及个人消费等。\n经鉴定，涉案房屋价值1700万元。星星房产公司报案后，甲主动投案，并如实供述自己的犯罪事实，并协助公安机关抓获了乙。乙到案后如实供述了自己的犯罪事实。\n请结合上述材料分析：","options":[],"answerRef":"1、甲、乙的行为应如何认定？\n甲、乙构成诈骗罪的共同犯罪。理由：（1）甲、乙以非法占有为目的，利用伪造的材料欺骗不动产登记中心，使其基于认识错误处分星星房产公司的10套房产，致使星星房产公司遭受重大损失，故甲、乙构成诈骗罪的共同犯罪。（2）甲、乙在取得不动产登记后，虽然将10套房产抵押给个人及小额贷款公司以借款800万元，但抵押权人属于善意第三人，不存在财产损失。因此，甲、乙不构成贷款诈骗罪或者合同诈骗罪。\n2、甲、乙的犯罪数额如何认定？理由是什么？\n甲、乙的犯罪数额为1700万元。理由：甲、乙在取得不动产登记后，诈骗行为已经既遂。甲、乙因诈骗行为非法取得的财物价值为1700万元，因此其犯罪数额为1700万元。由于甲、乙对抵押权人不构成犯罪，故800万元不属于犯罪数额。\n3、甲、乙具有哪些法定的量刑情节以及如何处理？\n（1）甲的量刑情节：①甲在诈骗罪的共同犯罪中是主犯；②甲犯罪后自动投案，并如实供述自己罪行，构成自首，可以从轻或者减轻处罚；③甲到案后，协助公安机关抓获同案犯乙，具有重大立功情节，可以减轻或者免除处罚。\n（2）乙的量刑情节：①乙在诈骗罪的共同犯罪中是从犯，应当从轻、减轻或者免除处罚；②乙被动归案后，如实供述了自己的犯罪事实，成立坦白，可以从轻处罚。","auto":null,"link":"https://weibo.com/1669134634/QhcpK4890"},{"num":921,"day":"2025-12-07","stem":"2021年5月至2022年3月，甲将有毒物质注入注射器，然后将注射器捆绑在鱼竿上。两人共谋由乙驾驶摩托车，甲使用鱼竿捅到狗身上将狗毒死，然后将被毒死的狗卖给狗肉馆。\n经查，甲、乙共毒死他人的家养土狗20余条，非法获利6000元。甲曾因销售有毒、有害食品罪被判处一年有期徒刑，并于2018年9月刑满释放。\n根据上述案情，分析对甲、乙的行为应当如何认定？并指明相应的量刑情节。","options":[],"answerRef":"1、关于甲、乙的定罪问题\n甲、乙构成盗窃罪与销售有毒、有害食品罪的共同犯罪，应当数罪并罚。理由：（1）甲、乙以非法占有为目的，共同使用毒药盗窃他人家养的土狗，数额较大，构成盗窃罪的共犯。（2）甲、乙共同销售明知掺有有毒、有害的非食品原料的食品，构成销售有毒、有害食品罪的共犯。\n【注意】（不用写）牵连犯是指犯罪的手段行为与目的行为触犯不同罪名，原因行为与结果行为触犯不同罪名。牵连犯是学术上的观点，理论上倾向于认定一罪，但是对于单一罪名无法同时准确描述、涵盖原因行为与结果行为的，或者为了突出对某种权益的特殊保护，通常法律或者司法解释规定予以数罪并罚。\n2、关于甲、乙的量刑问题\n（1）对甲、乙应当以盗窃罪与销售有毒、有害食品罪实行数罪并罚。\n（2）甲、乙在盗窃罪与销售有毒、有害食品罪的共同犯罪中，均为主犯；\n（3）甲构成累犯，应当从重处罚。理由：甲因销售有毒、有害食品罪被判处1年有期徒刑，在刑罚执行完毕后5年内又故意再犯应当被判处有期徒刑以上刑罚之罪，故成立累犯。","auto":null,"link":"https://weibo.com/1669134634/QhjDOp8oY"},{"num":922,"day":"2025-12-08","stem":"甲驾驶无人售票公交车，乙乘上该车。甲要求乙往里走，乙不听从劝告，反以甲出言不逊为由，挥拳殴打正在驾车行驶的甲，击中甲的脸部。\n甲被殴后随即离开驾驶座位，抬腿踢向乙，两人扭打在一起。 公交车因无人控制偏离行驶路线，接连撞到相向行驶的自行车和其他车辆，撞毁附近住宅小区的一段围墙，造成骑自行车的丙因严重颅脑损伤而当场死亡。甲见车内乘客报警，而在现场等待，并向警察如实供述以上事实。\n请根据上述材料回答下列问题并说明理由：","options":[],"answerRef":"1. 辩护人认为，甲的行为不构成交通肇事罪，你是否认同该观点？\n认同。理由：甲在驾驶公交车过程中，离开驾驶座位，放任危害公共安全结果发生，并造成一人死亡的后果。甲的行为达到了与放火等危险相当的程度，应当认定为以危险方法危害公共安全罪。由于交通肇事罪属于过失犯罪，故辩护人认为甲不构成交通肇事罪的观点是正确的。\n2. 辩护人认为，对乙应当以交通肇事罪定罪处罚。你是否认同该观点？\n认同。理由：（1）乙在行驶中的公交车上对司机甲使用暴力，干扰公交车正常运行，危及公共安全，构成妨害安全驾驶罪。（2）乙违反交通运输管理法规，殴打司机甲，致使发生重大事故，造成一人死亡，构成交通肇事罪。（3）乙的行为构成妨害安全驾驶罪与交通肇事罪的想象竞合犯，从一重罪处罚，应当认定为交通肇事罪。\n3. 甲具有哪些量刑情节？\n（1）甲的行为致一人死亡，构成以危险方法危害公共安全罪的结果加重犯，按照加重处罚情节处理。\n（2）甲的行为成立自首，可以从轻或者减轻处罚。甲犯罪以后，明知乘客报警而在现场等待，且无拒捕行为，根据司法解释，甲属于自动投案。甲到案后如实供述自己罪行，故甲的行为成立自首。","auto":null,"link":"https://weibo.com/1669134634/QhtC07mpD"}]}

var CUR_MOD = (function(){
  var saved = 'x';
  try { saved = localStorage.getItem('wbq-module') || 'minfa'; } catch (e) {}
  return MODULES[saved] ? saved : 'minfa';
})();
function curMod() { return MODULES[CUR_MOD]; }
var DATA = curMod().data;
var PROGRESS_KEY = 'wbq-' + CUR_MOD + '-progress-v1';
var HISTORY_KEY = 'wbq-' + CUR_MOD + '-history-v1';
var SYNC_KEY = 'wbq-' + CUR_MOD + '-sync-v1';
var SYNC_URLS = curMod().syncUrls;
var P = loadProgress();
var current = [];     // 当前抽取的题号
var cursor = 0;       // 当前展示到第几题
var mode = 'normal';  // normal | wrong
var roundResult = [];
var roundLogged = false;
var HIST = loadHistory();

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch (e) { return []; }
}
function saveHistory() {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(HIST.slice(0, 100))); } catch (e) {}
}

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveProgress() {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(P)); } catch (e) {}
}
function rec(num) { if (!P[num]) P[num] = { c:0, w:0, m:false, last:0 }; return P[num]; }
function weight(q) {
  var s = P[q.num];
  var w = 1;
  if (!s || (s.c === 0 && s.w === 0)) w = 5;          // 未做过优先
  else {
    if (s.c > 0) w *= Math.pow(0.3, s.c);             // 答对过 → 权重降低
    if (s.w > 0) w *= 1.6;                            // 答错过 → 权重略升
  }
  if (s && s.m) w *= 4;                               // 主动标记 → 权重升高
  return w;
}
function pool() {
  var arr = DATA.questions.slice();
  if (mode === 'wrong') arr = arr.filter(function(q){ var s = P[q.num]; return s && s.w > 0; });
  return arr;
}
function draw(n) {
  var arr = pool();
  var ws = arr.map(function(q){ return weight(q); });
  var total = ws.reduce(function(a,b){ return a + b; }, 0);
  var picked = [];
  while (picked.length < n && arr.length > 0) {
    var r = Math.random() * total;
    var idx = 0, acc = 0;
    for (; idx < arr.length; idx++) { acc += ws[idx]; if (r < acc) break; }
    if (idx >= arr.length) idx = arr.length - 1;
    picked.push(arr[idx]);
    total -= ws[idx];
    ws.splice(idx, 1);
    arr.splice(idx, 1);
  }
  return picked;
}
function fmtDate(d) {
  var a = d.split('-');
  return a[0] + '年' + Number(a[1]) + '月' + Number(a[2]) + '日';
}
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function stats() {
  var total = DATA.questions.length;
  var done = 0, ok = 0, marked = 0;
  DATA.questions.forEach(function(q){
    var s = P[q.num];
    if (s) { if (s.c > 0 || s.w > 0) done++; ok += s.c; if (s.m) marked++; }
  });
  var rate = done ? Math.round(ok / done * 100) : 0;

function setSyncLine(html, cls) {

function sanitizeRemote(j) {
  if (!j || !Array.isArray(j.questions) || !j.questions.length) return null;
  var qs = j.questions.filter(function(q){ return q && typeof q.num === 'number' && q.stem; });
  qs.forEach(function(q){ if (q.link && !/^https?:\/\//.test(q.link)) q.link = ''; });
  if (!qs.length) return null;
  return { author: j.author || '', generated: j.generated || '', questions: qs };
}
function mergeInto(local, remote) {
  var byNum = {};
  (local.questions || []).forEach(function(q){ byNum[q.num] = q; });
  remote.questions.forEach(function(q){ if (!byNum[q.num]) byNum[q.num] = q; });
  var qs = Object.keys(byNum).map(function(k){ return byNum[k]; }).sort(function(a,b){ return a.num - b.num; });
  var gen = (remote.generated || '').slice(0, 10) >= (local.generated || '').slice(0, 10) ? remote.generated : local.generated;
  return { author: remote.author || local.author, generated: gen || local.generated, questions: qs };
}

function fetchJson(url, ms) {
  return new Promise(function(resolve){
    var done = false;
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function(){ try { if (ctrl) ctrl.abort(); } catch (e) {} finish(null); }, ms || 8000);
    function finish(v){ if (!done) { done = true; clearTimeout(timer); resolve(v); } }
    fetch(url, ctrl ? { signal: ctrl.signal } : {}).then(function(r){ return r.ok ? r.json() : null; })
      .then(finish).catch(function(){ finish(null); });
  });
}
function restoreSynced() {
  try {
    var s = JSON.parse(localStorage.getItem(SYNC_KEY));
    var r = sanitizeRemote(s);
    if (r && r.questions.length > DATA.questions.length) {
      DATA = mergeInto(DATA, r);
      refreshInfo();
    }
  } catch (e) {}
}
function syncOnline() {
  setSyncLine('在线同步中…');
  (function attempt(i){
    if (i >= SYNC_URLS.length) { setSyncLine('⚠️ 在线同步失败，当前为离线题库', 'no'); return; }
    fetchJson(SYNC_URLS[i]).then(function(j){
      var r = sanitizeRemote(j);
      if (r) {
        var before = DATA.questions.length;
        DATA = mergeInto(DATA, r);
        try { localStorage.setItem(SYNC_KEY, JSON.stringify(DATA)); } catch (e) {}
        var added = DATA.questions.length - before;
        setSyncLine(added > 0
          ? '✅ 已自动更新：新增 ' + added + ' 题，题库共 ' + DATA.questions.length + ' 题（' + DATA.generated + '）'
          : '✅ 已是最新：共 ' + DATA.questions.length + ' 题（' + DATA.generated + '）', 'ok');
        refreshInfo();
      } else {
        attempt(i + 1);
      }
    });
  })(0);
}

  function close() {
    if (mask.classList.contains('hide')) return;
    mask.classList.add('hide');
    if (wrap && 'inert' in wrap) wrap.inert = false;
    setTimeout(function () { mask.remove(); }, 520);
  }
  mask.addEventListener('click', close);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); close(); }
  });
})();
</script>
</body>
</html>
